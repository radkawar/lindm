# Local socket access is confined to the postgres container. Runtime and
# migration roles can connect remotely only to their database over TLS+SCRAM.
local all postgres trust
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
hostssl lindm lindm_runtime,lindm_migrator 0.0.0.0/0 scram-sha-256
hostssl lindm lindm_runtime,lindm_migrator ::/0 scram-sha-256
