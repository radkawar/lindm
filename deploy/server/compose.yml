# Laboratory topology, not the protected turnkey container installation path.
# Explicit operations provision PostgreSQL, migrate and issue a protected setup
# code before runtime; ordinary startup never applies DDL or claims an owner.
# LINDM_CONFIG_DIR is an absolute protected directory. Runtime inputs are 0600
# owned by LINDM_UID (default65532). Load authenticated images locally; never use
# public registry pulls as a deployment or air-gap fallback.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  pids_limit: 256
  mem_limit: 1g
  memswap_limit: 1g
  ulimits:
    core:
      soft: 0
      hard: 0
  cpus: 2.0
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

x-runtime: &runtime
  <<: *hardening
  image: ${LINDM_IMAGE:?set released lindmd image digest}
  user: "${LINDM_UID:-65532}:${LINDM_GID:-65532}"
  volumes:
    - ${LINDM_CONFIG_DIR:?set absolute protected configuration directory}/server.json:/etc/lindm/server.json:ro
    - ${LINDM_CONFIG_DIR}/database-url:/etc/lindm/database-url:ro
    - ${LINDM_CONFIG_DIR}/transport-ca.crt:/etc/lindm/transport-ca.crt:ro
    - ${LINDM_CONFIG_DIR}/server.crt:/etc/lindm/server.crt:ro
    - ${LINDM_CONFIG_DIR}/server.key:/etc/lindm/server.key:ro
    - ${LINDM_CONFIG_DIR}/device-ca.crt:/etc/lindm/device-ca.crt:ro
    - ${LINDM_CONFIG_DIR}/device-ca.key:/etc/lindm/device-ca.key:ro
  networks: [database, frontend]

services:
  postgres:
    <<: *hardening
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    # Only the official entrypoint starts as root to prepare owned data/key files;
    # it drops to postgres before starting the database. No host port is exposed.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    restart: unless-stopped
    environment:
      POSTGRES_DB: lindm
      POSTGRES_PASSWORD_FILE: /var/lib/postgresql/bootstrap-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    entrypoint: ["/bin/sh", "/opt/lindm/postgres-entrypoint.sh"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ${LINDM_CONFIG_DIR}/postgres.crt:/run/lindm/postgres.crt:ro
      - ${LINDM_CONFIG_DIR}/postgres.key:/run/lindm/postgres.key:ro
      - ${LINDM_CONFIG_DIR}/postgres-password:/run/lindm/postgres-password:ro
      - ${LINDM_CONFIG_DIR}/database-init.sql:/run/lindm/database-init.sql:ro
      - ./postgres-entrypoint.sh:/opt/lindm/postgres-entrypoint.sh:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m
      - /docker-entrypoint-initdb.d:rw,noexec,nosuid,nodev,size=1m
    shm_size: 128m
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "lindm"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 10s
    networks: [database]

  migrate:
    <<: *hardening
    image: ${LINDM_IMAGE}
    user: "${LINDM_UID:-65532}:${LINDM_GID:-65532}"
    profiles: [operations]
    command: ["migrate", "-config", "/etc/lindm/migrate.json"]
    volumes:
      - ${LINDM_CONFIG_DIR}/migrate.json:/etc/lindm/migrate.json:ro
      - ${LINDM_CONFIG_DIR}/migration-database-url:/etc/lindm/migration-database-url:ro
      - ${LINDM_CONFIG_DIR}/transport-ca.crt:/etc/lindm/transport-ca.crt:ro
    logging:
      driver: none
    networks: [database]

  setup-code:
    <<: *hardening
    image: ${LINDM_IMAGE}
    user: "${LINDM_UID:-65532}:${LINDM_GID:-65532}"
    profiles: [operations]
    command:
      [
        "setup-code",
        "-config",
        "/etc/lindm/migrate.json",
        "-output",
        "/var/lib/lindmd-operations/setup/code",
      ]
    volumes:
      - ${LINDM_CONFIG_DIR}/migrate.json:/etc/lindm/migrate.json:ro
      - ${LINDM_CONFIG_DIR}/migration-database-url:/etc/lindm/migration-database-url:ro
      - ${LINDM_CONFIG_DIR}/transport-ca.crt:/etc/lindm/transport-ca.crt:ro
      - ${LINDM_SETUP_DIR:?set absolute issuer-owned 0700 setup output directory}:/var/lib/lindmd-operations/setup:rw
    logging:
      driver: none
    networks: [database]

  lindmd:
    <<: *runtime
    command: ["serve", "-config", "/etc/lindm/server.json"]
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "${LINDM_BIND_IP:-127.0.0.1}:${LINDM_ADMIN_PORT:-18444}:18444"
      - "${LINDM_BIND_IP:-127.0.0.1}:${LINDM_DEVICE_PORT:-18445}:18445"

volumes:
  postgres-data:

networks:
  database:
    internal: true
  frontend:
