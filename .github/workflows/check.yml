name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make bootstrap
      - run: make generate
      - name: Require committed generated contracts
        run: |
          changes="$(git status --porcelain -- gen web/gen internal/identity/identitydb internal/device/devicedb)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
      - run: make check test-integration
      - name: Stop development services
        if: always()
        run: make dev-down
