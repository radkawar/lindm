name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
      - run: node --test test/tooling/check-dco.test.mjs
      - run: node test/tooling/check-dco.mjs

  lint:
    name: Lint and generated contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Generated matrix documents use git ancestry.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make bootstrap
      - run: make generate-code
      - name: Require committed generated output
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
      # Includes golangci-lint, ESLint, Prettier, markdownlint, tsc, Buf
      # lint/format and devenv generate-docs -check. No VM lab is invoked.
      - run: make lint

  unit:
    name: Unit and dependency checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native package test tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes gnupg gpgv cloud-image-utils apt-utils dpkg-dev rpm rpm2cpio cpio createrepo-c systemd rsync
      - run: make bootstrap
      - run: make test audit

  integration-web:
    name: PostgreSQL, OIDC and Chromium
    # Public Linux hosted runners provide 16 GB. Integration admission still
    # requires 12 GiB available and no swap-out; private 8 GB runners cannot
    # meet that budget. Never reduce the lab safety budget to fit a runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native enrollment artifact tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes gnupg gpgv cloud-image-utils apt-utils dpkg-dev rpm rpm2cpio cpio createrepo-c systemd rsync
      - name: Require Docker Compose
        run: docker compose version
      - run: make bootstrap
      - name: Install locked Chromium and browser libraries
        run: ./node_modules/.bin/playwright install --with-deps chromium
      # The checkout-owned Compose fixture runs pinned PostgreSQL and Keycloak.
      # devenv sets LINDM_TEST_DATABASE_URL_FILE to its owner-only migration DSN
      # with sslmode=verify-full, plus the matching pg_dump container and the
      # freshly built native server. Do not substitute a plaintext CI DSN.
      - run: make test-integration
      - name: Exercise the real console in Chromium
        run: make check-web ACCEPTANCE_FLAGS="-engines chromium"
      # Fixture keys, DSNs, browser credentials and unreviewed evidence are not
      # uploaded. Full cross-browser/native VM evidence remains maintainer-run.
      - name: Stop this runner's development services
        if: always()
        run: make dev-down
