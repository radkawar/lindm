syntax = "proto3";

package lindm.auth.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "lindm/auth/v1/authorization.proto";

option go_package = "lindm/gen/lindm/auth/v1;authv1";

// SessionPrincipal is returned as protobuf JSON by GET /auth/session. Browser
// redirects and cookies stay HTTP-native; the response contract is still generated.
// csrf_token is request-session scoped and must never enter persistent storage.
message SessionPrincipal {
  string id = 1;
  string issuer = 2;
  string subject = 3;
  string display_name = 4;
  string role = 5;
  string csrf_token = 6;
  bool break_glass = 7;
  string incident_reason = 8;
  repeated string permissions = 9;
  bool service_account = 10;
  repeated RoleBinding bindings = 11;
  // Server-computed subset of permissions granted without a device scope. The
  // console derives navigation and global controls (enrollment, audit, accounts,
  // catalogs) from it; every request is still authorized by the server.
  repeated string unrestricted_permissions = 12;
}

// All authentication endpoints use protobuf JSON and no-store responses.
message AuthenticationOptions {
  bool external_login = 1;
  bool local_login = 2;
  bool break_glass = 3;
}

// Passwords and incident reasons must never be logged.
message LocalLoginRequest {
  string username = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
  }];
  string password = 2 [(buf.validate.field).string = {
    min_bytes: 12
    max_bytes: 1024
  }];
  string incident_reason = 3 [(buf.validate.field).string = {
    max_len: 512
    max_bytes: 1024
    pattern: "^$|\\S"
  }];
}

message LocalEnrollmentRequest {
  string secret = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 1024
  }];
  string password = 2 [(buf.validate.field).string = {
    min_bytes: 12
    max_bytes: 1024
  }];
}

// Re-verifies the signed-in local account (password, then its passkey) for
// actions that need recent verification. The session stays the same.
message LocalStepUpRequest {
  string password = 1 [(buf.validate.field).string = {
    min_bytes: 12
    max_bytes: 1024
  }];
}

// options_json contains the WebAuthn publicKey options object.
message WebAuthnChallenge {
  string token = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 1024
  }];
  string options_json = 2 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 65536
  }];
}

message WebAuthnFinishRequest {
  string token = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 1024
  }];
  string credential_json = 2 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 65536
  }];
}

message LocalAccount {
  string id = 1;
  string username = 2;
  string role = 3;
  bool enabled = 4;
  bool break_glass = 5;
  bool enrolled = 6;
  repeated DeviceScope scopes = 7;
}

message ListAccountsResponse {
  repeated LocalAccount accounts = 1;
  repeated string roles = 2;
}

message CreateAccountRequest {
  option (buf.validate.message).cel = {
    id: "create_account.break_glass_owner"
    message: "break-glass accounts must be owners"
    expression: "!this.break_glass || this.role == 'owner'"
  };
  string username = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
  }];
  string role = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-z][a-z0-9_.-]*$"
  }];
  bool break_glass = 3;
  repeated DeviceScope scopes = 4 [(buf.validate.field).repeated.max_items = 100];
}

message UpdateAccountRequest {
  option (buf.validate.message).cel = {
    id: "update_account.break_glass_owner"
    message: "break-glass accounts must be owners"
    expression: "!this.break_glass || this.role == 'owner'"
  };
  string account_id = 1 [(buf.validate.field).string.uuid = true];
  bool enabled = 2;
  string role = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-z][a-z0-9_.-]*$"
  }];
  bool break_glass = 4;
  repeated DeviceScope scopes = 5 [(buf.validate.field).repeated.max_items = 100];
}

message ResetAccountRequest {
  string account_id = 1 [(buf.validate.field).string.uuid = true];
}

// The one-time secret is held only in component memory, never cached or logged.
message AccountEnrollment {
  string account_id = 1;
  string secret = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// GET /auth/settings is read-only and requires unrestricted accounts.manage.
// Observations describe only the signed-in principal, never tenant-wide health.
message IdentitySettings {
  string primary_source = 1;
  string issuer = 2;
  uint32 refresh_interval_seconds = 3;
  uint32 max_snapshot_age_seconds = 4;
  bool scim_enabled = 5;
  bool broker_enabled = 6;
  bool break_glass_enabled = 7;
  string upstream_source = 8;
  google.protobuf.Timestamp observed_at = 9;
  bool current = 10;
  bool local_authority = 11;
}

message RotateSCIMCredentialRequest {
  string connector_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-z][a-z0-9_-]*$"
  }];
}

// Returned once, no-store; the bearer token must never enter logs or query caches.
message SCIMCredential {
  string connector_id = 1;
  string bearer_token = 2;
}
