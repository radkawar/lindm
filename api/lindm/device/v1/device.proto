syntax = "proto3";

package lindm.device.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "lindm/agent/v1/execution_trust.proto";
import "lindm/agent/v1/update.proto";
import "lindm/device/v1/assistance.proto";
import "lindm/device/v1/device_actions.proto";
import "lindm/device/v1/inventory_refresh.proto";
import "lindm/device/v1/service_dispatch.proto";
import "lindm/inventory/v1/observation.proto";

option go_package = "lindm/gen/lindm/device/v1;devicev1";

service DeviceService {
  rpc AcquireSession(AcquireSessionRequest) returns (AcquireSessionResponse);
  rpc GetSyncState(GetSyncStateRequest) returns (GetSyncStateResponse);
  rpc GetExecutionTrust(GetExecutionTrustRequest) returns (GetExecutionTrustResponse);
  rpc ReportHostObservation(ReportHostObservationRequest) returns (ReportHostObservationResponse);
  rpc ReportPackageAttempt(ReportPackageAttemptRequest) returns (ReportPackageAttemptResponse);
  rpc BeginPackageSnapshot(BeginPackageSnapshotRequest) returns (BeginPackageSnapshotResponse);
  rpc PutPackageBatch(PutPackageBatchRequest) returns (PutPackageBatchResponse);
  rpc CommitPackageSnapshot(CommitPackageSnapshotRequest) returns (CommitPackageSnapshotResponse);
  rpc RenewIdentity(RenewIdentityRequest) returns (RenewIdentityResponse);
  // Registers the identity-signed HPKE recipient key of the presented
  // certificate. Idempotent; the key only receives sealed secret deliveries.
  rpc RegisterEncryptionKey(RegisterEncryptionKeyRequest) returns (RegisterEncryptionKeyResponse);
  // Returns the current server-owned service action, minting it only when no
  // open action exists. Never implies the device is compliant.
  rpc GetResourceWork(GetResourceWorkRequest) returns (GetResourceWorkResponse);
  // Reauthorizes the original actor, desired head and device fences before
  // signing a start grant for the exact device challenge.
  rpc AuthorizeResourceStart(AuthorizeResourceStartRequest) returns (AuthorizeResourceStartResponse);
  // Admits a nonce-bound device attestation of protected action history.
  rpc ReportResourceResult(ReportResourceResultRequest) returns (ReportResourceResultResponse);
  rpc GetDeviceActionWork(GetDeviceActionWorkRequest) returns (GetDeviceActionWorkResponse);
  rpc AuthorizeDeviceActionStart(AuthorizeDeviceActionStartRequest) returns (AuthorizeDeviceActionStartResponse);
  rpc ReportDeviceActionResult(ReportDeviceActionResultRequest) returns (ReportDeviceActionResultResponse);
  rpc RegisterDeviceActionRecovery(RegisterDeviceActionRecoveryRequest) returns (RegisterDeviceActionRecoveryResponse);
  rpc ConfirmRefreshInventoryPublication(ConfirmRefreshInventoryPublicationRequest) returns (ConfirmRefreshInventoryPublicationResponse);
  // SyncAssistance exchanges complete assistance state; see assistance.proto.
  rpc SyncAssistance(SyncAssistanceRequest) returns (SyncAssistanceResponse);
}
message AcquireSessionRequest {
  bytes authority_proof = 1 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 16384
  }];
}
message AcquireSessionResponse {
  uint64 session_epoch = 1;
  uint64 host_sequence = 2;
  uint64 package_sequence = 3;
  google.protobuf.Timestamp server_time = 4;
}
message GetSyncStateRequest {
  uint64 session_epoch = 1 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  // Optional diagnostic telemetry from the executor, not a signed health proof.
  lindm.agent.v1.AgentUpdateStatus agent_update = 2;
}
message GetSyncStateResponse {
  uint64 session_epoch = 1;
  uint64 host_sequence = 2;
  uint64 package_sequence = 3;
  google.protobuf.Timestamp server_time = 4;
}

// Untrusted selection hints, not a device-signed applied-authority receipt.
message GetExecutionTrustRequest {
  uint64 session_epoch = 1 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  uint64 root_version = 2 [(buf.validate.field).uint64.gt = 0];
  bytes root_sha256 = 3 [(buf.validate.field).bytes.len = 32];
  uint64 delegation_version = 4;
  bytes delegation_sha256 = 5 [(buf.validate.field).bytes.max_len = 32];
  uint64 minimum_recovery_epoch = 6;
  option (buf.validate.message).cel = {
    id: "execution_trust_cursor.complete"
    message: "delegation digest and recovery floor must agree with configuration state"
    expression: "(this.delegation_version == 0u && this.delegation_sha256.size() == 0 && this.minimum_recovery_epoch == 0u) || (this.delegation_version > 0u && this.delegation_sha256.size() == 32)"
  };
}

message GetExecutionTrustResponse {
  lindm.agent.v1.UpdateExecutionTrustRequest update = 1;
  // Desired server authority only. Zeroes mean authority is not provisioned.
  uint64 root_version = 2;
  uint64 delegation_version = 3;
  uint64 minimum_recovery_epoch = 4;
}

// PackageBatchDescriptor binds one opaque inventory.v1.PackageBatch. SHA-256 and
// encoded_size cover those exact bytes, not a server reserialization.
message PackageBatchDescriptor {
  uint32 index = 1 [(buf.validate.field).uint32.lte = 511];
  bytes sha256 = 2 [(buf.validate.field).bytes.len = 32];
  uint32 count = 3 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 500
  }];
  uint32 encoded_size = 4 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 786432
  }];
}

// PackageSnapshotManifest is immutable for the life of the attempt. Session epoch
// is intentionally absent: a later acquisition must resume these exact bytes.
// Field 5 is reserved so epoch cannot be added without a new manifest version.
message PackageSnapshotManifest {
  reserved 5;
  reserved "session_epoch";

  string snapshot_id = 1 [(buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp created_at = 2 [(buf.validate.field).required = true];
  string enrollment_generation = 3 [(buf.validate.field).string.uuid = true];
  uint64 sequence = 4 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  google.protobuf.Timestamp started_at = 6 [(buf.validate.field).required = true];
  google.protobuf.Timestamp finished_at = 7 [(buf.validate.field).required = true];
  string backend = 8 [(buf.validate.field).string.max_len = 64];
  repeated PackageBatchDescriptor batches = 9 [(buf.validate.field).repeated.max_items = 512];
  option (buf.validate.message).cel = {
    id: "snapshot.time_order"
    message: "collection finish must not precede its start"
    expression: "this.finished_at >= this.started_at"
  };
}

message ReportHostObservationRequest {
  string enrollment_generation = 1 [(buf.validate.field).string.uuid = true];
  uint64 session_epoch = 2 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  uint64 sequence = 3 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  lindm.inventory.v1.HostObservation observation = 4 [(buf.validate.field).required = true];
}
message ReportHostObservationResponse {
  uint64 accepted_sequence = 1;
  google.protobuf.Timestamp server_time = 2;
}

message ReportPackageAttemptRequest {
  string enrollment_generation = 1 [(buf.validate.field).string.uuid = true];
  uint64 session_epoch = 2 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  uint64 sequence = 3 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  google.protobuf.Timestamp started_at = 4 [(buf.validate.field).required = true];
  google.protobuf.Timestamp finished_at = 5 [(buf.validate.field).required = true];
  // Success is published only by CommitPackageSnapshot.
  lindm.inventory.v1.CollectionStatus status = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [
      0,
      1,
      8
    ]
  }];
  string backend = 7 [(buf.validate.field).string.max_len = 64];
  option (buf.validate.message).cel = {
    id: "attempt.time_order"
    message: "collection finish must not precede its start"
    expression: "this.finished_at >= this.started_at"
  };
}
message ReportPackageAttemptResponse {
  uint64 accepted_sequence = 1;
  google.protobuf.Timestamp server_time = 2;
}

message BeginPackageSnapshotRequest {
  string enrollment_generation = 1 [(buf.validate.field).string.uuid = true];
  uint64 session_epoch = 2 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  PackageSnapshotManifest manifest = 3 [(buf.validate.field).required = true];
}
message BeginPackageSnapshotResponse {
  lindm.inventory.v1.SnapshotState state = 1;
  uint64 package_sequence = 2;
  google.protobuf.Timestamp accepted_at = 3;
  google.protobuf.Timestamp open_until = 4;
  google.protobuf.Timestamp receipt_expires_at = 5;
  google.protobuf.Timestamp server_time = 6;
}

message PutPackageBatchRequest {
  string enrollment_generation = 1 [(buf.validate.field).string.uuid = true];
  uint64 session_epoch = 2 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  string snapshot_id = 3 [(buf.validate.field).string.uuid = true];
  uint32 batch_index = 4 [(buf.validate.field).uint32.lte = 511];
  // Opaque inventory.v1.PackageBatch, at most 768 KiB.
  bytes batch = 5 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 786432
  }];
}
message PutPackageBatchResponse {
  lindm.inventory.v1.SnapshotState state = 1;
  google.protobuf.Timestamp accepted_at = 2;
  google.protobuf.Timestamp server_time = 3;
}

message CommitPackageSnapshotRequest {
  string enrollment_generation = 1 [(buf.validate.field).string.uuid = true];
  uint64 session_epoch = 2 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  PackageSnapshotManifest manifest = 3 [(buf.validate.field).required = true];
}
message CommitPackageSnapshotResponse {
  lindm.inventory.v1.SnapshotState state = 1;
  uint64 package_sequence = 2;
  uint64 published_sequence = 3;
  google.protobuf.Timestamp accepted_at = 4;
  google.protobuf.Timestamp receipt_expires_at = 5;
  google.protobuf.Timestamp server_time = 6;
}

message RenewIdentityRequest {
  bytes csr_pem = 1 [(buf.validate.field).bytes = {
    min_len: 64
    max_len: 16384
  }];
  bytes authority_proof = 2 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 16384
  }];
}
message RenewIdentityResponse {
  bytes certificate_pem = 1;
  google.protobuf.Timestamp expires_at = 2;
}
message RegisterEncryptionKeyRequest {
  uint64 session_epoch = 1 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  // DSSE lindm.agent.v1.DeviceEncryptionKeyAttestation signed by the mTLS identity key.
  bytes attestation_envelope = 2 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 16384
  }];
}
message RegisterEncryptionKeyResponse {
  bytes public_key_sha256 = 1;
  bytes certificate_sha256 = 2;
}
