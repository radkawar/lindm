syntax = "proto3";

package lindm.device.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "lindm/gen/lindm/device/v1;devicev1";

// Server-owned resource work for the authenticated device generation.
// The server retains every signed byte; retries return those exact bytes and
// never mint new authority for an existing action.
message ResourceWork {
  string action_id = 1 [(buf.validate.field).string.uuid = true];
  // Plan-role DSSE ResourceExecutionIntent. Authorizes preflight only.
  bytes intent_envelope = 2 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 131072
  }];
  // Previously issued exact start-role grant, if any. Present after a lost
  // AuthorizeResourceStart response; it is never a fresh authorization.
  bytes start_grant_envelope = 3 [(buf.validate.field).bytes.max_len = 16384];
  // Fresh server-selected nonce for one ReportResourceResult attestation.
  bytes result_nonce = 4 [(buf.validate.field).bytes.len = 32];
  google.protobuf.Timestamp result_nonce_expires_at = 5 [(buf.validate.field).required = true];
  // Stop only this intent's ungranted preparation and attest its terminal result.
  // The server keeps the action open until owned staging cleanup is acknowledged.
  bool cancel_preparation = 6;
  // HPKE deliveries sealed once at mint to this generation's attested key, in
  // signed intent order. Opaque to the network process; replayed byte-exact.
  repeated bytes sealed_secrets = 7 [(buf.validate.field).repeated = {
    max_items: 8
    items: {
      bytes: {
        min_len: 1
        max_len: 8192
      }
    }
  }];
  option (buf.validate.message).cel = {
    id: "resource_work.cancel_ungranted"
    message: "preparation cancellation cannot carry start authority"
    expression: "!this.cancel_preparation || this.start_grant_envelope.size() == 0"
  };
}

message GetResourceWorkRequest {
  uint64 session_epoch = 1 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
}

message GetResourceWorkResponse {
  // Absent means no current action needs this device. It is not compliance.
  ResourceWork work = 1;
}

message AuthorizeResourceStartRequest {
  uint64 session_epoch = 1 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  string action_id = 2 [(buf.validate.field).string.uuid = true];
  // Exact executor-returned device-key DSSE ResourceExecutionChallenge.
  bytes challenge_proof = 3 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 16384
  }];
}

message AuthorizeResourceStartResponse {
  // Start-role DSSE ResourceExecutionStartGrant. An exact retry returns the
  // original bytes; a lapsed challenge requires a new server action.
  bytes start_grant_envelope = 1 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 16384
  }];
}

message ReportResourceResultRequest {
  uint64 session_epoch = 1 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  string action_id = 2 [(buf.validate.field).string.uuid = true];
  // Exact executor AttestResourceExecution output for the issued result nonce.
  bytes attestation_envelope = 3 [(buf.validate.field).bytes = {max_len: 262144}];
  bytes certificate_pem = 4 [(buf.validate.field).bytes = {max_len: 16384}];
  // Authenticated cancellation acknowledgment only, never native evidence.
  ResourcePreparationCancellation never_prepared = 5;
  option (buf.validate.message).cel = {
    id: "resource_result.evidence"
    message: "a result carries either signed native history or an exact never-prepared cancellation acknowledgment"
    expression: "has(this.never_prepared) ? (this.attestation_envelope.size() == 0 && this.certificate_pem.size() == 0) : (this.attestation_envelope.size() > 0 && this.certificate_pem.size() > 0)"
  };
}

message ResourcePreparationCancellation {
  bytes intent_sha256 = 1 [(buf.validate.field).bytes.len = 32];
  bytes result_nonce = 2 [(buf.validate.field).bytes.len = 32];
}

message ReportResourceResultResponse {
  // True when the server will issue no further work for this action.
  bool closed = 1;
}
