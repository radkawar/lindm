syntax = "proto3";

package lindm.device.v1;

import "buf/validate/validate.proto";
import "lindm/agent/v1/assistance.proto";
import "lindm/agent/v1/assistance_recording.proto";

option go_package = "lindm/gen/lindm/device/v1;devicev1";

// SyncAssistanceRequest reports the device's complete observed state for each
// assistance session it knows. Reports are idempotent state, not events.
message SyncAssistanceRequest {
  uint64 session_epoch = 1 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  repeated lindm.agent.v1.AssistanceReport reports = 2 [(buf.validate.field).repeated.max_items = 8];
  // The executor's applied remote-assistance setting; UNSPECIFIED from agents
  // that predate it leaves the server's view unknown.
  lindm.agent.v1.AssistanceEnablement policy = 3 [(buf.validate.field).enum.defined_only = true];
  option (buf.validate.message).cel = {
    id: "device_sync_assistance.one_content"
    message: "only one device command result may carry content"
    expression: "this.reports.filter(r, has(r.command_result) && r.command_result.text != '').size() <= 1"
  };
}

// SyncAssistanceResponse carries the complete desired state for every open
// session of this device and recently ended sessions the device has not
// confirmed. A session absent from directives is not authorized.
message SyncAssistanceResponse {
  repeated lindm.agent.v1.AssistanceDirective directives = 1 [(buf.validate.field).repeated.max_items = 8];
  option (buf.validate.message).cel = {
    id: "device_sync_assistance.one_command"
    message: "only one device command may be outstanding"
    expression: "this.directives.filter(d, has(d.command)).size() <= 1"
  };
}

// PutAssistanceRecordingRequest stores contiguous sealed segments of the
// recording authorized for one session of this device. The server stores the
// ciphertext as received and never decrypts it outside authorized retrieval.
message PutAssistanceRecordingRequest {
  uint64 session_epoch = 1 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  string session_id = 2 [(buf.validate.field).string = {
    uuid: true
    not_in: "00000000-0000-0000-0000-000000000000"
  }];
  repeated lindm.agent.v1.AssistanceRecordingChunk chunks = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 4
  }];
  option (buf.validate.message).cel = {
    id: "put_assistance_recording.one_recording"
    message: "segments belong to one recording"
    expression: "this.chunks.all(c, c.recording_id == this.chunks[0].recording_id)"
  };
}
message PutAssistanceRecordingResponse {
  // Every segment up to and including this sequence is durable.
  uint32 stored_through = 1;
}
