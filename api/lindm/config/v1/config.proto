// SPDX-License-Identifier: Apache-2.0

syntax = "proto3";

package lindm.config.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "lindm/advisory/v1/feed.proto";
import "lindm/agent/v1/assistance.proto";
import "lindm/agent/v1/connectivity_guard.proto";
import "lindm/auth/v1/authorization.proto";
import "lindm/validation/v1/string_rules.proto";

option go_package = "lindm/gen/lindm/config/v1;configv1";

// ServerConfig is the only serialized configuration contract for lindmd.
// Secrets are referenced by protected files, never embedded in configuration.
message ServerConfig {
  option (buf.validate.message).cel = {
    id: "listeners.distinct"
    message: "administrative and device listeners must be distinct"
    expression: "!has(this.admin_listener) || !has(this.device_listener) || this.admin_listener != this.device_listener"
  };
  option (buf.validate.message).cel = {
    id: "profiling.distinct_listener"
    message: "profiling must use a separate listener"
    expression: "!has(this.profiling) || ((!has(this.admin_listener) || this.profiling.listener != this.admin_listener) && (!has(this.device_listener) || this.profiling.listener != this.device_listener))"
  };
  option (buf.validate.message).cel = {
    id: "execution_signing.bootstrap"
    message: "execution signing requires an execution bootstrap"
    expression: "!has(this.execution_signing) || has(this.execution_bootstrap)"
  };
  option (buf.validate.message).cel = {
    id: "execution_bootstrap.device_origin"
    message: "execution bootstrap requires an explicit public device origin"
    expression: "!has(this.execution_bootstrap) || has(this.device_public_url)"
  };
  option (buf.validate.message).cel = {
    id: "execution_bootstrap.initial_owner"
    message: "initial execution delegation requires local authentication"
    expression: "!has(this.execution_bootstrap) || !has(this.execution_bootstrap.initial_delegation_file) || has(this.authentication.local)"
  };
  option (buf.validate.message).cel = {
    id: "authorization.source"
    message: "directory mappings must match the selected authority source"
    expression: "!has(this.authorization) || this.authorization.group_bindings.all(b, has(this.authentication.keycloak) ? b.group.startsWith('/') && size(b.group) > 1 : has(this.authentication.entra) ? b.group.matches('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') && b.group != '00000000-0000-0000-0000-000000000000' : has(this.authentication.okta) ? b.group.matches('^00g[A-Za-z0-9]{17}$') : has(this.authentication.google) ? b.group.matches('^[A-Za-z0-9_-]{1,256}$') : false)"
  };

  string deployment_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.not_in = "00000000-0000-0000-0000-000000000000"
  ];
  string public_url = 2 [
    (buf.validate.field).string.uri = true,
    (buf.validate.field).string.(lindm.validation.v1.https_origin) = true
  ];
  ListenerConfig admin_listener = 3 [(buf.validate.field).required = true];
  ListenerConfig device_listener = 4 [(buf.validate.field).required = true];
  DatabaseConfig database = 5 [(buf.validate.field).required = true];
  TLSConfig tls = 6 [(buf.validate.field).required = true];
  DeviceCAConfig device_ca = 7 [(buf.validate.field).required = true];
  AuthenticationConfig authentication = 8 [(buf.validate.field).required = true];
  // Additional outbound trust roots; empty uses the system trust store.
  string trusted_ca_file = 9 [(buf.validate.field).string.max_len = 4096];
  // Deployment cap on retained package-snapshot bytes, including opaque batch
  // payloads and finite manifest/receipt metadata. Absent selects the initial
  // 10 GiB budget. A present value is at least one maximum snapshot (64 MiB).
  optional uint64 inventory_budget_bytes = 10 [(buf.validate.field).uint64 = {
    gte: 67108864
    lte: 9223372036854775807
  }];
  optional string device_public_url = 11 [
    (buf.validate.field).string.uri = true,
    (buf.validate.field).string.(lindm.validation.v1.https_origin) = true
  ];
  // Public owner-pinned material only. Absence cannot erase previously
  // provisioned authority or authorize execution.
  ExecutionBootstrapConfig execution_bootstrap = 12;
  // Online plan and start PKCS#8 keys. Absence means this process has no
  // execution issuer. Presence does not admit a delegation or authorize issuance.
  ExecutionSigningConfig execution_signing = 13;
  // Independent emergency local-owner policy; never unions external grants.
  BreakGlassPolicy break_glass = 14;
  // No network requests occur unless refresh_enabled is explicitly true.
  AdvisoryConfig advisories = 15;
  // Enables integrations and report workers on this replica.
  IntegrationsConfig integrations = 16;
  // Bootstrap policy only. Once AdminService persists runtime authorization,
  // that complete policy takes precedence, including an explicitly empty policy.
  lindm.auth.v1.AuthorizationPolicy authorization = 17;
  // Separate recovery transport and at-rest custody; absent disables escrow.
  EscrowConfig escrow = 18;
  // Operator-only diagnostics. Absent means no listener or runtime sampling.
  ProfilingConfig profiling = 19;
  // Public signed repository; private signing keys are outside this directory.
  ReleaseRepositoryConfig release_repository = 20;
  reserved 21;
  reserved "enrollment_instructions";
  // Independent native firewall probe peers, provisioned by the server operator.
  // The enrolled device endpoint only confirms these exact external targets.
  repeated lindm.agent.v1.ConnectivityProbeTarget connectivity_probes = 22 [(buf.validate.field).repeated.max_items = 32];
  // Absent: remote assistance is not configured and requests are refused.
  AssistanceConfig assistance = 24;
  // Offline bundle import authority and the served native repository root.
  // Absent disables `lindmd bundle-import` and the /offline/ handler.
  OfflineBundleConfig offline_bundles = 23;
  option (buf.validate.message).cel = {
    id: "offline_bundles.release_repository"
    message: "offline bundle import requires a signing release repository"
    expression: "!has(this.offline_bundles) || (has(this.release_repository) && has(this.release_repository.signing) && has(this.execution_bootstrap))"
  };
  option (buf.validate.message).cel = {
    id: "connectivity_probes.authority"
    message: "native connectivity confirmation requires configured signing and at least four approved peers"
    expression: "this.connectivity_probes.size() == 0 || (has(this.execution_signing) && this.connectivity_probes.size() >= 4)"
  };
}

message ReleaseRepositoryConfig {
  string directory = 1 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  // Absent signing disables mutation but still permits verified update retrieval.
  ReleaseRepositorySigning signing = 2;
  // Private persistent TUF verification checkpoint, outside the public repository.
  // Required to admit recovery handoff; root trust comes from execution_bootstrap.
  optional string verification_state_directory = 3 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  // Immutable native publications beneath directory/repo/{apt,rpm,arch}, served
  // exclusively from this server's public_url. Keys are public exports only.
  NativeRepositoriesConfig native_repositories = 4;
}

message NativeRepositoriesConfig {
  // Independently configured full OpenPGP signer pins, never short key IDs.
  optional string apt_signing_key_fingerprint = 1 [(buf.validate.field).string.pattern = "^([0-9A-F]{40}|[0-9A-F]{64})$"];
  optional string rpm_signing_key_fingerprint = 2 [(buf.validate.field).string.pattern = "^([0-9A-F]{40}|[0-9A-F]{64})$"];
  optional string arch_signing_key_fingerprint = 3 [(buf.validate.field).string.pattern = "^([0-9A-F]{40}|[0-9A-F]{64})$"];
}
// Every authority below is independently provisioned out of band; nothing in a
// bundle can replace these pins.
message OfflineBundleConfig {
  // PEM SubjectPublicKeyInfo of the dedicated Ed25519 bundle-signing key.
  string signing_public_key_file = 1 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  // SHA-256 of that key's SPKI DER, pinned independently of the file.
  string signing_key_id = 2 [(buf.validate.field).string.pattern = "^[a-f0-9]{64}$"];
  // PEM release-attestation public key and its pinned SPKI SHA-256; release
  // SBOM/provenance/artifact statements are re-verified on every import.
  string release_attestation_public_key_file = 3 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  string release_attestation_key_id = 4 [(buf.validate.field).string.pattern = "^[a-f0-9]{64}$"];
  // Server-owned private directory. Imports stage below it and atomically
  // publish native repositories at repositories/ and the release export at
  // release/; only those two trees are served read-only below /offline/ on the
  // administrative listener.
  string directory = 5 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
}

message ReleaseRepositorySigning {
  // Protected directory with rollout.pem, snapshot.pem and timestamp.pem only.
  // Offline root.pem and targets.pem must not be present or exposed to lindmd.
  string directory = 1 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
}

message AdvisoryConfig {
  repeated lindm.advisory.v1.FeedSource feeds = 1 [(buf.validate.field).repeated.max_items = 32];
  bool refresh_enabled = 2;
  optional uint32 refresh_interval_seconds = 3 [(buf.validate.field).uint32 = {
    gte: 3600
    lte: 604800
  }];
  optional uint32 inventory_max_age_seconds = 4 [(buf.validate.field).uint32 = {
    gte: 300
    lte: 604800
  }];
  option (buf.validate.message).cel = {
    id: "advisories.unique"
    message: "feed IDs and distro/release/stream combinations must be unique"
    expression: "this.feeds.all(f, this.feeds.filter(x, x.id == f.id).size() == 1 && this.feeds.filter(x, x.distro == f.distro && x.release == f.release && x.platform_stream == f.platform_stream).size() == 1)"
  };
}

message IntegrationsConfig {
  // Exactly 32 raw bytes, loaded through the protected secret-file boundary.
  // All replicas must use the same key; retain it with encrypted database backups.
  string encryption_key_file = 1 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
}

message EscrowConfig {
  // One protected PKCS#8 RSA private key, at least 3072 bits.
  string transport_key_file = 1 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  // Exactly 32 random raw bytes. Never reuse another domain's encryption key.
  string wrapping_key_file = 2 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  // Always require a second human's approval for recovery-key, local-admin
  // password and secret reveals. When false, a reveal still needs approval
  // whenever another enabled human could approve it; only a sole eligible
  // admin reveals alone.
  bool reveal_approval_required = 3;
  option (buf.validate.message).cel = {
    id: "escrow.distinct_files"
    message: "escrow transport and wrapping keys must use distinct files"
    expression: "this.transport_key_file != this.wrapping_key_file"
  };
}

message ExecutionBootstrapConfig {
  string root_file = 1 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  string bootstrap_file = 2 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  // Strict UpdateExecutionTrustRequest JSON. Its signed update is admitted only
  // in the first owner's verified credential transaction, never at startup.
  optional string initial_delegation_file = 3 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
}

// ExecutionSigningConfig names protected unencrypted PKCS#8 Ed25519 files for
// the distinct online plan and start roles. It requires execution_bootstrap.
message ExecutionSigningConfig {
  option (buf.validate.message).cel = {
    id: "execution_signing.distinct_files"
    message: "plan and start signing keys must use distinct files"
    expression: "this.plan_key_file != this.start_key_file"
  };

  string plan_key_file = 1 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  string start_key_file = 2 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
}

// Binding uses an explicit IP address and port rather than a second address
// grammar. Hostname resolution belongs to public URLs, not local bind addresses.
message ListenerConfig {
  string address = 1 [(buf.validate.field).string.ip = true];
  uint32 port = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 65535
  }];
}

// ProfilingConfig enables a private plaintext HTTP listener, never a public RPC
// surface. Only literal loopback addresses are admitted; do not proxy this port.
// Sampling is process-wide for this server lifetime. The server exclusively owns
// block sampling and restores its disabled baseline on shutdown.
message ProfilingConfig {
  option (buf.validate.message).cel = {
    id: "profiling.loopback"
    message: "profiling requires literal 127.0.0.1 or ::1"
    expression: "has(this.listener) && this.listener.address in ['127.0.0.1', '::1']"
  };
  ListenerConfig listener = 1 [(buf.validate.field).required = true];
  // Fixed duration of each CPU capture; request parameters cannot extend it.
  uint32 cpu_profile_seconds = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 60
  }];
  uint32 mutex_profile_fraction = 3 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000000
  }];
  uint32 block_profile_rate_ns = 4 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000000000
  }];
}

message DatabaseConfig {
  string url_file = 1 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  uint32 max_connections = 2 [
    (buf.validate.field).uint32.gte = 2,
    (buf.validate.field).uint32.lte = 256
  ];
  // Only the explicit migration command reads this credential. Runtime replicas
  // need not mount it and should use a database role without DDL privileges.
  optional string migration_url_file = 3 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  // Separate pool for the console: identity/session checks and admin RPCs.
  // Device traffic saturating max_connections then cannot delay operators.
  // Absent selects 4. Each replica opens max_connections + admin_connections.
  optional uint32 admin_connections = 4 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 64
  }];
}

message TLSConfig {
  string certificate_file = 1 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  string private_key_file = 2 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
}

message DeviceCAConfig {
  string certificate_file = 1 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  string private_key_file = 2 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
}

message AuthenticationConfig {
  option (buf.validate.message).cel = {
    id: "authentication.scim_external"
    message: "SCIM supplements an external authority and cannot provision local accounts"
    expression: "!has(this.scim) || !has(this.local)"
  };
  oneof primary {
    option (buf.validate.oneof).required = true;
    LocalAuthentication local = 1;
    KeycloakDirectory keycloak = 2;
    EntraDirectory entra = 3;
    OktaDirectory okta = 4;
    GoogleDirectory google = 5;
  }
  SCIMConfig scim = 6;
}

// Local authentication uses only Postgres, passwords and mandatory WebAuthn.
message LocalAuthentication {}

message KeycloakDirectory {
  option (buf.validate.message).cel = {
    id: "keycloak.separate_clients"
    message: "login and directory access must use separate clients"
    expression: "this.client_id != this.directory_client_id"
  };
  option (buf.validate.message).cel = {
    id: "keycloak.distinct_upstream"
    message: "broker freshness requires a distinct original directory issuer"
    expression: "!has(this.upstream) || this.upstream.issuer != this.issuer"
  };

  string issuer = 1 [
    (buf.validate.field).string.uri = true,
    (buf.validate.field).string.(lindm.validation.v1.https_endpoint) = true
  ];
  string client_id = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  string client_secret_file = 3 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  string directory_client_id = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  string directory_client_secret_file = 5 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  reserved 6;
  reserved "administrator_groups";
  // Broker imports are restrictions only; upstream observations establish freshness.
  KeycloakBrokerUpstream upstream = 7;
}

// Microsoft Entra ID public-cloud OIDC and authoritative Microsoft Graph access.
message EntraDirectory {
  option (buf.validate.message).cel = {
    id: "entra.separate_clients"
    message: "login and directory access must use separate clients"
    expression: "this.client_id.lowerAscii() != this.directory_client_id.lowerAscii()"
  };

  string tenant_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.not_in = "00000000-0000-0000-0000-000000000000"
  ];
  string client_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.not_in = "00000000-0000-0000-0000-000000000000"
  ];
  string client_secret_file = 3 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  string directory_client_id = 4 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.not_in = "00000000-0000-0000-0000-000000000000"
  ];
  string directory_client_secret_file = 5 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  reserved 6;
  reserved "administrator_group_object_ids";
}

message OktaDirectory {
  option (buf.validate.message).cel = {
    id: "okta.separate_clients"
    message: "login and directory access must use separate clients"
    expression: "this.client_id != this.directory_client_id"
  };
  string issuer = 1 [
    (buf.validate.field).string.uri = true,
    (buf.validate.field).string.(lindm.validation.v1.https_endpoint) = true
  ];
  string client_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string client_secret_file = 3 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  string org_url = 4 [
    (buf.validate.field).string.uri = true,
    (buf.validate.field).string.(lindm.validation.v1.https_origin) = true
  ];
  string directory_client_id = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string directory_key_id = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  // Protected PEM RSA key for private_key_jwt, never an API token.
  string directory_private_key_file = 7 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
}

message GoogleDirectory {
  string client_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string client_secret_file = 2 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  string service_account_email = 3 [(buf.validate.field).string = {
    email: true
    max_len: 320
  }];
  string private_key_id = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  // Protected PEM RSA service-account key; delegation is read-only directory access.
  string private_key_file = 5 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
  string delegated_subject = 6 [(buf.validate.field).string = {
    email: true
    max_len: 320
  }];
  // Exact Workspace hosted-domain claim required from the signed login identity.
  string hosted_domain = 7 [(buf.validate.field).string = {
    hostname: true
    min_len: 1
    max_len: 253
  }];
}

message KeycloakBrokerUpstream {
  string alias = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
    pattern: "^[A-Za-z0-9_.-]+$"
  }];
  string connector_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-z][a-z0-9_-]*$"
  }];
  string issuer = 3 [
    (buf.validate.field).string.uri = true,
    (buf.validate.field).string.(lindm.validation.v1.https_endpoint) = true
  ];
  string directory_client_id = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string directory_client_secret_file = 5 [(buf.validate.field).string.(lindm.validation.v1.file_reference) = true];
}

// SCIM is a supplemental deny/revocation channel, never a freshness or grant source.
message SCIMConfig {
  option (buf.validate.message).cel = {
    id: "scim.unique_connectors"
    message: "SCIM connector IDs must be unique"
    expression: "this.connectors.all(c, this.connectors.filter(x, x.id == c.id).size() == 1)"
  };
  repeated SCIMConnector connectors = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 32
  }];
}

message SCIMConnector {
  option (buf.validate.message).cel = {
    id: "scim.unique_correlations"
    message: "immutable provider and login identities must be unique within a connector"
    expression: "this.correlations.all(c, this.correlations.filter(x, x.provider_id == c.provider_id || (x.issuer == c.issuer && x.subject == c.subject)).size() == 1)"
  };
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-z][a-z0-9_-]*$"
  }];
  repeated SCIMCorrelation correlations = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10000
  }];
}

message SCIMCorrelation {
  string provider_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string issuer = 2 [
    (buf.validate.field).string.uri = true,
    (buf.validate.field).string.(lindm.validation.v1.https_endpoint) = true
  ];
  string subject = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}

message BreakGlassPolicy {
  // This allowlist always applies, including when console_only is true.
  repeated string allowed_permissions = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 25,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string = {
      in: [
        "fleet.read",
        "enrollment.manage",
        "device.revoke",
        "audit.read",
        "execution_trust.manage",
        "profiles.manage",
        "resources.assign",
        "accounts.manage",
        "inventory.manage",
        "recovery_keys.read",
        "remote_execution.run",
        "remote_assistance.view",
        "remote_assistance.control",
        "remote_assistance.policy.manage",
        "remote_assistance.clipboard",
        "remote_assistance.keyboard",
        "remote_assistance.display",
        "remote_assistance.message",
        "scripts.run",
        "destructive.execute",
        "approvals.manage",
        "integrations.manage",
        "release_updates.manage",
        "advisory_exceptions.manage",
        "encryption.manage",
        "actions.lock",
        "actions.release-lock",
        "actions.quarantine",
        "secrets.manage",
        "secrets.reveal"
      ]
    }
  ];
  // Additionally require the actual request peer to be a loopback address.
  bool console_only = 2;
  google.protobuf.Duration max_session_lifetime = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration = {
      gt: {}
      lte: {seconds: 3600}
    }
  ];
  bool require_incident_reason = 4 [(buf.validate.field).bool.const = true];
}

// AssistanceConfig enables built-in graphical remote assistance with the
// embedded relay-only TURN service. Media is DTLS-SRTP end to end; the relay
// forwards ciphertext only between its own allocations.
message AssistanceConfig {
  AssistanceRelayConfig relay = 1 [(buf.validate.field).required = true];
  // Admission bound for non-ended sessions; zero selects 16.
  uint32 max_concurrent_sessions = 2 [(buf.validate.field).uint32.lte = 256];
  // Deployment ceiling, not an implicit per-device grant.
  lindm.agent.v1.AssistancePolicy policy_ceiling = 3;
}

message AssistanceRelayConfig {
  // UDP and TCP TURN listener.
  ListenerConfig listener = 1 [(buf.validate.field).required = true];
  // Address relay allocations bind and advertise. Peers may only reach other
  // allocations on this address.
  string relay_address = 2 [(buf.validate.field).string.ip = true];
  uint32 relay_port_min = 3 [(buf.validate.field).uint32 = {
    gte: 1024
    lte: 65535
  }];
  uint32 relay_port_max = 4 [(buf.validate.field).uint32 = {
    gte: 1024
    lte: 65535
  }];
  // TURN URIs advertised to devices and consoles, e.g. turn:relay.example:3478?transport=udp.
  repeated string urls = 5 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 4
    items: {
      string: {
        max_len: 256
        pattern: "^turn:[^\\s]+$"
      }
    }
  }];
  string realm = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z0-9.-]+$"
  }];
  option (buf.validate.message).cel = {
    id: "assistance_relay.ports"
    message: "relay_port_min must not exceed relay_port_max"
    expression: "this.relay_port_min <= this.relay_port_max"
  };
}
