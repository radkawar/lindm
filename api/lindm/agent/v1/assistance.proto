syntax = "proto3";

package lindm.agent.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "lindm/agent/v1/assistance_files.proto";
import "lindm/agent/v1/assistance_guidance.proto";
import "lindm/agent/v1/assistance_recording.proto";
import "lindm/agent/v1/assistance_unattended.proto";
import "lindm/validation/v1/string_rules.proto";

option go_package = "lindm/gen/lindm/agent/v1;agentv1";

// AssistanceMode is the capability requested by the operator. CONTROL also
// requires a separately visible local keyboard/pointer grant; the local user
// may still grant only viewing.
enum AssistanceMode {
  ASSISTANCE_MODE_UNSPECIFIED = 0;
  ASSISTANCE_MODE_VIEW = 1;
  ASSISTANCE_MODE_CONTROL = 2;
}

// AssistancePhase is the device-observed lifecycle. Phases only advance and
// ENDED is terminal.
enum AssistancePhase {
  ASSISTANCE_PHASE_UNSPECIFIED = 0;
  // The executor holds the invitation; no eligible helper has shown it yet.
  ASSISTANCE_PHASE_PENDING = 1;
  // The consent prompt is visible in the local graphical session.
  ASSISTANCE_PHASE_PROMPTED = 2;
  // Product consent and the portal grant exist; offer_sdp is ready.
  ASSISTANCE_PHASE_OFFERED = 3;
  // The DTLS-SRTP peer connection is established.
  ASSISTANCE_PHASE_ACTIVE = 4;
  ASSISTANCE_PHASE_ENDED = 5;
}

// AssistanceEndCause records why a session ended. It is audit data, not an
// error code.
enum AssistanceEndCause {
  ASSISTANCE_END_CAUSE_UNSPECIFIED = 0;
  // The local user declined the product prompt or cancelled the portal dialog.
  ASSISTANCE_END_CAUSE_DECLINED = 1;
  ASSISTANCE_END_CAUSE_CONSENT_TIMEOUT = 2;
  ASSISTANCE_END_CAUSE_OPERATOR_STOPPED = 3;
  // The local user used the product stop control.
  ASSISTANCE_END_CAUSE_USER_STOPPED = 4;
  // The portal session closed, including the desktop's own sharing indicator.
  ASSISTANCE_END_CAUSE_PORTAL_CLOSED = 5;
  ASSISTANCE_END_CAUSE_SESSION_LOCKED = 6;
  // Logout, UID/session change or loss of the session helper.
  ASSISTANCE_END_CAUSE_SESSION_ENDED = 7;
  // The hard maximum duration elapsed.
  ASSISTANCE_END_CAUSE_EXPIRED = 8;
  // Fresh authorization was not observed within the reauthorization window.
  ASSISTANCE_END_CAUSE_AUTHORIZATION_LOST = 9;
  ASSISTANCE_END_CAUSE_NO_ELIGIBLE_SESSION = 10;
  // Portal, PipeWire, encoder or relay capability was unavailable.
  ASSISTANCE_END_CAUSE_UNAVAILABLE = 11;
  ASSISTANCE_END_CAUSE_CONNECTION_FAILED = 12;
  // Device policy does not enable remote assistance.
  ASSISTANCE_END_CAUSE_DISABLED = 13;
  // Required recording could not be disclosed, stored or continued. A session
  // whose policy requires recording never continues unrecorded.
  ASSISTANCE_END_CAUSE_RECORDING_FAILED = 14;
}

message AssistanceIceServer {
  repeated string urls = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 4
    items: {
      string: {
        max_len: 256
        pattern: "^turns?:[^\\s]+$"
      }
    }
  }];
  string username = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string credential = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}

// AssistanceInvitation is the server-authorized, single-use support request.
message AssistanceInvitation {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  AssistanceMode mode = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string reason = 3 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
  string operator_display = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  // The local user must consent before this instant.
  google.protobuf.Timestamp consent_deadline = 5 [(buf.validate.field).required = true];
  // Hard maximum; extension requires a new invitation and fresh consent.
  google.protobuf.Timestamp ends_at = 6 [(buf.validate.field).required = true];
  // Empty selects the user of the active local graphical session.
  string target_username = 7 [(buf.validate.field).string.pattern = "^([a-zA-Z_][a-zA-Z0-9_.-]{0,31})?$"];
  // Relay-only ICE configuration with per-session credentials.
  repeated AssistanceIceServer ice_servers = 8 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 4
  }];
  AssistancePolicy requested_capabilities = 9;
  AssistancePolicy effective_capabilities = 10;
  // The ended session this invitation continues in a reconnect workflow. It is
  // disclosure only: no grant, portal token or media credential is reused.
  string reconnect_of = 11 [(buf.validate.field).string.pattern = "^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})?$"];
  // Present exactly when this session may be recorded. The consent prompt
  // discloses it before capture.
  AssistanceRecordingAuthority recording = 12;
  // Present only on an attended invitation that may ask the local user to opt
  // in to later unattended access.
  AssistanceUnattendedEnrollmentOffer unattended_enrollment = 13;
  // Present exactly on an unattended connection; there is no consent prompt,
  // only the persistent banner naming the operator with Stop.
  AssistanceUnattendedAuthority unattended = 14;
  option (buf.validate.message).cel = {
    id: "assistance_invitation.unattended"
    message: "an unattended connection neither offers enrollment nor reconnects"
    expression: "!has(this.unattended) || (!has(this.unattended_enrollment) && this.reconnect_of == '' && this.target_username != '')"
  };
}

// AssistanceDirective is the authority's complete desired state for one
// session. Receivers apply it idempotently.
message AssistanceDirective {
  AssistanceInvitation invitation = 1 [(buf.validate.field).required = true];
  string answer_sdp = 2 [(buf.validate.field).string.max_bytes = 16384];
  bool terminate = 3;
  AssistanceEndCause terminate_cause = 4 [(buf.validate.field).enum.defined_only = true];
  AssistanceCommand command = 5;
  // Absolute fresh operator authority bound; polling never extends it.
  google.protobuf.Timestamp authorized_until = 6;
  AssistanceFileDirective file_transfer = 7;
  option (buf.validate.message).cel = {
    id: "assistance_directive.operator_deadline"
    message: "live directives require fresh operator authority"
    expression: "this.terminate || has(this.authorized_until)"
  };
  option (buf.validate.message).cel = {
    id: "assistance_directive.command_deadline"
    message: "a delivered command requires its server-issued deadline"
    expression: "!has(this.command) || has(this.command.deadline)"
  };
}

// AssistanceLocalSession identifies the consenting local session. The
// executor derives it from kernel peer credentials and logind; a session
// helper never supplies it.
message AssistanceLocalSession {
  string username = 1 [(buf.validate.field).string.pattern = "^[a-zA-Z_][a-zA-Z0-9_.-]{0,31}$"];
  uint32 uid = 2;
  string logind_session_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[A-Za-z0-9_.-]+$"
  }];
  string session_type = 4 [(buf.validate.field).string = {
    in: [
      "wayland",
      "x11"
    ]
  }];
  string desktop = 5 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[ -~]*$"
  }];
}

// AssistanceReport is the device's complete observed state for one session.
message AssistanceReport {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  AssistancePhase phase = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string offer_sdp = 3 [(buf.validate.field).string.max_bytes = 16384];
  bool control_granted = 4;
  AssistanceEndCause end_cause = 5 [(buf.validate.field).enum.defined_only = true];
  string end_detail = 6 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^[ -~]*$"
  }];
  AssistanceLocalSession local_session = 7;
  AssistanceCapabilities granted_capabilities = 8;
  repeated AssistanceDisplay displays = 9 [(buf.validate.field).repeated.max_items = 8];
  string selected_display_id = 10 [(buf.validate.field).string.max_len = 64];
  AssistanceCommandResult command_result = 11;
  uint32 display_generation = 12;
  AssistancePolicy requested_capabilities = 13;
  AssistancePolicy effective_capabilities = 14;
  AssistanceDisplayFrame display_frame = 15;
  AssistanceFileReport file_transfer = 16;
  AssistanceInputState input_state = 17;
  AssistanceRecordingReport recording = 18;
  AssistanceAudioReport audio = 19;
  AssistanceAnnotationReport annotation = 20;
  AssistanceUnattendedReport unattended = 21;
  option (buf.validate.message).cel = {
    id: "assistance_report.offer"
    message: "offer_sdp is required from OFFERED and absent before it"
    expression: "(this.phase == 3 || this.phase == 4) ? this.offer_sdp != '' : (this.phase != 5 ? this.offer_sdp == '' : true)"
  };
  option (buf.validate.message).cel = {
    id: "assistance_report.end"
    message: "end_cause is required exactly when ENDED"
    expression: "(this.phase == 5) == (this.end_cause != 0)"
  };
  option (buf.validate.message).cel = {
    id: "assistance_report.command_result"
    message: "command reports are terminal and ended sessions cannot retain content"
    expression: "!has(this.command_result) || (this.command_result.status != 1 && (this.phase != 5 || this.command_result.text == ''))"
  };
  option (buf.validate.message).cel = {
    id: "assistance_report.display_frame"
    message: "frame identity must name the currently shared display generation"
    expression: "!has(this.display_frame) || ((this.phase == 3 || this.phase == 4) && this.display_frame.display_id == this.selected_display_id && this.display_frame.generation == this.display_generation && this.displays.exists(d, d.id == this.display_frame.display_id))"
  };
}

message SyncAssistanceRequest {
  repeated AssistanceDirective directives = 1 [(buf.validate.field).repeated.max_items = 8];
  option (buf.validate.message).cel = {
    id: "sync_assistance_request.one_command"
    message: "only one device command may be outstanding"
    expression: "this.directives.filter(d, has(d.command)).size() <= 1"
  };
}
message SyncAssistanceResponse {
  repeated AssistanceReport reports = 1 [(buf.validate.field).repeated.max_items = 8];
  // The executor's applied RemoteAssistanceConfig, reported on every sync.
  AssistanceEnablement policy = 2 [(buf.validate.field).enum.defined_only = true];
  option (buf.validate.message).cel = {
    id: "sync_assistance_response.one_content"
    message: "only one device command result may carry content"
    expression: "this.reports.filter(r, has(r.command_result) && r.command_result.text != '').size() <= 1"
  };
}

// AssistanceEnablement is the device's applied remote-assistance setting, so the
// server can refuse a request before it reaches a device that would decline it.
enum AssistanceEnablement {
  // Not reported: an agent that predates this field.
  ASSISTANCE_ENABLEMENT_UNSPECIFIED = 0;
  ASSISTANCE_ENABLEMENT_ENABLED = 1;
  // Absent or disabled RemoteAssistanceConfig: invitations end DISABLED.
  ASSISTANCE_ENABLEMENT_DISABLED = 2;
}

// RemoteAssistanceConfig is device policy. Disabled devices end every
// invitation with DISABLED and do not open the session socket.
message RemoteAssistanceConfig {
  bool enabled = 1;
  // Directory for the session-helper socket; defaults to /run/lindm-session.
  string session_runtime_directory = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.(lindm.validation.v1.file_reference) = true
  ];
  // Absent or UNSPECIFIED fields deny optional capabilities.
  AssistancePolicy policy_ceiling = 3;
}

enum AssistancePolicyMode {
  ASSISTANCE_POLICY_MODE_UNSPECIFIED = 0;
  ASSISTANCE_POLICY_MODE_OFF = 1;
  ASSISTANCE_POLICY_MODE_LIMITED = 2;
  ASSISTANCE_POLICY_MODE_ON = 3;
}

message AssistancePolicy {
  AssistancePolicyMode clipboard = 1 [(buf.validate.field).enum.defined_only = true];
  AssistancePolicyMode keyboard = 2 [(buf.validate.field).enum.defined_only = true];
  AssistancePolicyMode display = 3 [(buf.validate.field).enum.defined_only = true];
  AssistancePolicyMode messages = 4 [(buf.validate.field).enum.defined_only = true];
  AssistancePolicyMode files = 5 [(buf.validate.field).enum.defined_only = true];
  AssistanceFilePolicy file_limits = 6;
  // LIMITED: the operator may send a fresh linked invitation after the user
  // reboots or logs out. ON: the server additionally re-invites automatically
  // within the bounded window. Every invitation needs fresh consent.
  AssistancePolicyMode reconnect = 7 [(buf.validate.field).enum.defined_only = true];
  // LIMITED: the local user may opt in to recording per session. ON: a
  // session requested with required recording ends unless it is recorded.
  AssistancePolicyMode recording = 8 [(buf.validate.field).enum.defined_only = true];
  AssistanceReconnectPolicy reconnect_limits = 9;
  AssistanceRecordingPolicy recording_limits = 10;
  // LIMITED: one independently approved, time-bounded window per device. ON:
  // additionally a bounded approved weekly schedule. Both need prior local
  // opt-in and only reach an already-unlocked session of the opted-in user.
  AssistancePolicyMode unattended = 11 [(buf.validate.field).enum.defined_only = true];
  // OFF hides elevation guidance. LIMITED and ON show guidance and pause all
  // remote injection until the employee resumes locally.
  AssistancePolicyMode elevation = 12 [(buf.validate.field).enum.defined_only = true];
  // LIMITED: an ephemeral pointer. ON: additionally bounded annotations.
  AssistancePolicyMode annotation = 13 [(buf.validate.field).enum.defined_only = true];
  // LIMITED: explicitly selected output audio. ON: additionally separately
  // consented microphone audio.
  AssistancePolicyMode audio = 14 [(buf.validate.field).enum.defined_only = true];
  AssistanceUnattendedPolicy unattended_limits = 15;
  // Tier 3 desktop admission gates. They come only from device policy and
  // the configured ceiling; an operator never requests a desktop. OFF refuses
  // sessions on that desktop before consent. LIMITED admits VIEW with only the
  // individually qualified non-input capabilities (displays, messages,
  // reconnect, recording); CONTROL is refused, never downgraded. ON also
  // admits CONTROL and the individually qualified input capabilities
  // (keyboard, clipboard, files). The helper's per-desktop qualification
  // table narrows both further: GNOME parity is never assumed. GNOME and
  // COSMIC Wayland sessions are not gated.
  AssistancePolicyMode kde_plasma = 20 [(buf.validate.field).enum.defined_only = true];
  // Applies to every logind x11 session, whatever its desktop. A
  // portal-backed session and the persistent local stop remain mandatory;
  // there is no Xlib/XTest/xclip fallback.
  AssistancePolicyMode x11 = 21 [(buf.validate.field).enum.defined_only = true];
  option (buf.validate.message).cel = {
    id: "assistance_policy.file_limits"
    message: "enabled file transfer requires explicit size and type limits"
    expression: "this.files < 2 || has(this.file_limits)"
  };
  option (buf.validate.message).cel = {
    id: "assistance_policy.reconnect_limits"
    message: "enabled reconnect requires an explicit bounded window"
    expression: "this.reconnect < 2 || has(this.reconnect_limits)"
  };
  option (buf.validate.message).cel = {
    id: "assistance_policy.recording_limits"
    message: "enabled recording requires explicit retention and size limits"
    expression: "this.recording < 2 || has(this.recording_limits)"
  };
  option (buf.validate.message).cel = {
    id: "assistance_policy.unattended_limits"
    message: "enabled unattended access requires explicit approval, enrollment and session bounds"
    expression: "this.unattended < 2 || has(this.unattended_limits)"
  };
}

message AssistanceCapabilities {
  AssistancePolicy policy = 1;
  string clipboard_reason = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[a-z0-9_]*$"
  }];
  string keyboard_reason = 3 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[a-z0-9_]*$"
  }];
  string display_reason = 4 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[a-z0-9_]*$"
  }];
  string messages_reason = 5 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[a-z0-9_]*$"
  }];
  // Capture intentionally omits the cursor on desktop versions where the
  // embedded cursor path is unsafe and bitmap metadata cannot be transported.
  bool cursor_hidden = 6;
  string files_reason = 13 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[a-z0-9_]*$"
  }];
  string reconnect_reason = 7 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[a-z0-9_]*$"
  }];
  string recording_reason = 8 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[a-z0-9_]*$"
  }];
  string unattended_reason = 9 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[a-z0-9_]*$"
  }];
  string elevation_reason = 10 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[a-z0-9_]*$"
  }];
  string annotation_reason = 11 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[a-z0-9_]*$"
  }];
  string audio_reason = 12 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[a-z0-9_]*$"
  }];
  // The helper's qualification profile that admitted the session, e.g.
  // "kde_plasma_wayland" or "gnome_x11".
  string desktop_profile = 20 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[a-z0-9_]*$"
  }];
  // Portal frontend interface versions observed for the grant, e.g.
  // "screencast_5_remote_desktop_2_clipboard_1". Audit data only.
  string portal_versions = 21 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[a-z0-9_]*$"
  }];
}

// Only locally consented portal streams may appear here.
message AssistanceDisplay {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 64
    pattern: "^[A-Za-z0-9_.-]+$"
  }];
  string label = 2 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 128
  }];
  uint32 width = 3 [(buf.validate.field).uint32 = {
    gt: 0
    lte: 16384
  }];
  uint32 height = 4 [(buf.validate.field).uint32 = {
    gt: 0
    lte: 16384
  }];
}

// The first RTP timestamp actually emitted for a selected capture generation.
// It is not a wall-clock readiness estimate or evidence of browser presentation.
message AssistanceDisplayFrame {
  string display_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 64
    pattern: "^[A-Za-z0-9_.-]+$"
  }];
  uint32 generation = 2 [(buf.validate.field).uint32.gt = 0];
  uint32 rtp_timestamp = 3;
}

enum AssistanceCommandKind {
  ASSISTANCE_COMMAND_KIND_UNSPECIFIED = 0;
  ASSISTANCE_COMMAND_KIND_CLIPBOARD_WRITE = 1;
  ASSISTANCE_COMMAND_KIND_CLIPBOARD_READ = 2;
  ASSISTANCE_COMMAND_KIND_SPECIAL_KEYS = 3;
  ASSISTANCE_COMMAND_KIND_SELECT_DISPLAY = 4;
  ASSISTANCE_COMMAND_KIND_MESSAGE = 5;
  // Shows the operator's elevation guidance and pauses all remote injection
  // until the employee resumes locally. It never carries credentials.
  ASSISTANCE_COMMAND_KIND_ELEVATION_GUIDANCE = 6;
  // Enables or disables the operator's pointer/annotation overlay.
  ASSISTANCE_COMMAND_KIND_ANNOTATION = 7;
}

enum AssistanceSpecialKey {
  ASSISTANCE_SPECIAL_KEY_UNSPECIFIED = 0;
  ASSISTANCE_SPECIAL_KEY_SWITCH_WINDOW = 1;
  ASSISTANCE_SPECIAL_KEY_SHOW_APPLICATIONS = 2;
  ASSISTANCE_SPECIAL_KEY_OPEN_TERMINAL = 3;
  ASSISTANCE_SPECIAL_KEY_CLOSE_WINDOW = 4;
}

// Content is ephemeral. Neither this message nor its digest is audit detail.
message AssistanceCommand {
  string request_id = 1 [(buf.validate.field).string = {
    uuid: true
    not_in: "00000000-0000-0000-0000-000000000000"
  }];
  AssistanceCommandKind kind = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Omitted by admin callers; stamped by the server before delivery.
  google.protobuf.Timestamp deadline = 3;
  string text = 4 [(buf.validate.field).string.max_bytes = 16384];
  AssistanceSpecialKey special_key = 5 [(buf.validate.field).enum.defined_only = true];
  string display_id = 6 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_.-]*$"
  }];
  bool annotation_enabled = 7;
  option (buf.validate.message).cel = {
    id: "assistance_command.payload"
    message: "payload must match the command kind"
    expression: "((this.kind == 1 || this.kind == 5 || this.kind == 6) || this.text == '') && ((this.kind == 3) == (this.special_key != 0)) && ((this.kind == 4) == (this.display_id != '')) && (this.kind != 5 || (size(bytes(this.text)) > 0 && size(bytes(this.text)) <= 2048)) && (this.kind != 6 || size(bytes(this.text)) <= 512) && (this.kind == 7 || !this.annotation_enabled)"
  };
}

enum AssistanceCommandStatus {
  ASSISTANCE_COMMAND_STATUS_UNSPECIFIED = 0;
  ASSISTANCE_COMMAND_STATUS_PENDING = 1;
  ASSISTANCE_COMMAND_STATUS_SUCCEEDED = 2;
  ASSISTANCE_COMMAND_STATUS_FAILED = 3;
  ASSISTANCE_COMMAND_STATUS_CANCELLED = 4;
  ASSISTANCE_COMMAND_STATUS_EXPIRED = 5;
}

message AssistanceCommandResult {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  AssistanceCommandKind kind = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  AssistanceCommandStatus status = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string reason = 4 [(buf.validate.field).string = {
    in: [
      "",
      "command_identity_conflict",
      "command_result_expired",
      "session_command_limit",
      "content_expired",
      "session_ended",
      "command_not_granted",
      "command_deadline_reached",
      "clipboard_selection_set",
      "clipboard_text_read",
      "special_keys_sent",
      "display_selected",
      "message_posted",
      "command_unsupported",
      "command_failed",
      "command_state_lost",
      "command_expired",
      "local_file_dialog",
      "local_elevation_pause",
      "elevation_paused",
      "annotation_enabled",
      "annotation_disabled",
      "annotation_hidden_locally"
    ]
  }];
  string text = 5 [(buf.validate.field).string.max_bytes = 16384];
  google.protobuf.Timestamp completed_at = 6;
  option (buf.validate.message).cel = {
    id: "assistance_command_result.content"
    message: "only a successful clipboard read may carry content; terminal results require completion time"
    expression: "(this.text == '' || (this.kind == 2 && this.status == 2)) && ((this.status != 1) == has(this.completed_at))"
  };
}

// Input epochs fence queued events across local-only approval and chooser UI.
// A resumed epoch never accepts input generated before the pause.
message AssistanceInputState {
  uint32 epoch = 1 [(buf.validate.field).uint32.gte = 1];
  bool paused = 2;
  AssistanceInputPause pause = 3 [(buf.validate.field).enum.defined_only = true];
  option (buf.validate.message).cel = {
    id: "assistance_input_state.pause"
    message: "a pause reason is present only while paused"
    expression: "this.pause == 0 || this.paused"
  };
}
