syntax = "proto3";

package lindm.agent.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "lindm/agent/v1/device_actions.proto";

option go_package = "lindm/gen/lindm/agent/v1;agentv1";

// Read-only root observation, not authorization or readiness for an artifact.
// The server derives artifact readiness from its authenticated release size.
message RecoveryReadinessObservation {
  google.protobuf.Timestamp observed_at = 1 [(buf.validate.field).required = true];
  string boot_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  bool available = 3;
  string reason = 4 [(buf.validate.field).string.max_len = 256];
  // ESP identity for UKI; empty for measured GRUB.
  string esp_uuid = 5 [(buf.validate.field).string.max_len = 64];
  // Staging directory: the ESP for UKI, /boot for measured GRUB.
  string esp_path = 6 [(buf.validate.field).string.max_len = 4096];
  // Capacity of the staging directory's filesystem.
  uint64 free_bytes = 7;
  uint64 allocation_unit_bytes = 8;
  bool secure_boot = 9;
  bool uki_capable = 10;
  // Local configured identity only, never release-size authority for admission.
  optional bytes configured_image_sha256 = 11 [(buf.validate.field).bytes.len = 32];
  optional uint64 configured_image_size = 12 [(buf.validate.field).uint64.gt = 0];
  // The configured method these facts qualify.
  RecoveryBootMode boot_mode = 13 [(buf.validate.field).enum.defined_only = true];
  // Measured GRUB only: SHA-256 of the ordinary boot's vendor kernel,
  // whose current-boot event log shows GRUB measuring kernel, command line and
  // initramfs into PCRs 8/9 with a usable TPM resource manager.
  bytes measured_kernel_sha256 = 14 [
    (buf.validate.field).bytes.len = 32,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  option (buf.validate.message).cel = {
    id: "recovery_readiness.availability"
    message: "available observations need native identity and capability; failures need a reason"
    expression: "this.available ? (this.boot_id != '' && this.reason == '' && this.esp_path != '' && this.allocation_unit_bytes > 0u && this.secure_boot && ((this.boot_mode == 1 && this.esp_uuid != '' && this.uki_capable) || (this.boot_mode == 3 && this.measured_kernel_sha256.size() == 32))) : this.reason != ''"
  };
}

message GetRecoveryReadinessRequest {}

message GetRecoveryReadinessResponse {
  RecoveryReadinessObservation observation = 1 [(buf.validate.field).required = true];
  reserved 2, 3;
  reserved "storage_details", "storage_observed_at";
  // Canonical inventory.RootObservation protobuf from the same root observer.
  // Kept opaque here to avoid the inventory-to-agent schema import cycle.
  bytes root_observation = 4 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 81920
  }];
}
