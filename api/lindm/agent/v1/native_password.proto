syntax = "proto3";

package lindm.agent.v1;

import "buf/validate/validate.proto";

option go_package = "lindm/gen/lindm/agent/v1;agentv1";

// Root-local opt-in; never part of a remote policy. The active root logind
// session is checked immediately before changing authentication configuration.
message NativePasswordProviderConfig {
  bool enabled = 1 [(buf.validate.field).bool.const = true];
  string recovery_session_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-zA-Z0-9]+$"
  }];
}
