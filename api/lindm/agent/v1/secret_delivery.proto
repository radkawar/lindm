syntax = "proto3";

package lindm.agent.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "lindm/resource/v1/common.proto";
import "lindm/resource/v1/identity.proto";

option go_package = "lindm/gen/lindm/agent/v1;agentv1";

// Purpose-typed secret material. It is the plaintext inside server storage
// envelopes and inside one HPKE delivery; it never enters logs, journals,
// public plans, attestations, audit rows, query caches or process arguments.
// Every arm is bytes so holders can zeroize it; text arms are ASCII patterns.
message SecretMaterial {
  oneof material {
    option (buf.validate.oneof).required = true;
    // crypt(3) yescrypt, SHA-512-crypt or bcrypt hash for SECRET_PURPOSE_PASSWORD_HASH.
    bytes password_hash = 1 [(buf.validate.field).bytes = {
      max_len: 512
      pattern: "^[$](y[$][./A-Za-z0-9]+[$][./A-Za-z0-9]{1,86}[$][./A-Za-z0-9]{43}|6[$](rounds=[1-9][0-9]{3,8}[$])?[./A-Za-z0-9]{1,16}[$][./A-Za-z0-9]{86}|2[aby][$][0-3][0-9][$][./A-Za-z0-9]{53})$"
    }];
    // WPA passphrase (8-63 printable ASCII) or 64 hexadecimal raw PSK.
    bytes wifi_psk = 2 [(buf.validate.field).bytes.pattern = "^([\\x20-\\x7e]{8,63}|[0-9a-fA-F]{64})$"];
    // Bounded material for the remaining purposes.
    bytes opaque = 3 [(buf.validate.field).bytes = {
      min_len: 1
      max_len: 4096
    }];
  }
}

// DSSE payload type application/vnd.lindm.device-encryption-key.v1+protobuf,
// signed by the identity key whose SPKI SHA-256 it names. HPKE suite is fixed:
// DHKEM(X25519, HKDF-SHA256), HKDF-SHA256, ChaCha20-Poly1305, base mode.
message DeviceEncryptionKeyAttestation {
  string deployment_id = 1 [(buf.validate.field).string.uuid = true];
  string device_id = 2 [(buf.validate.field).string.uuid = true];
  string enrollment_generation = 3 [(buf.validate.field).string.uuid = true];
  bytes identity_public_key_sha256 = 4 [(buf.validate.field).bytes.len = 32];
  uint32 kem_id = 5 [(buf.validate.field).uint32.const = 32];
  uint32 kdf_id = 6 [(buf.validate.field).uint32.const = 1];
  uint32 aead_id = 7 [(buf.validate.field).uint32.const = 3];
  bytes public_key = 8 [(buf.validate.field).bytes.len = 32];
  google.protobuf.Timestamp created_at = 9 [(buf.validate.field).required = true];
  option (buf.validate.message).cel = {
    id: "device_encryption_key.identity"
    message: "identities must be nonzero"
    expression: "[this.deployment_id, this.device_id, this.enrollment_generation].all(id, id != '00000000-0000-0000-0000-000000000000')"
  };
}

// Deterministic protobuf encoding is the HPKE AAD of one sealed delivery.
// The executor recomputes it from the signed intent and its own identity.
message SecretDeliveryBinding {
  string deployment_id = 1 [(buf.validate.field).string.uuid = true];
  string device_id = 2 [(buf.validate.field).string.uuid = true];
  string enrollment_generation = 3 [(buf.validate.field).string.uuid = true];
  string action_id = 4 [(buf.validate.field).string.uuid = true];
  lindm.resource.v1.ResourceRef resource = 5 [(buf.validate.field).required = true];
  lindm.resource.v1.SecretRef secret = 6 [(buf.validate.field).required = true];
  // SHA-256 of the recipient's raw 32-byte X25519 public key.
  bytes recipient_key_sha256 = 7 [(buf.validate.field).bytes.len = 32];
}

// Plan-signed manifest entry. The sealed bytes travel beside the intent in the
// same order; their digest authenticates them before any decryption attempt.
message ResourceSecretDelivery {
  SecretDeliveryBinding binding = 1 [(buf.validate.field).required = true];
  bytes sealed_sha256 = 2 [(buf.validate.field).bytes.len = 32];
}

// Canonical deterministic protobuf OAEP label and server storage AAD for one
// managed local-admin password generated by the executor.
message LocalAdminPasswordBinding {
  string device_id = 1 [(buf.validate.field).string.uuid = true];
  string enrollment_generation = 2 [(buf.validate.field).string.uuid = true];
  string action_id = 3 [(buf.validate.field).string.uuid = true];
  string account_name = 4 [(buf.validate.field).string.pattern = "^[a-zA-Z_][a-zA-Z0-9_.-]{0,31}$"];
  uint32 account_uid = 5;
}
