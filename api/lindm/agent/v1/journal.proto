syntax = "proto3";

package lindm.agent.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "lindm/agent/v1/offline_enrollment.proto";
import "lindm/agent/v1/trust.proto";

option go_package = "lindm/gen/lindm/agent/v1;agentv1";

// Protected local persistence only. Never return this message from an RPC,
// log it, or place it in the unprivileged transport spool.
message ExecutorJournalState {
  uint32 format_version = 1 [(buf.validate.field).uint32.const = 1];
  string installation_id = 2 [(buf.validate.field).string.uuid = true];
  bytes execution_root_json = 3 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 65536
  }];
  bytes bootstrap_envelope = 4 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 524288
  }];
  google.protobuf.Timestamp bootstrap_verified_at = 5 [(buf.validate.field).required = true];
  string enrollment_transaction_id = 6 [(buf.validate.field).string.uuid = true];
  bytes identity_private_key = 7 [(buf.validate.field).bytes.len = 64];
  bytes enrollment_csr_pem = 8 [(buf.validate.field).bytes = {
    min_len: 64
    max_len: 16384
  }];
  string pending_grant = 9 [(buf.validate.field).string.max_len = 256];
  bytes certificate_pem = 10 [(buf.validate.field).bytes.max_len = 16384];
  optional string device_id = 11 [(buf.validate.field).string.uuid = true];
  optional string enrollment_generation = 12 [(buf.validate.field).string.uuid = true];
  uint64 session_epoch = 13 [(buf.validate.field).uint64.lte = 9223372036854775807];
  optional string session_boot_id = 14 [(buf.validate.field).string.uuid = true];
  SessionAcquisition pending_session = 15;
  bytes pending_session_proof = 16 [(buf.validate.field).bytes.max_len = 16384];
  PendingIdentityRenewal pending_renewal = 17;
  PriorIdentityCredential prior_credential = 18;
  google.protobuf.Timestamp renew_after = 19;
  RenewalCommitReceipt renewal_receipt = 20;
  SessionCommitReceipt session_receipt = 21;
  bool provisioning_token = 22;
  OfflineEnrollmentAuthorizationFile offline_authorization = 23;

  option (buf.validate.message).cel = {
    id: "executor_journal.enrollment_shape"
    message: "pending enrollment retains its grant; installed identity pins device/generation and removes the grant"
    expression: "(this.certificate_pem.size() == 0 && (this.pending_grant.size() >= 32 || has(this.offline_authorization)) && !has(this.device_id) && !has(this.enrollment_generation) && this.session_epoch == 0u && !has(this.session_boot_id) && !has(this.pending_session) && !has(this.pending_renewal) && !has(this.prior_credential) && !has(this.renew_after) && !has(this.renewal_receipt) && !has(this.session_receipt)) || (this.certificate_pem.size() >= 64 && this.pending_grant == '' && has(this.device_id) && has(this.enrollment_generation) && has(this.renew_after))"
  };
  option (buf.validate.message).cel = {
    id: "executor_journal.offline_authority"
    message: "offline authorization is separate from online bearer credentials"
    expression: "!has(this.offline_authorization) || (!this.provisioning_token && this.pending_grant == '')"
  };
  option (buf.validate.message).cel = {
    id: "executor_journal.session_shape"
    message: "accepted sessions have a boot identity and pending acquisition remains at the protected predecessor"
    expression: "(this.session_epoch == 0u) == !has(this.session_boot_id) && (has(this.pending_session) == (this.pending_session_proof.size() > 0)) && (!has(this.pending_session) || (this.pending_session.predecessor_epoch == this.session_epoch && !has(this.pending_renewal)))"
  };
  option (buf.validate.message).cel = {
    id: "executor_journal.session_receipt"
    message: "the retained acknowledgment binds the committed session epoch"
    expression: "!has(this.session_receipt) || (this.session_epoch > 0u && has(this.session_boot_id) && this.session_receipt.session_epoch == this.session_epoch)"
  };
}

message PendingIdentityRenewal {
  string issuance_request_id = 1 [(buf.validate.field).string.uuid = true];
  bytes private_key = 2 [(buf.validate.field).bytes.len = 64];
  bytes csr_pem = 3 [(buf.validate.field).bytes = {
    min_len: 64
    max_len: 16384
  }];
  bytes authority_proof = 4 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 16384
  }];
  bytes retrieval_proof = 5 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 16384
  }];
  uint64 session_epoch = 6 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
}

message PriorIdentityCredential {
  bytes private_key = 1 [(buf.validate.field).bytes.len = 64];
  bytes certificate_pem = 2 [(buf.validate.field).bytes = {
    min_len: 64
    max_len: 16384
  }];
  google.protobuf.Timestamp retain_until = 3 [(buf.validate.field).required = true];
}

// Atomically replaces the preceding receipt with the installed credential.
// It permits an exact acknowledgment retry after executor/process restart.
message RenewalCommitReceipt {
  string issuance_request_id = 1 [(buf.validate.field).string.uuid = true];
  bytes certificate_sha256 = 2 [(buf.validate.field).bytes.len = 32];
}

message SessionCommitReceipt {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  uint64 session_epoch = 2 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  // Build identity from the exact executor-signed acquisition acknowledged by
  // the server. A changed build reacquires even when the boot ID is unchanged.
  string agent_release = 3 [(buf.validate.field).string.max_len = 128];
  uint32 agent_protocol_version = 4 [(buf.validate.field).uint32.lte = 2147483647];
}

// Executor-only shadow ownership. These messages contain password hashes and
// MUST NOT enter public plans, observations, errors, logs, or the network spool.
message AccountLockSnapshot {
  string username = 1 [(buf.validate.field).string.pattern = "^[a-zA-Z_][a-zA-Z0-9_.-]{0,31}$"];
  uint32 uid = 2 [(buf.validate.field).uint32.gt = 0];
  string passwd_entry = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
  string shadow_entry = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
}

enum AccountLockPhase {
  ACCOUNT_LOCK_PHASE_UNSPECIFIED = 0;
  ACCOUNT_LOCK_PHASE_DISABLE_PENDING = 1;
  ACCOUNT_LOCK_PHASE_DISABLED = 2;
  ACCOUNT_LOCK_PHASE_RELEASE_PENDING = 3;
  ACCOUNT_LOCK_PHASE_RELEASED = 4;
  ACCOUNT_LOCK_PHASE_PRESERVED = 5;
}

message AccountLockEntry {
  AccountLockSnapshot prior = 1 [(buf.validate.field).required = true];
  AccountLockSnapshot expected = 2 [(buf.validate.field).required = true];
  AccountLockPhase phase = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  // An interrupted release can only attempt restoration under a NEW explicitly
  // authorized release action; the same action never replays a native effect.
  string release_action_id = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message AccountLockLedger {
  string lock_action_id = 1 [(buf.validate.field).string.uuid = true];
  repeated AccountLockEntry accounts = 2 [(buf.validate.field).repeated.max_items = 128];
  option (buf.validate.message).cel = {
    id: "account_lock.identities"
    message: "account names and UIDs are unique and immutable across the lock"
    expression: "this.accounts.all(a, a.prior.username == a.expected.username && a.prior.uid == a.expected.uid && this.accounts.filter(b, a.prior.username == b.prior.username || a.prior.uid == b.prior.uid).size() == 1)"
  };
}
