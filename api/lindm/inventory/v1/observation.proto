syntax = "proto3";

package lindm.inventory.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "lindm/agent/v1/approved_configuration.proto";
import "lindm/agent/v1/device_actions.proto";
import "lindm/agent/v1/os_update.proto";
import "lindm/agent/v1/recovery_readiness.proto";

option go_package = "lindm/gen/lindm/inventory/v1;inventoryv1";
message Package {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  string version = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
  string architecture = 3 [(buf.validate.field).string.max_len = 64];
  string manager = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Native source-package identity, including epoch; absent as a pair when
  // the backend does not report source metadata.
  string source_name = 5 [(buf.validate.field).string.max_len = 512];
  string source_version = 6 [(buf.validate.field).string.max_len = 2048];
  // Absent only on historical package evidence.
  ModuleObservation module = 7;
  // APT index evidence for the exact installed name, version and architecture.
  // UNAVAILABLE for non-APT backends; absent only on historical evidence.
  PackageOrigin origin = 8;
  option (buf.validate.message).cel = {
    id: "package.source_pair"
    message: "source name and version must be present together"
    expression: "(this.source_name == '') == (this.source_version == '')"
  };
}

// CollectionStatus describes collection, not compliance or server freshness.
enum CollectionStatus {
  COLLECTION_STATUS_UNSPECIFIED = 0;
  COLLECTION_STATUS_SUCCESS = 1;
  COLLECTION_STATUS_UNAVAILABLE = 2;
  COLLECTION_STATUS_PERMISSION_DENIED = 3;
  COLLECTION_STATUS_TIMEOUT = 4;
  COLLECTION_STATUS_INVALID_OUTPUT = 5;
  COLLECTION_STATUS_CAPACITY_EXCEEDED = 6;
  COLLECTION_STATUS_NATIVE_COMMAND_FAILURE = 7;
  // Native per-field context proves that the property does not apply.
  // Unlike UNAVAILABLE, this is not missing or failed evidence.
  COLLECTION_STATUS_NOT_APPLICABLE = 8;
}

message ObservedString {
  CollectionStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string value = 2 [(buf.validate.field).string.max_len = 4096];
  option (buf.validate.message).cel = {
    id: "observation.value_status"
    message: "only successful observations carry a nonempty value"
    expression: "(this.status == 1) == (this.value != '')"
  };
}

message HostObservation {
  google.protobuf.Timestamp started_at = 1 [(buf.validate.field).required = true];
  google.protobuf.Timestamp finished_at = 2 [(buf.validate.field).required = true];
  ObservedString boot_id = 3 [(buf.validate.field).required = true];
  ObservedString hostname = 4 [(buf.validate.field).required = true];
  ObservedString os_id = 5 [(buf.validate.field).required = true];
  ObservedString os_version = 6 [(buf.validate.field).required = true];
  ObservedString architecture = 7 [(buf.validate.field).required = true];
  ObservedString kernel_release = 8 [(buf.validate.field).required = true];
  ObservedString hardware_vendor = 9 [(buf.validate.field).required = true];
  ObservedString hardware_model = 10 [(buf.validate.field).required = true];
  ObservedString hardware_serial = 11 [(buf.validate.field).required = true];
  NativeDetails details = 12;
  option (buf.validate.message).cel = {
    id: "observation.time_order"
    message: "collection finish must not precede its start"
    expression: "this.finished_at >= this.started_at"
  };
}

// Read-only executor projection. No private key material or action authority.
// Every field is required so incomplete projections cannot masquerade as evidence.
message RootObservation {
  google.protobuf.Timestamp started_at = 1 [(buf.validate.field).required = true];
  google.protobuf.Timestamp finished_at = 2 [(buf.validate.field).required = true];
  string boot_id = 3 [(buf.validate.field).string.uuid = true];
  ObservedString hardware_serial = 4 [(buf.validate.field).required = true];
  FirmwareDetails firmware = 5 [(buf.validate.field).required = true];
  StorageDetails storage = 6 [(buf.validate.field).required = true];
  CpuDetails cpu = 7 [(buf.validate.field).required = true];
  option (buf.validate.message).cel = {
    id: "root_observation.time_order"
    message: "collection finish must not precede its start"
    expression: "this.finished_at >= this.started_at"
  };
}

message PackageObservation {
  google.protobuf.Timestamp started_at = 1 [(buf.validate.field).required = true];
  google.protobuf.Timestamp finished_at = 2 [(buf.validate.field).required = true];
  CollectionStatus status = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [
      0,
      8
    ]
  }];
  string backend = 4 [(buf.validate.field).string.max_len = 64];
  repeated Package packages = 5 [(buf.validate.field).repeated.max_items = 100000];
  option (buf.validate.message).cel = {
    id: "packages.success_shape"
    message: "failed collections must not publish partial packages"
    expression: "this.status == 1 || this.packages.size() == 0"
  };
  option (buf.validate.message).cel = {
    id: "packages.time_order"
    message: "collection finish must not precede its start"
    expression: "this.finished_at >= this.started_at"
  };
}

// PackageBatch is encoded once and uploaded as opaque bytes. Digest and size
// cover that encoding; a server must not hash a reserialization.
message PackageBatch {
  repeated Package packages = 1 [(buf.validate.field).repeated.max_items = 500];
}

// SnapshotState is the server admission state of one staged package snapshot.
enum SnapshotState {
  SNAPSHOT_STATE_UNSPECIFIED = 0;
  SNAPSHOT_STATE_STAGING = 1;
  SNAPSHOT_STATE_COMMITTED = 2;
  SNAPSHOT_STATE_SUPERSEDED = 3;
  SNAPSHOT_STATE_EXPIRED = 4;
}

// NativeObservation is local evidence, not an enrollment or compliance claim.
message NativeObservation {
  HostObservation host = 1 [(buf.validate.field).required = true];
  PackageObservation packages = 2 [(buf.validate.field).required = true];
}

// Native details are optional only at the historical HostObservation boundary.
message ObservedUint64 {
  CollectionStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  uint64 value = 2;
  option (buf.validate.message).cel = {
    id: "number.failure"
    message: "failed observations have no value"
    expression: "this.status == 1 || this.value == 0u"
  };
}

message ObservedBool {
  CollectionStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bool value = 2;
  option (buf.validate.message).cel = {
    id: "boolean.failure"
    message: "failed observations have no value"
    expression: "this.status == 1 || !this.value"
  };
}

message ObservedStrings {
  CollectionStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated string values = 2 [(buf.validate.field).repeated = {
    max_items: 64
    items: {
      string: {
        max_len: 256
        ip_with_prefixlen: true
      }
    }
  }];
  option (buf.validate.message).cel = {
    id: "values.failure"
    message: "failed collections have no partial rows"
    expression: "this.status == 1 || this.values.size() == 0"
  };
}

message CpuDetails {
  ObservedString model = 1 [(buf.validate.field).required = true];
  ObservedUint64 logical_cores = 2 [(buf.validate.field).required = true];
  ObservedUint64 physical_cores = 3 [(buf.validate.field).required = true];
  ObservedString x86_64_level = 4 [(buf.validate.field).required = true];
  // Absent only on historical observations. Identifies the native source, not
  // a guessed CPU brand or a distribution-based hardware classification.
  ObservedString model_source = 5;
  option (buf.validate.message).cel = {
    id: "cpu.model_source"
    message: "current CPU model source matches its observation status and identifies a native interface"
    expression: "!has(this.model_source) || (this.model_source.status == this.model.status && (this.model_source.status != 1 || this.model_source.value in ['proc_cpuinfo', 'smbios_type4', 'arm_midr_procfs', 'arm_midr_sysfs']))"
  };
}

message MemoryDetails {
  ObservedUint64 total_bytes = 1 [(buf.validate.field).required = true];
  ObservedUint64 available_bytes = 2 [(buf.validate.field).required = true];
  ObservedUint64 swap_total_bytes = 3 [(buf.validate.field).required = true];
}

message BlockDevice {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  ObservedString type = 2 [(buf.validate.field).required = true];
  ObservedString parent = 3 [(buf.validate.field).required = true];
  ObservedUint64 size_bytes = 4 [(buf.validate.field).required = true];
  ObservedString filesystem = 5 [(buf.validate.field).required = true];
  ObservedString mountpoint = 6 [(buf.validate.field).required = true];
  ObservedString encryption = 7 [(buf.validate.field).required = true];
  // Absent only on historical observations.
  StorageIdentity identity = 8;
}

// Public native identity only: never key material, token payloads or header bytes.
message StorageIdentity {
  ObservedString transport = 1 [(buf.validate.field).required = true];
  ObservedString model = 2 [(buf.validate.field).required = true];
  ObservedString serial = 3 [(buf.validate.field).required = true];
  ObservedString firmware = 4 [(buf.validate.field).required = true];
  ObservedString wwn = 5 [(buf.validate.field).required = true];
  ObservedString eui = 6 [(buf.validate.field).required = true];
  ObservedString partition_uuid = 7 [(buf.validate.field).required = true];
  ObservedString partition_type = 8 [(buf.validate.field).required = true];
  ObservedString filesystem_uuid = 9 [(buf.validate.field).required = true];
  ObservedString luks_uuid = 10 [(buf.validate.field).required = true];
  ObservedString luks_version = 11 [(buf.validate.field).required = true];
  ObservedUint64 luks_keyslot_count = 12 [(buf.validate.field).required = true];
  ObservedUint64 luks_token_count = 13 [(buf.validate.field).required = true];
  ObservedString luks_token_types = 14 [(buf.validate.field).required = true];
  // NAME of the unique physical backing disk within this same observation.
  ObservedString backing_disk = 15 [(buf.validate.field).required = true];
  ObservedBool root_backing = 16 [(buf.validate.field).required = true];
  ObservedNVMeScope nvme = 17 [(buf.validate.field).required = true];
  // Native GPT PTUUID of the unique backing disk, never a partition UUID.
  // Absent on historical observations; unavailable without a unique GPT disk.
  ObservedString gpt_disk_guid = 18;
}

message ObservedNVMeScope {
  CollectionStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  lindm.agent.v1.NVMeSanitizeScope scope = 2;
  // Fixed refusal code when the namespace's sysfs identity is absent or
  // unusable (status INVALID_OUTPUT); never a silent fallback.
  string reason = 3 [(buf.validate.field).string.pattern = "^([a-z][a-z0-9_]{0,63})?$"];
  option (buf.validate.message).cel = {
    id: "nvme_observation.reason_status"
    message: "only invalid NVMe observations carry a refusal reason"
    expression: "this.reason == '' || this.status == 5"
  };
  option (buf.validate.message).cel = {
    id: "nvme_observation.scope_status"
    message: "only successful NVMe observations carry an exact native scope"
    expression: "(this.status == 1) == has(this.scope)"
  };
  option (buf.validate.message).cel = {
    id: "nvme_observation.namespace_scope"
    message: "inventory does not authorize controller-wide destruction"
    expression: "!has(this.scope) || !this.scope.controller_wide"
  };
}

message StorageDetails {
  CollectionStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated BlockDevice devices = 2 [(buf.validate.field).repeated.max_items = 256];
  option (buf.validate.message).cel = {
    id: "devices.failure"
    message: "failed collections have no partial rows"
    expression: "this.status == 1 || this.devices.size() == 0"
  };
}

message NetworkInterface {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  ObservedString mac = 2 [(buf.validate.field).required = true];
  ObservedString link = 3 [(buf.validate.field).required = true];
  ObservedStrings addresses = 4 [(buf.validate.field).required = true];
  // Absent on historical observations. True for each active, non-reject
  // destination-default route interface in the corresponding native route table.
  ObservedBool default_route_ipv4 = 5;
  ObservedBool default_route_ipv6 = 6;
}

message NetworkDetails {
  CollectionStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated NetworkInterface interfaces = 2 [(buf.validate.field).repeated.max_items = 256];
  option (buf.validate.message).cel = {
    id: "interfaces.failure"
    message: "failed collections have no partial rows"
    expression: "this.status == 1 || this.interfaces.size() == 0"
  };
}

message FirmwareDetails {
  ObservedString mode = 1 [(buf.validate.field).required = true];
  ObservedString secure_boot = 2 [(buf.validate.field).required = true];
}

message TpmDetails {
  ObservedBool present = 1 [(buf.validate.field).required = true];
  ObservedString version = 2 [(buf.validate.field).required = true];
}

message Battery {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  ObservedString status = 2 [(buf.validate.field).required = true];
  ObservedUint64 capacity_percent = 3 [(buf.validate.field).required = true];
}

message BatteryDetails {
  CollectionStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated Battery items = 2 [(buf.validate.field).repeated.max_items = 32];
  option (buf.validate.message).cel = {
    id: "items.failure"
    message: "failed collections have no partial rows"
    expression: "this.status == 1 || this.items.size() == 0"
  };
}

message PowerDetails {
  ObservedString chassis = 1 [(buf.validate.field).required = true];
  BatteryDetails batteries = 2 [(buf.validate.field).required = true];
}

message SessionCounts {
  ObservedUint64 users = 1 [(buf.validate.field).required = true];
  ObservedUint64 sessions = 2 [(buf.validate.field).required = true];
  // Absent on historical observations; a successful empty list means no active
  // logind sessions, not that collection was unavailable.
  ActiveSessions active_sessions = 3;
}

message ActiveSession {
  ObservedString user_name = 1 [(buf.validate.field).required = true];
  ObservedString session_class = 2 [(buf.validate.field).required = true];
  ObservedString session_type = 3 [(buf.validate.field).required = true];
  // Absent seats on proven non-graphical sessions are NOT_APPLICABLE.
  // Missing seats on local graphical user sessions remain UNAVAILABLE.
  ObservedString seat = 4 [(buf.validate.field).required = true];
  ObservedBool remote = 5 [(buf.validate.field).required = true];
  option (buf.validate.message).cel = {
    id: "session.seat_applicability"
    message: "a non-applicable seat requires successful native non-graphical session context"
    expression: "this.seat.status != 8 || (this.session_class.status == 1 && this.session_type.status == 1 && this.remote.status == 1 && (this.session_class.value in ['manager', 'background'] || this.remote.value || this.session_type.value == 'tty'))"
  };
}

message ActiveSessions {
  CollectionStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated ActiveSession sessions = 2 [(buf.validate.field).repeated.max_items = 4096];
  option (buf.validate.message).cel = {
    id: "active_sessions.failure"
    message: "failed collections have no partial rows"
    expression: "this.status == 1 || this.sessions.size() == 0"
  };
}

message LocalUser {
  uint64 uid = 1 [(buf.validate.field).uint64.lte = 4294967295];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string shell = 3 [(buf.validate.field).string.max_len = 4096];
}

message LocalUsers {
  CollectionStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated LocalUser users = 2 [(buf.validate.field).repeated.max_items = 4096];
  option (buf.validate.message).cel = {
    id: "users.failure"
    message: "failed collections have no partial rows"
    expression: "this.status == 1 || this.users.size() == 0"
  };
}

message BackendDetails {
  ObservedBool dpkg = 1 [(buf.validate.field).required = true];
  ObservedBool rpm = 2 [(buf.validate.field).required = true];
  ObservedBool pacman = 3 [(buf.validate.field).required = true];
  ObservedBool zypper = 4 [(buf.validate.field).required = true];
  ObservedBool rpm_ostree = 5 [(buf.validate.field).required = true];
  ObservedBool nix = 6 [(buf.validate.field).required = true];
  ObservedBool flatpak = 7 [(buf.validate.field).required = true];
  ObservedBool snap = 8 [(buf.validate.field).required = true];
}

message Application {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  ObservedString version = 2 [(buf.validate.field).required = true];
  ObservedString architecture = 3 [(buf.validate.field).required = true];
  ObservedString scope = 4 [(buf.validate.field).required = true];
}

message ApplicationDetails {
  CollectionStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated Application applications = 2 [(buf.validate.field).repeated.max_items = 2048];
  option (buf.validate.message).cel = {
    id: "applications.failure"
    message: "failed collections have no partial rows"
    expression: "this.status == 1 || this.applications.size() == 0"
  };
}

message NativeDetails {
  CpuDetails cpu = 1 [(buf.validate.field).required = true];
  MemoryDetails memory = 2 [(buf.validate.field).required = true];
  StorageDetails storage = 3 [(buf.validate.field).required = true];
  NetworkDetails network = 4 [(buf.validate.field).required = true];
  FirmwareDetails firmware = 5 [(buf.validate.field).required = true];
  TpmDetails tpm = 6 [(buf.validate.field).required = true];
  PowerDetails power = 7 [(buf.validate.field).required = true];
  SessionCounts sessions = 8 [(buf.validate.field).required = true];
  LocalUsers local_users = 9 [(buf.validate.field).required = true];
  ObservedUint64 kernel_module_count = 10 [(buf.validate.field).required = true];
  ObservedUint64 uptime_seconds = 11 [(buf.validate.field).required = true];
  ObservedUint64 boot_time_unix_seconds = 12 [(buf.validate.field).required = true];
  BackendDetails backends = 13 [(buf.validate.field).required = true];
  ApplicationDetails flatpak = 14 [(buf.validate.field).required = true];
  ApplicationDetails snap = 15 [(buf.validate.field).required = true];
  // Absent only on historical host evidence.
  PlatformDetails platform = 16;
  // Absent on direct unprivileged inspection and historical host evidence.
  // Published inventory attaches a fresh protected executor observation.
  lindm.agent.v1.RecoveryReadinessObservation recovery_readiness = 17;
  // Absent on direct unprivileged inspection and historical host evidence.
  // Published inventory attaches the protected executor patch status.
  lindm.agent.v1.PatchStatusObservation patch_status = 18;
  // Absent only on historical host evidence.
  NativeToolCustody tool_custody = 19;
  // Absent on direct unprivileged inspection, historical host evidence and when
  // the executor could not be read. Published inventory attaches it.
  lindm.agent.v1.ApprovedConfigurationObservation approved_configuration = 20;
}

// NativeToolCustody is the ancestry the agent requires before it runs any
// distribution tool: /, /usr and the tool directories must be owned by root
// and writable by neither group nor other. When unprotected_path is set every
// native collector and resource provider refuses its tools until an
// administrator restores the packaged mode (e.g. `chmod go-w /`).
message NativeToolCustody {
  CollectionStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // The first checked directory that is not root-protected; empty when all are.
  string unprotected_path = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^(/|(/[a-z]+)+)?$"
  }];
  uint32 owner_uid = 3;
  // Permission bits (st_mode & 07777) of unprotected_path.
  uint32 mode = 4 [(buf.validate.field).uint32.lte = 4095];
  option (buf.validate.message).cel = {
    id: "native_tool_custody.shape"
    message: "only a successful observation names an unprotected path with its owner and mode"
    expression: "(this.status == 1 && this.unprotected_path != '') || (this.unprotected_path == '' && this.owner_uid == 0u && this.mode == 0u)"
  };
}

// Module identity is native RPM MODULARITYLABEL evidence, not a guessed stream.
message ModuleObservation {
  CollectionStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bool modular = 2;
  string name = 3 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^([A-Za-z0-9][A-Za-z0-9+_.-]*)?$"
  }];
  string stream = 4 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^([A-Za-z0-9][A-Za-z0-9+_.-]*)?$"
  }];
  string version = 5 [(buf.validate.field).string = {
    max_len: 32
    pattern: "^[0-9]*$"
  }];
  string context = 6 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^([A-Za-z0-9][A-Za-z0-9+_.-]*)?$"
  }];
  option (buf.validate.message).cel = {
    id: "module.identity_shape"
    message: "only a successful modular observation carries a complete native identity"
    expression: "(this.status == 1 && this.modular) ? (this.name != '' && this.stream != '' && this.version != '' && this.context != '') : (!this.modular && this.name == '' && this.stream == '' && this.version == '' && this.context == '')"
  };
}

// PackageOrigin lists every APT index in /var/lib/apt/lists that lists the
// exact installed name, version and architecture. A successful observation
// with no listings means the installed version is not listed by any index
// (a local, superseded or removed version); no origin is ever inferred.
message PackageOrigin {
  CollectionStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [
      0,
      8
    ]
  }];
  repeated AptListing listings = 2 [(buf.validate.field).repeated.max_items = 16];
  option (buf.validate.message).cel = {
    id: "origin.success_shape"
    message: "only a successful origin observation carries listings"
    expression: "this.status == 1 || this.listings.size() == 0"
  };
}

// AptReleaseSignature is the agent's own OpenPGP verification of the Release
// that lists a package, not a copy of APT's trust decision.
enum AptReleaseSignature {
  APT_RELEASE_SIGNATURE_UNSPECIFIED = 0;
  // A signature over the Release verified with a public key from the native
  // APT keyrings, and the index file matches the signed Release's SHA256.
  APT_RELEASE_SIGNATURE_VERIFIED = 1;
  // The Release has no InRelease signature and no Release.gpg.
  APT_RELEASE_SIGNATURE_UNSIGNED = 2;
  // A signature exists but no available key verified it, or the index file
  // is not bound to the signed Release by its SHA256 entry.
  APT_RELEASE_SIGNATURE_UNVERIFIED = 3;
}

// AptListing is the Release metadata of one index listing a package.
message AptListing {
  string origin = 1 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^[^\\x00-\\x1F\\x7F]*$"
  }];
  string label = 2 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^[^\\x00-\\x1F\\x7F]*$"
  }];
  string suite = 3 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^[^\\x00-\\x1F\\x7F]*$"
  }];
  string codename = 4 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^[^\\x00-\\x1F\\x7F]*$"
  }];
  AptReleaseSignature signature = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Uppercase hex fingerprint of the primary key whose signature verified.
  string signer = 6 [(buf.validate.field).string.pattern = "^([0-9A-F]{40}|[0-9A-F]{64})?$"];
  option (buf.validate.message).cel = {
    id: "listing.signer_shape"
    message: "only a verified listing names its signer"
    expression: "(this.signature == 1) == (this.signer != '')"
  };
}

// Native enabled configuration, not evidence of network reachability or entitlement.
// URL userinfo, queries and fragments are omitted because they may contain secrets.
message RepositoryConfiguration {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  repeated string base_urls = 2 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {
        min_len: 1
        max_len: 4096
      }
    }
  }];
  string metalink = 3 [(buf.validate.field).string.max_len = 4096];
  string mirrorlist = 4 [(buf.validate.field).string.max_len = 4096];
  bool gpgcheck = 5;
  repeated string gpg_keys = 6 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {
        min_len: 1
        max_len: 4096
      }
    }
  }];
  bool urls_redacted = 7;
}

message RepositoryObservation {
  CollectionStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated string ids = 2 [(buf.validate.field).repeated = {
    max_items: 256
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  }];
  string backend = 3 [(buf.validate.field).string.max_len = 64];
  // Absent on historical observations. Current collectors populate one per ID.
  repeated RepositoryConfiguration configurations = 4 [(buf.validate.field).repeated.max_items = 256];
  option (buf.validate.message).cel = {
    id: "repositories.failure"
    message: "successful repositories identify their native backend; failures carry no partial evidence"
    expression: "this.status == 1 ? this.backend != '' : (this.ids.size() == 0 && this.backend == '' && this.configurations.size() == 0)"
  };
  option (buf.validate.message).cel = {
    id: "repositories.configurations"
    message: "repository configurations uniquely match the enabled IDs"
    expression: "this.configurations.size() == 0 || (this.configurations.size() == this.ids.size() && this.configurations.all(r, r.id in this.ids && this.configurations.filter(other, other.id == r.id).size() == 1))"
  };
}

message PlatformDetails {
  ObservedString cpe = 1 [(buf.validate.field).required = true];
  ObservedString releasever_lock = 2 [(buf.validate.field).required = true];
  RepositoryObservation repositories = 3 [(buf.validate.field).required = true];
  // Effective native variable after RPM detection and configured overrides.
  // Unlike releasever_lock, this is not evidence of an explicit release pin.
  ObservedString releasever = 4;
}
