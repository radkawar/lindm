syntax = "proto3";

package lindm.resource.v1;

import "buf/validate/validate.proto";
import "lindm/resource/v1/common.proto";
import "lindm/resource/v1/identity.proto";

option go_package = "lindm/gen/lindm/resource/v1;resourcev1";

enum TrustStoreScope {
  TRUST_STORE_SCOPE_UNSPECIFIED = 0;
  TRUST_STORE_SCOPE_SYSTEM_TLS = 1;
  TRUST_STORE_SCOPE_BROWSER_NSS = 2;
  TRUST_STORE_SCOPE_JAVA = 3;
  TRUST_STORE_SCOPE_USER = 4;
}
message TrustCADesired {
  Presence presence = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  bytes certificate_der = 2 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 16384
  }];
  TrustStoreScope scope = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  repeated CertificatePurpose purposes = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 4
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: 0
      }
    }
  }];
}
message SubjectAlternativeName {
  oneof name {
    option (buf.validate.oneof).required = true;
    string dns = 1 [(buf.validate.field).string = {
      hostname: true
      max_len: 253
    }];
    string ip = 2 [(buf.validate.field).string.ip = true];
    string email = 3 [(buf.validate.field).string = {
      email: true
      max_len: 254
    }];
    string uri = 4 [(buf.validate.field).string = {
      uri: true
      max_len: 2048
    }];
  }
}
enum KeyAlgorithm {
  KEY_ALGORITHM_UNSPECIFIED = 0;
  KEY_ALGORITHM_ECDSA_P256 = 1;
  KEY_ALGORITHM_ECDSA_P384 = 2;
  KEY_ALGORITHM_RSA_3072 = 3;
  KEY_ALGORITHM_RSA_4096 = 4;
  KEY_ALGORITHM_ED25519 = 5;
}
message SoftwareKey {}
message TPMKey {
  bytes approved_policy_sha256 = 1 [(buf.validate.field).bytes.len = 32];
}
message PKCS11Key {
  string approved_token_id = 1 [(buf.validate.field).string.uuid = true];
}
message KeyPolicy {
  KeyAlgorithm algorithm = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  oneof storage {
    option (buf.validate.oneof).required = true;
    SoftwareKey software = 2;
    TPMKey tpm = 3;
    PKCS11Key pkcs11 = 4;
  }
}
enum CredentialConsumerKind {
  CREDENTIAL_CONSUMER_KIND_UNSPECIFIED = 0;
  CREDENTIAL_CONSUMER_KIND_EAP = 1;
  CREDENTIAL_CONSUMER_KIND_VPN = 2;
  CREDENTIAL_CONSUMER_KIND_TLS_CLIENT = 3;
}
message CredentialConsumer {
  CredentialConsumerKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  ResourceRef resource = 2 [(buf.validate.field).required = true];
  option (buf.validate.message).cel = {
    id: "credential_consumer.kind"
    message: "EAP and VPN consumers must identify a network connection"
    expression: "!(this.kind in [1,2]) || this.resource.kind == 9"
  };
}
message CertificateEnrollmentDesired {
  string credential_id = 1 [(buf.validate.field).string.uuid = true];
  CredentialSubjectBinding subject = 2 [(buf.validate.field).required = true];
  string issuer_profile_id = 3 [(buf.validate.field).string.uuid = true];
  repeated CertificatePurpose eku = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 4
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: 0
      }
    }
  }];
  repeated SubjectAlternativeName sans = 5 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
  }];
  KeyPolicy key = 6 [(buf.validate.field).required = true];
  uint32 renew_before_seconds = 7 [(buf.validate.field).uint32 = {
    gte: 60
    lte: 31536000
  }];
  repeated CredentialConsumer consumers = 8 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
  }];
}
enum DirectoryBackend {
  DIRECTORY_BACKEND_UNSPECIFIED = 0;
  DIRECTORY_BACKEND_REALMD_SSSD_AD = 1;
  DIRECTORY_BACKEND_SSSD_LDAP_KERBEROS = 2;
  DIRECTORY_BACKEND_SSSD_AD = 3;
}
enum DirectoryOfflinePolicy {
  DIRECTORY_OFFLINE_POLICY_UNSPECIFIED = 0;
  DIRECTORY_OFFLINE_POLICY_DENY = 1;
  DIRECTORY_OFFLINE_POLICY_CACHED_CREDENTIALS = 2;
}
message DirectoryLoginPolicy {
  repeated string permitted_groups = 1 [(buf.validate.field).repeated = {
    max_items: 128
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 256
        pattern: "^[^\\x00\\r\\n]+$"
      }
    }
  }];
  DirectoryOfflinePolicy offline = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  uint32 offline_expiry_days = 3 [(buf.validate.field).uint32.lte = 365];
  bool fully_qualified_names = 4;
  bool create_home = 5;
  option (buf.validate.message).cel = {
    id: "directory_login.offline"
    message: "cached login must have a bounded expiry"
    expression: "this.offline == 2 ? this.offline_expiry_days > 0u : this.offline_expiry_days == 0u"
  };
}
message DirectoryClientDesired {
  DirectoryBackend backend = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string realm = 2 [(buf.validate.field).string = {
    hostname: true
    max_len: 253
  }];
  repeated string approved_servers = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 32
    unique: true
    items: {
      string: {
        hostname: true
        max_len: 253
      }
    }
  }];
  SecretRef join_credential = 4;
  DirectoryLoginPolicy login = 5 [(buf.validate.field).required = true];
  CertificateTrustRefs trust = 6 [(buf.validate.field).required = true];
  option (buf.validate.message).cel = {
    id: "directory_client.secret"
    message: "join credential is purpose limited"
    expression: "!has(this.join_credential) || this.join_credential.purpose == 9"
  };
}
