message OwnershipInverseBinding {
  bytes ledger_revision_sha256 = 1 [(buf.validate.field).bytes.len = 32];
  bytes last_applied_sha256 = 2 [(buf.validate.field).bytes.len = 32];
  bytes native_identity_sha256 = 3 [(buf.validate.field).bytes.len = 32];
  // Digest of the executor-local typed inverse, never server-provided old data.
  bytes inverse_sha256 = 4 [(buf.validate.field).bytes.len = 32];
}
enum NativeObjectChange {
  NATIVE_OBJECT_CHANGE_UNSPECIFIED = 0;
  NATIVE_OBJECT_CHANGE_CREATE = 1;
  NATIVE_OBJECT_CHANGE_UPDATE = 2;
  NATIVE_OBJECT_CHANGE_REMOVE_OWNED = 3;
  NATIVE_OBJECT_CHANGE_RESTORE_OWNED = 4;
  NATIVE_OBJECT_CHANGE_OBSERVE = 5;
}
message SystemdServicePlan {
  SystemdServiceDesired desired = 1 [(buf.validate.field).required = true];
  SystemdServiceObservation before = 2 [(buf.validate.field).required = true];
  bool change_runtime = 3;
  bool change_enablement = 4;
  repeated InstallLink install_projection = 5 [(buf.validate.field).repeated.max_items = 128];
  repeated ResourceRef related_units = 6 [(buf.validate.field).repeated.max_items = 64];
  OwnershipInverseBinding inverse = 7;
  option (buf.validate.message).cel = {
    id: "systemd_plan.unit_binding"
    message: "service plan must bind the observed canonical unit"
    expression: "this.desired.unit == this.before.unit"
  };
  option (buf.validate.message).cel = {
    id: "systemd_plan.managed_changes"
    message: "unmanaged dimensions cannot request changes"
    expression: "(!this.change_runtime || this.desired.runtime != 1) && (!this.change_enablement || this.desired.enablement != 1)"
  };
  option (buf.validate.message).cel = {
    id: "systemd_plan.related"
    message: "install projection claims only services"
    expression: "this.related_units.all(r, r.kind == 1)"
  };
}
