  NativeVersion before = 3;
  NativeVersion after = 4;
  ArtifactRef artifact = 5;
  ResourceRef source = 6 [(buf.validate.field).required = true];
  bool direct_request = 7;
  bool owned_installation = 8;
  option (buf.validate.message).cel = {
    id: "package_transaction_entry.shape"
    message: "install/upgrade entries bind exact bytes and versions; removal binds owned prior state"
    expression: "this.source.kind == 13 && (this.operation == 3 ? has(this.before) && !has(this.after) && this.owned_installation : has(this.after) && has(this.artifact))"
  };
}
message PackageTransactionManifest {
  repeated PackageTransactionEntry entries = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 4096
