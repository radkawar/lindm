  bytes native_database_revision = 2 [(buf.validate.field).bytes.len = 32];
  SourceSnapshot sources = 3 [(buf.validate.field).required = true];
  string native_lock_identity = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  repeated ResourceRef affected_resources = 5 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 256
  }];
  repeated bytes affected_desired_sha256 = 6 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 256
    items: {
      bytes: {len: 32}
    }
  }];
  option (buf.validate.message).cel = {
    id: "package_manifest.bindings"
    message: "every affected resource binds a desired digest"
    expression: "this.affected_resources.size() == this.affected_desired_sha256.size()"
  };
}
