  ArtifactRef transaction_manifest = 3 [(buf.validate.field).required = true];
  repeated SnapInterfaceGrant interface_delta = 4 [(buf.validate.field).repeated.max_items = 64];
  bytes expected_state_revision = 5 [(buf.validate.field).bytes.len = 32];
  OwnershipInverseBinding inverse = 6;
}
enum CredentialStep {
  CREDENTIAL_STEP_UNSPECIFIED = 0;
  CREDENTIAL_STEP_GENERATE_KEY = 1;
  CREDENTIAL_STEP_ISSUE = 2;
  CREDENTIAL_STEP_RENEW = 3;
  CREDENTIAL_STEP_ACTIVATE_CONSUMER = 4;
  CREDENTIAL_STEP_REVOKE_OWNED = 5;
  CREDENTIAL_STEP_REMOVE_OWNED_KEY = 6;
}
message CertificateEnrollmentPlan {
  CertificateEnrollmentDesired desired = 1 [(buf.validate.field).required = true];
  repeated CredentialStep steps = 2 [(buf.validate.field).repeated = {
    max_items: 6
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: 0
      }
    }
  }];
  bytes issuer_policy_sha256 = 3 [(buf.validate.field).bytes.len = 32];
  bytes expected_public_certificate_sha256 = 4 [(buf.validate.field).bytes.len = 32];
  OwnershipInverseBinding inverse = 5;
}
enum DirectoryStep {
  DIRECTORY_STEP_UNSPECIFIED = 0;
  DIRECTORY_STEP_JOIN = 1;
  DIRECTORY_STEP_CHANGE_OWNED = 2;
  DIRECTORY_STEP_LEAVE_OWNED = 3;
  DIRECTORY_STEP_RESTORE_OWNED = 4;
}
message DirectoryClientPlan {
  DirectoryClientDesired desired = 1 [(buf.validate.field).required = true];
  repeated DirectoryStep steps = 2 [(buf.validate.field).repeated = {
    max_items: 4
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: 0
      }
    }
  }];
  bytes expected_join_identity = 3 [(buf.validate.field).bytes.len = 32];
  bytes candidate_configuration_sha256 = 4 [(buf.validate.field).bytes.len = 32];
  ProbeReceipt remote_receipt = 5;
  OwnershipInverseBinding inverse = 6;
}

// Artifact-addressed manifests remain closed protobuf payloads. They are
// streamed separately instead of increasing the signed plan envelope limit.
message FlatpakTransactionEntry {
  InstallationBinding installation = 1 [(buf.validate.field).required = true];
  string app_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  string architecture = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string branch = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  AppTransactionOperation operation = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional string before_commit = 6 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  optional string after_commit = 7 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  ResourceRef remote = 8 [(buf.validate.field).required = true];
  repeated ArtifactRef objects = 9 [(buf.validate.field).repeated.max_items = 4096];
  bool runtime_dependency = 10;
  bool owned_installation = 11;
  option (buf.validate.message).cel = {
    id: "flatpak_transaction.shape"
    message: "native transaction binds exact commits and only removes owned installs"
    expression: "this.remote.kind == 13 && (this.operation == 3 ? has(this.before_commit) && !has(this.after_commit) && this.owned_installation : has(this.after_commit))"
  };
}
message SnapTransactionEntry {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 40
  }];
  string instance_key = 2 [(buf.validate.field).string.max_len = 10];
  AppTransactionOperation operation = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional uint64 before_revision = 4 [(buf.validate.field).uint64.gt = 0];
  optional uint64 after_revision = 5 [(buf.validate.field).uint64.gt = 0];
  SnapConfinement confinement = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  ArtifactRef snap = 7;
  ArtifactRef assertion_chain = 8;
  bool base_dependency = 9;
  bool owned_installation = 10;
  option (buf.validate.message).cel = {
    id: "snap_transaction.shape"
    message: "native transaction binds exact revisions and assertions and only removes owned installs"
    expression: "this.operation == 3 ? has(this.before_revision) && !has(this.after_revision) && this.owned_installation : has(this.after_revision) && has(this.snap) && has(this.assertion_chain)"
  };
}
message AppTransactionEntry {
  oneof app {
    option (buf.validate.oneof).required = true;
    FlatpakTransactionEntry flatpak = 1;
    SnapTransactionEntry snap = 2;
  }
}
message ResourceDigestBinding {
  ResourceRef ref = 1 [(buf.validate.field).required = true];
  bytes desired_sha256 = 2 [(buf.validate.field).bytes.len = 32];
}
message AppTransactionManifest {
  repeated AppTransactionEntry entries = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 4096
  }];
  bytes native_revision_sha256 = 2 [(buf.validate.field).bytes.len = 32];
  repeated ResourceDigestBinding affected = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 256
  }];
  bool preserve_application_data = 4 [(buf.validate.field).bool.const = true];
  bool preserve_unrelated_runtimes = 5 [(buf.validate.field).bool.const = true];
}
message DeploymentTransactionManifest {
  SourceSnapshot source = 1 [(buf.validate.field).required = true];
  DeploymentIdentity before = 2 [(buf.validate.field).required = true];
  DeploymentIdentity target = 3 [(buf.validate.field).required = true];
  repeated ArtifactRef content_objects = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 4096
  }];
  repeated ResourceDigestBinding affected = 5 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 256
  }];
  bytes approved_composition_sha256 = 6 [(buf.validate.field).bytes.len = 32];
  repeated UpdateCheckpoint checkpoints = 7 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 6
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: 0
      }
    }
  }];
  bool retains_previous_deployment = 8;
  bool rolls_back_user_data = 9 [(buf.validate.field).bool.const = false];
}

message ManagedFilePlan {
  ManagedFileDesired desired = 1 [(buf.validate.field).required = true];
  ManagedFileObservation before = 2 [(buf.validate.field).required = true];
  NativeObjectChange change = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  OwnershipInverseBinding inverse = 4;
  // The content baseline is private journal data, not public plan evidence.
  option (buf.validate.message).cel = {
    id: "managed_file_plan.identity"
    message: "file plans bind the same path before mutation"
    expression: "this.desired.path == this.before.path"
  };
}
message SysctlPlan {
  SysctlDesired desired = 1 [(buf.validate.field).required = true];
  SysctlObservation before = 2 [(buf.validate.field).required = true];
  NativeObjectChange change = 3 [(buf.validate.field).enum = {
    defined_only: true
    in: [
      2,
      4,
      5
    ]
  }];
  OwnershipInverseBinding inverse = 4;
  option (buf.validate.message).cel = {
    id: "sysctl_plan.identity"
    message: "sysctl plans bind the same live and persistent kernel key"
    expression: "this.desired.key == this.before.key"
  };
}
message SystemdDefinitionPlan {
  SystemdDefinitionDesired desired = 1 [(buf.validate.field).required = true];
  SystemdDefinitionObservation before = 2 [(buf.validate.field).required = true];
  NativeObjectChange change = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  OwnershipInverseBinding inverse = 4;
  bytes rendered_candidate_sha256 = 5 [(buf.validate.field).bytes.len = 32];
  bool daemon_reload = 6;
  option (buf.validate.message).cel = {
    id: "systemd_definition_plan.identity"
    message: "definition plans bind the same canonical unit and definition type"
    expression: "this.before.canonical_key == (has(this.desired.timer) ? 'timer/' + this.desired.timer.unit : 'drop-in/' + this.desired.drop_in.unit)"
  };
}
message EncryptionCompliancePlan {
  EncryptionComplianceDesired desired = 1 [(buf.validate.field).required = true];
  EncryptionComplianceObservation before = 2 [(buf.validate.field).required = true];
  // Compliance never authorizes a native effect, including during release.
  NativeObjectChange change = 3 [(buf.validate.field).enum.const = 5];
  reserved 4;
  reserved "inverse";
}
