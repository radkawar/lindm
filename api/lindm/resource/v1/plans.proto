    id: "package_transaction_entry.shape"
    message: "install/upgrade entries bind exact bytes and versions; removal binds owned prior state"
    expression: "this.source.kind == 13 && (this.operation == 3 ? has(this.before) && !has(this.after) && this.owned_installation : has(this.after) && has(this.artifact) && has(this.signer_sha256) && has(this.metadata_revision_sha256))"
  };
  option (buf.validate.message).cel = {
    id: "package_transaction_entry.architecture"
    message: "transaction entries name the resolved package architecture"
    expression: "this.package.architecture != ''"
  };
}
// How an installed package that lindm did not install was proven to be the
// approved source's artifact. Neither dpkg nor rpm records the repository a
// package came from, so each method compares the installed native records with
// the exact artifact the approved source's authenticated metadata lists.
enum InstalledProvenanceMethod {
  INSTALLED_PROVENANCE_METHOD_UNSPECIFIED = 0;
  // dpkg keeps no archive digest. The indexed .deb was fetched and checked
  // against the signed index; its control fields, md5sums and conffile list
  // equal the installed dpkg records, and dpkg --verify finds every installed
  // non-conffile matching those MD5 sums. MD5 is not collision resistant.
  INSTALLED_PROVENANCE_METHOD_DPKG_CONTROL = 1;
  // rpm keeps the installed header. Its SHA256HEADER equals that of the
  // repository package signed by the approved key, and rpm --verify finds every
  // installed non-config file's size, digest and link target unchanged.
  INSTALLED_PROVENANCE_METHOD_RPM_HEADER = 2;
}
// Effect-free preparation evidence for approved adoption: the installed package
// (exactly this native record) is the approved source's artifact.
message InstalledProvenanceProof {
  PackageIdentity package = 1 [(buf.validate.field).required = true];
  NativeVersion version = 2 [(buf.validate.field).required = true];
  ResourceRef source = 3 [(buf.validate.field).required = true];
  bytes signer_sha256 = 4 [(buf.validate.field).bytes.len = 32];
  bytes metadata_revision_sha256 = 5 [(buf.validate.field).bytes.len = 32];
  // The approved artifact exactly as the authenticated metadata declares it.
  ArtifactRef artifact = 6 [(buf.validate.field).required = true];
  InstalledProvenanceMethod method = 7 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  // NativePackageRecord.native_identity_sha256 of the proven installation.
  bytes native_identity_sha256 = 8 [(buf.validate.field).bytes.len = 32];
  option (buf.validate.message).cel = {
    id: "installed_provenance_proof.shape"
    message: "an installed-provenance proof names a concrete package of its approved repository"
    expression: "this.source.kind == 13 && this.package.architecture != '' && (this.method == 1 ? this.package.ecosystem == 1 : this.package.ecosystem == 2)"
  };
}
message PackageTransactionManifest {
  repeated PackageTransactionEntry entries = 1 [(buf.validate.field).repeated = {max_items: 4096}];
  bytes native_database_revision = 2 [(buf.validate.field).bytes.len = 32];
  SourceSnapshot sources = 3 [(buf.validate.field).required = true];
  string native_lock_identity = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  repeated ResourceRef affected_resources = 5 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 256
  }];
  repeated bytes affected_desired_sha256 = 6 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 256
    items: {
      bytes: {len: 32}
    }
  }];
  // Native solver/replay bytes are immutable alongside the normalized entries.
  ArtifactRef native_transaction = 7 [(buf.validate.field).required = true];
  optional bytes candidate_pin_sha256 = 8 [(buf.validate.field).bytes.len = 32];
  FileIdentity original_pin = 9;
  // Present only when preparation was asked to prove an installed package's
  // provenance for acquisition and the proof succeeded.
  InstalledProvenanceProof installed_provenance = 10;
  option (buf.validate.message).cel = {
    id: "package_manifest.bindings"
    message: "every affected resource binds a desired digest"
    expression: "this.affected_resources.size() == this.affected_desired_sha256.size()"
  };
}
message NativePackagePlan {
  NativePackageDesired desired = 1 [(buf.validate.field).required = true];
  // Complete PackageTransactionManifest, streamed and digest-addressed.
  ArtifactRef transaction_manifest = 2 [(buf.validate.field).required = true];
  bytes native_database_revision = 3 [(buf.validate.field).bytes.len = 32];
  string native_lock_identity = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  OwnershipInverseBinding inverse = 5;
  // Exact provider-rendered pin, or empty to remove its owned pin. Bind the
  // candidate separately from the baseline retained by the ownership journal.
  bytes pin_contents = 6 [(buf.validate.field).bytes.max_len = 32768];
  bool change_pin = 7;
  uint32 pin_mode = 8 [(buf.validate.field).uint32.lte = 4095];
  // Derived from the complete digest-bound manifest, never from desired state alone.
  bool change_packages = 9;
}
