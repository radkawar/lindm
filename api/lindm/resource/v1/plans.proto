// Artifact-addressed manifests remain closed protobuf payloads. They are
// streamed separately instead of increasing the signed plan envelope limit.
message FlatpakTransactionEntry {
  InstallationBinding installation = 1 [(buf.validate.field).required = true];
  string app_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  string architecture = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string branch = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  AppTransactionOperation operation = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional string before_commit = 6 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  optional string after_commit = 7 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  ResourceRef remote = 8 [(buf.validate.field).required = true];
  repeated ArtifactRef objects = 9 [(buf.validate.field).repeated.max_items = 4096];
  bool runtime_dependency = 10;
  bool owned_installation = 11;
  option (buf.validate.message).cel = {
    id: "flatpak_transaction.shape"
    message: "native transaction binds exact commits and only removes owned installs"
    expression: "this.remote.kind == 13 && (this.operation == 3 ? has(this.before_commit) && !has(this.after_commit) && this.owned_installation : has(this.after_commit))"
  };
}
message SnapTransactionEntry {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 40
  }];
  string instance_key = 2 [(buf.validate.field).string.max_len = 10];
  AppTransactionOperation operation = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional uint64 before_revision = 4 [(buf.validate.field).uint64.gt = 0];
  optional uint64 after_revision = 5 [(buf.validate.field).uint64.gt = 0];
  SnapConfinement confinement = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  ArtifactRef snap = 7;
  ArtifactRef assertion_chain = 8;
  bool base_dependency = 9;
  bool owned_installation = 10;
  option (buf.validate.message).cel = {
    id: "snap_transaction.shape"
    message: "native transaction binds exact revisions and assertions and only removes owned installs"
    expression: "this.operation == 3 ? has(this.before_revision) && !has(this.after_revision) && this.owned_installation : has(this.after_revision) && has(this.snap) && has(this.assertion_chain)"
  };
}
message AppTransactionEntry {
  oneof app {
    option (buf.validate.oneof).required = true;
    FlatpakTransactionEntry flatpak = 1;
    SnapTransactionEntry snap = 2;
  }
}
message ResourceDigestBinding {
  ResourceRef ref = 1 [(buf.validate.field).required = true];
  bytes desired_sha256 = 2 [(buf.validate.field).bytes.len = 32];
}
message AppTransactionManifest {
  repeated AppTransactionEntry entries = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 4096
  }];
  bytes native_revision_sha256 = 2 [(buf.validate.field).bytes.len = 32];
  repeated ResourceDigestBinding affected = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 256
  }];
  bool preserve_application_data = 4 [(buf.validate.field).bool.const = true];
  bool preserve_unrelated_runtimes = 5 [(buf.validate.field).bool.const = true];
}
message DeploymentTransactionManifest {
  SourceSnapshot source = 1 [(buf.validate.field).required = true];
  DeploymentIdentity before = 2 [(buf.validate.field).required = true];
  DeploymentIdentity target = 3 [(buf.validate.field).required = true];
  repeated ArtifactRef content_objects = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 4096
  }];
  repeated ResourceDigestBinding affected = 5 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 256
  }];
  bytes approved_composition_sha256 = 6 [(buf.validate.field).bytes.len = 32];
  repeated UpdateCheckpoint checkpoints = 7 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 6
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: 0
      }
    }
  }];
  bool retains_previous_deployment = 8;
  bool rolls_back_user_data = 9 [(buf.validate.field).bool.const = false];
}
