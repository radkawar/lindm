message PackageTransactionEntry {
  PackageIdentity package = 1 [(buf.validate.field).required = true];
  PackageTransactionOperation operation = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  NativeVersion before = 3;
  NativeVersion after = 4;
  ArtifactRef artifact = 5;
  ResourceRef source = 6 [(buf.validate.field).required = true];
  bool direct_request = 7;
  bool owned_installation = 8;
