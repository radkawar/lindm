syntax = "proto3";

package lindm.resource.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "lindm/resource/v1/accounts.proto";
import "lindm/resource/v1/common.proto";
import "lindm/resource/v1/credentials.proto";
import "lindm/resource/v1/host.proto";
import "lindm/resource/v1/identity.proto";
import "lindm/resource/v1/network.proto";
import "lindm/resource/v1/software.proto";

option go_package = "lindm/gen/lindm/resource/v1;resourcev1";

enum ObservationStatus {
  OBSERVATION_STATUS_UNSPECIFIED = 0;
  OBSERVATION_STATUS_OK = 1;
  OBSERVATION_STATUS_UNAVAILABLE = 2;
  OBSERVATION_STATUS_PERMISSION_DENIED = 3;
  OBSERVATION_STATUS_UNSUPPORTED = 4;
  OBSERVATION_STATUS_INVALID = 5;
  OBSERVATION_STATUS_TRANSIENT = 6;
}
message ObservationMetadata {
  string boot_id = 1 [(buf.validate.field).string.uuid = true];
  string executor_incarnation = 2 [(buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp observed_at = 3 [(buf.validate.field).required = true];
  BackendSelection backend = 4 [(buf.validate.field).required = true];
  bytes native_revision = 5 [(buf.validate.field).bytes.len = 32];
  ObservationStatus observation_status = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string reason = 7 [(buf.validate.field).string.max_len = 512];
}
message FileIdentity {
  string path = 1 [(buf.validate.field).string = {
    max_len: 4096
    pattern: "^/[^\\x00\\r\\n]+$"
  }];
  uint64 device = 2;
  uint64 inode = 3;
  uint32 uid = 4;
  uint32 gid = 5;
  uint32 mode = 6 [(buf.validate.field).uint32.lte = 4095];
  bytes sha256 = 7 [(buf.validate.field).bytes.len = 32];
}
message InstallLink {
  string path = 1 [(buf.validate.field).string = {
    max_len: 4096
    pattern: "^/[^\\x00\\r\\n]+$"
  }];
  string target = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
  uint64 device = 3;
  uint64 inode = 4;
  bytes ancestry_sha256 = 5 [(buf.validate.field).bytes.len = 32];
}
// Native strings remain evidence, including unrecognized native values.
message SystemdServiceObservation {
  string unit = 1 [(buf.validate.field).string.max_len = 255];
  string boot_id = 2 [(buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp observed_at = 3 [(buf.validate.field).required = true];
  string load_state = 4 [(buf.validate.field).string.max_len = 64];
  string active_state = 5 [(buf.validate.field).string.max_len = 64];
  string sub_state = 6 [(buf.validate.field).string.max_len = 64];
  string unit_file_state = 7 [(buf.validate.field).string.max_len = 64];
  string service_type = 8 [(buf.validate.field).string.max_len = 64];
  bool remain_after_exit = 9;
  bool refuse_manual_start = 10;
  bool refuse_manual_stop = 11;
  bool need_daemon_reload = 12;
  bool transient = 13;
  bytes definition_sha256 = 14 [(buf.validate.field).bytes.len = 32];
  bytes fingerprint_sha256 = 15 [(buf.validate.field).bytes.len = 32];
  bool job_pending = 16;
  repeated InstallLink install_links = 17 [(buf.validate.field).repeated.max_items = 128];
  optional bytes invocation_id = 18 [(buf.validate.field).bytes.len = 16];
  bool install_projection_complete = 19;
}
enum NSSOrigin {
  NSS_ORIGIN_UNSPECIFIED = 0;
  NSS_ORIGIN_LOCAL_FILES = 1;
  NSS_ORIGIN_DIRECTORY = 2;
  NSS_ORIGIN_IMAGE = 3;
  NSS_ORIGIN_UNKNOWN = 4;
}
message LocalGroupObservation {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  bool exists = 2;
  NSSOrigin origin = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional uint32 gid = 4;
  repeated string members = 5 [(buf.validate.field).repeated = {
    max_items: 1024
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 32
      }
    }
  }];
  bytes local_file_revision = 6 [(buf.validate.field).bytes.len = 32];
  bytes identity_sha256 = 7 [(buf.validate.field).bytes.len = 32];
}
message HomeMetadata {
  string path = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
  bool exists = 2;
  uint32 owner_uid = 3;
  uint32 owner_gid = 4;
  uint32 mode = 5 [(buf.validate.field).uint32.lte = 4095];
  uint64 device = 6;
  uint64 inode = 7;
}
message LocalUserObservation {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  bool exists = 2;
  NSSOrigin origin = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional uint32 uid = 4;
  optional uint32 gid = 5;
  repeated string groups = 6 [(buf.validate.field).repeated = {
    max_items: 1024
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 32
      }
    }
  }];
  HomeMetadata home = 7;
  string shell = 8 [(buf.validate.field).string.max_len = 4096];
  optional bool password_locked = 9;
  optional PasswordHashAlgorithm password_algorithm = 10 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  PasswordAging aging = 11;
  bytes local_file_revision = 12 [(buf.validate.field).bytes.len = 32];
  bytes identity_sha256 = 13 [(buf.validate.field).bytes.len = 32];
  optional string uid_generation = 14 [(buf.validate.field).string.uuid = true];
  bool has_processes = 15;
  bool has_external_data = 16;
}
message SudoPermissionEvidence {
  SudoPrincipal subject = 1 [(buf.validate.field).required = true];
  SudoPrincipal run_as = 2 [(buf.validate.field).required = true];
  SudoCommand command = 3 [(buf.validate.field).required = true];
  bool permitted = 4;
  bool password_required = 5;
}
message SudoRuleObservation {
  bool exists = 1;
  FileIdentity owned_file = 2;
  bytes aggregate_policy_sha256 = 3 [(buf.validate.field).bytes.len = 32];
  repeated SudoPermissionEvidence permissions = 4 [(buf.validate.field).repeated.max_items = 128];
  string rule_id = 5 [(buf.validate.field).string.uuid = true];
}
message SSHIncludeEdge {
  string source = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
  string target = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
  uint32 precedence = 3;
}
message SSHMatchEvidence {
  repeated SSHMatchSelector context = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 16
  }];
  SSHMatch effective = 2 [(buf.validate.field).required = true];
  bytes effective_sha256 = 3 [(buf.validate.field).bytes.len = 32];
}
message SSHServerObservation {
  repeated SSHIncludeEdge includes = 1 [(buf.validate.field).repeated.max_items = 128];
  bytes include_graph_sha256 = 2 [(buf.validate.field).bytes.len = 32];
  bytes effective_configuration_sha256 = 3 [(buf.validate.field).bytes.len = 32];
  SSHServerDesired effective = 4 [(buf.validate.field).required = true];
  repeated Endpoint listeners = 5 [(buf.validate.field).repeated.max_items = 32];
  string service_unit = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  repeated SSHMatchEvidence matches = 7 [(buf.validate.field).repeated.max_items = 64];
}
message TimeSourceEvidence {
  TimeSource source = 1 [(buf.validate.field).required = true];
  bool reachable = 2;
  bool selected = 3;
  bool nts_authenticated = 4;
}
message TimeSyncObservation {
  string daemon_unit = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  bool installed = 2;
  bool running = 3;
  repeated TimeSourceEvidence sources = 4 [(buf.validate.field).repeated.max_items = 32];
  bool synchronized = 5;
  sint64 offset_microseconds = 6;
  bytes configuration_sha256 = 7 [(buf.validate.field).bytes.len = 32];
}
message TrustPurposeEvidence {
  CertificatePurpose purpose = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  bool trusted = 2;
  ProbeReceipt chain_probe = 3 [(buf.validate.field).required = true];
}
message TrustCAObservation {
  bytes certificate_sha256 = 1 [(buf.validate.field).bytes.len = 32];
  repeated FileIdentity sources = 2 [(buf.validate.field).repeated.max_items = 64];
  bool owned_source = 3;
  TrustStoreScope scope = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  repeated TrustPurposeEvidence purposes = 5 [(buf.validate.field).repeated.max_items = 4];
  bytes exported_store_sha256 = 6 [(buf.validate.field).bytes.len = 32];
}
message FirewallZoneObservation {
  string native_owner = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string native_version = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  bool exists = 3;
  repeated FirewallRule persistent_rules = 4 [(buf.validate.field).repeated.max_items = 256];
  repeated FirewallRule active_rules = 5 [(buf.validate.field).repeated.max_items = 256];
  repeated InterfaceSelector bound_interfaces = 6 [(buf.validate.field).repeated.max_items = 64];
  bytes persistent_sha256 = 7 [(buf.validate.field).bytes.len = 32];
  bytes kernel_rules_sha256 = 8 [(buf.validate.field).bytes.len = 32];
  FirewallVerdict default_ingress = 9 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  FirewallVerdict default_egress = 10 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string zone_id = 11 [(buf.validate.field).string.uuid = true];
  bytes native_identity_sha256 = 12 [(buf.validate.field).bytes.len = 32];
  bool conflict = 13;
  bool persistent_ready = 14;
  string table = 15 [(buf.validate.field).string = {pattern: "^lindm_z_[a-f0-9]{32}$"}];
  bytes ownership_userdata = 16 [(buf.validate.field).bytes.max_len = 256];
  bytes network_namespace_sha256 = 17 [(buf.validate.field).bytes.len = 32];
  // Foreign chains remain independently authoritative; this is not global adoption.
  repeated string foreign_tables = 18 [(buf.validate.field).repeated = {
    max_items: 256
    items: {
      string: {max_len: 256}
    }
  }];
}
enum ConnectionMedium {
  CONNECTION_MEDIUM_UNSPECIFIED = 0;
  CONNECTION_MEDIUM_ETHERNET = 1;
  CONNECTION_MEDIUM_WIFI = 2;
  CONNECTION_MEDIUM_OPENVPN = 3;
  CONNECTION_MEDIUM_WIREGUARD = 4;
  CONNECTION_MEDIUM_IPSEC = 5;
}
message NetworkConnectionObservation {
  string connection_uuid = 1 [(buf.validate.field).string.uuid = true];
  bool exists = 2;
  ConnectionMedium medium = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  uint64 settings_revision = 4;
  bytes settings_sha256 = 5 [(buf.validate.field).bytes.len = 32];
  InterfaceSelector active_device = 6;
  repeated IPAddress addresses = 7 [(buf.validate.field).repeated.max_items = 64];
  repeated IPRoute routes = 8 [(buf.validate.field).repeated.max_items = 128];
  bool active = 9;
  bool credential_version_matches = 10;
  string native_state = 11 [(buf.validate.field).string.max_len = 64];
}
message DNSLookupEvidence {
  string name = 1 [(buf.validate.field).string = {
    hostname: true
    max_len: 253
  }];
  repeated string addresses = 2 [(buf.validate.field).repeated = {
    max_items: 32
    unique: true
    items: {
      string: {ip: true}
    }
  }];
  DNSServer server = 3 [(buf.validate.field).required = true];
  bool dnssec_validated = 4;
  bool tls_authenticated = 5;
  ProbeReceipt receipt = 6 [(buf.validate.field).required = true];
}
message DNSObservation {
  DNSDesired effective = 1 [(buf.validate.field).required = true];
  string native_owner = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  bytes persistent_sha256 = 3 [(buf.validate.field).bytes.len = 32];
  bytes runtime_sha256 = 4 [(buf.validate.field).bytes.len = 32];
  repeated DNSLookupEvidence lookups = 5 [(buf.validate.field).repeated.max_items = 32];
}
message ProxyRequestEvidence {
  Endpoint destination = 1 [(buf.validate.field).required = true];
  bool bypassed = 2;
  bool proxy_authenticated = 3;
  ProbeReceipt receipt = 4 [(buf.validate.field).required = true];
}
message ProxyObservation {
  ProxyConsumer consumer = 1 [(buf.validate.field).required = true];
  string native_owner = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  bytes persistent_sha256 = 3 [(buf.validate.field).bytes.len = 32];
  bytes effective_sha256 = 4 [(buf.validate.field).bytes.len = 32];
  repeated ProxyRequestEvidence requests = 5 [(buf.validate.field).repeated.max_items = 32];
}
message NativePackageRecord {
  PackageIdentity package = 1 [(buf.validate.field).required = true];
  NativeVersion version = 2 [(buf.validate.field).required = true];
  // dpkg/rpm do not reliably retain repository provenance. Unknown is explicit;
  // providers may not substitute the desired repository or an all-zero signer.
  ResourceRef source = 3;
  optional bytes signer_sha256 = 4 [(buf.validate.field).bytes.len = 32];
  optional bytes metadata_revision_sha256 = 5 [(buf.validate.field).bytes.len = 32];
  bool provenance_known = 6;
  // Native package-row/control-file identity detects reinstallations even when
  // the displayed version is unchanged. It is not itself source provenance.
  bytes native_identity_sha256 = 7 [(buf.validate.field).bytes.len = 32];
  option (buf.validate.message).cel = {
    id: "native_package_record.source"
    message: "known provenance binds authenticated source evidence; unknown provenance has no invented source"
    expression: "this.provenance_known ? has(this.source) && this.source.kind == 13 && has(this.signer_sha256) && has(this.metadata_revision_sha256) : !has(this.source) && !has(this.signer_sha256) && !has(this.metadata_revision_sha256)"
  };
}
message NativePackageObservation {
  PackageIdentity package = 1 [(buf.validate.field).required = true];
  bool installed = 2;
  NativePackageRecord record = 3;
  bytes database_revision_sha256 = 4 [(buf.validate.field).bytes.len = 32];
  bool native_lock_held = 5;
  // Provider-derived native pin object, not an operator-selected path.
  FileIdentity pin_file = 6;
  bytes pin_contents = 7 [(buf.validate.field).bytes.max_len = 32768];
  option (buf.validate.message).cel = {
    id: "native_package_observation.record"
    message: "installed packages require their native record"
    expression: "this.installed == has(this.record)"
  };
}
enum RepositoryEcosystem {
  REPOSITORY_ECOSYSTEM_UNSPECIFIED = 0;
  REPOSITORY_ECOSYSTEM_APT = 1;
  REPOSITORY_ECOSYSTEM_RPM = 2;
  REPOSITORY_ECOSYSTEM_ALPM = 3;
  REPOSITORY_ECOSYSTEM_FLATPAK = 4;
  REPOSITORY_ECOSYSTEM_NIX = 5;
  REPOSITORY_ECOSYSTEM_OSTREE = 6;
}
message RepositoryObservation {
  bool exists = 1;
  repeated FileIdentity stanzas = 2 [(buf.validate.field).repeated.max_items = 32];
  repeated FileIdentity key_objects = 3 [(buf.validate.field).repeated.max_items = 32];
  bytes metadata_revision_sha256 = 4 [(buf.validate.field).bytes.len = 32];
  repeated bytes verified_signer_sha256 = 5 [(buf.validate.field).repeated = {
    max_items: 16
    unique: true
    items: {
      bytes: {len: 32}
    }
  }];
  bool metadata_signature_valid = 6;
  bool package_signature_required = 7;
  bytes native_namespace_sha256 = 8 [(buf.validate.field).bytes.len = 32];
  string repository_id = 9 [(buf.validate.field).string.uuid = true];
  RepositoryEcosystem ecosystem = 10 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
}
message FlatpakAppObservation {
  InstallationBinding installation = 1 [(buf.validate.field).required = true];
  string app_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  string architecture = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string branch = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  bool installed = 5;
  optional string commit = 6 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  FlatpakPermissionPolicy permissions = 7;
  bytes installation_revision_sha256 = 8 [(buf.validate.field).bytes.len = 32];
}
message DeploymentIdentity {
  string native_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  bytes content_sha256 = 2 [(buf.validate.field).bytes.len = 32];
  bool booted = 3;
  bool pending = 4;
}
enum OSUpdateBackend {
  OS_UPDATE_BACKEND_UNSPECIFIED = 0;
  // unattended-upgrade(8) with needrestart(1) service restarts.
  OS_UPDATE_BACKEND_APT_UNATTENDED_UPGRADES = 1;
  // dnf5-plugin-automatic `dnf5 automatic`.
  OS_UPDATE_BACKEND_DNF5_AUTOMATIC = 2;
  // dnf-automatic(8) on DNF4.
  OS_UPDATE_BACKEND_DNF4_AUTOMATIC = 3;
}
// Closed set of lindm-owned native objects. Paths are fixed by the provider.
enum OSUpdateNativeFile {
  OS_UPDATE_NATIVE_FILE_UNSPECIFIED = 0;
  // /etc/lindm/os-update/policy.binpb, the runner's validated policy.
  OS_UPDATE_NATIVE_FILE_POLICY = 1;
  // /etc/systemd/system/lindm-os-update.timer, the maintenance window calendar.
  OS_UPDATE_NATIVE_FILE_TIMER = 2;
  // /etc/systemd/system/timers.target.d/lindm-os-update.conf (Wants= the timer).
  OS_UPDATE_NATIVE_FILE_TIMER_WANTS = 3;
  // /etc/apt/apt.conf.d/99lindm-os-update: disables APT::Periodic unattended
  // upgrades so installation happens only inside the lindm window.
  OS_UPDATE_NATIVE_FILE_APT_PERIODIC = 4;
  // /etc/dnf/automatic.conf on DNF5 (Fedora), a %ghost file dnf5 automatic
  // reads last; it fixes upgrade_type, reboot=never and stdio emission.
  OS_UPDATE_NATIVE_FILE_DNF5_AUTOMATIC = 5;
}
message OSUpdateFileObservation {
  OSUpdateNativeFile kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  ManagedFileObservation state = 2 [(buf.validate.field).required = true];
  bytes content_sha256 = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).bytes.len = 32
  ];
  option (buf.validate.message).cel = {
    id: "os_update_file.content"
    message: "existing owned files carry a content digest"
    expression: "this.state.exists == (this.content_sha256.size() == 32)"
  };
}
// Configuration state only. Volatile patch facts (pending updates, reboot
// required, last run) are inventory (lindm.agent.v1.PatchStatusObservation).
message OSUpdateObservation {
  reserved 1 to 8;
  reserved "source", "deployments", "kernel_release", "boot_id", "inhibitors", "drain_receipt", "reboot_required", "native_database_revision";
  OSUpdateBackend backend = 9 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  // Native automatic-update package version, e.g. "unattended-upgrades 2.9.1".
  string native_version = 10 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[^\\x00-\\x1f\\x7f]*$"
  }];
  // Decoded lindm-owned policy file; absent when missing or invalid.
  OSUpdateDesired effective = 11;
  repeated OSUpdateFileObservation files = 12 [(buf.validate.field).repeated.max_items = 4];
  // lindm-os-update.timer is loaded from the owned file and active (waiting).
  bool timer_active = 13;
  // systemd's loaded TimersCalendar specification(s), joined by "; ".
  string timer_calendar = 14 [(buf.validate.field).string.max_len = 2048];
  // Native automatic-update schedulers that are enabled or active and would
  // install outside the window (for example dnf5-automatic.timer).
  repeated string conflicting_units = 15 [(buf.validate.field).repeated = {
    max_items: 8
    unique: true
    items: {
      string: {pattern: "^[a-zA-Z0-9@_.-]{1,128}[.](timer|service)$"}
    }
  }];
  // needrestart (APT) or dnf needs-restarting (RPM) is installed.
  bool reboot_oracle_available = 16;
  option (buf.validate.message).cel = {
    id: "os_update_observation.files"
    message: "owned file kinds are unique"
    expression: "this.files.all(f, this.files.filter(g, g.kind == f.kind).size() == 1)"
  };
}
message NativeModuleVersion {
