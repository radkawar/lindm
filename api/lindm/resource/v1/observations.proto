message PublicCertificate {
  bytes der = 1 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 16384
  }];
  bytes serial_number = 2 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 32
  }];
  repeated CertificatePurpose eku = 3 [(buf.validate.field).repeated = {
    max_items: 4
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: 0
      }
    }
  }];
  repeated SubjectAlternativeName sans = 4 [(buf.validate.field).repeated.max_items = 64];
  google.protobuf.Timestamp not_before = 5 [(buf.validate.field).required = true];
  google.protobuf.Timestamp not_after = 6 [(buf.validate.field).required = true];
  option (buf.validate.message).cel = {
    id: "public_certificate.validity"
    message: "certificate validity must be ordered"
    expression: "this.not_before < this.not_after"
  };
}
message CertificateEnrollmentObservation {
