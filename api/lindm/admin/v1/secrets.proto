syntax = "proto3";

package lindm.admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "lindm/agent/v1/secret_delivery.proto";
import "lindm/resource/v1/common.proto";
import "lindm/validation/v1/string_rules.proto";

option go_package = "lindm/gen/lindm/admin/v1;adminv1";

// Metadata only. Material, ciphertext and digests are never projected.
message SecretSummary {
  string secret_id = 1;
  lindm.resource.v1.SecretPurpose purpose = 2;
  string display_name = 3;
  // Immutable server-generated binding every SecretRef must repeat.
  string subject_binding_id = 4;
  uint64 current_version = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string created_by = 8;
  string created_by_display_name = 9;
}

message SecretVersionSummary {
  uint64 version = 1;
  google.protobuf.Timestamp created_at = 2;
  string created_by = 3;
  string created_by_display_name = 4;
  string reason = 5;
}

// Purpose-to-material shape is checked here; the server re-checks stored purpose.
message CreateSecretRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  lindm.resource.v1.SecretPurpose purpose = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string display_name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[^\\x00-\\x1f\\x7f]+$"
  }];
  lindm.agent.v1.SecretMaterial material = 4 [(buf.validate.field).required = true];
  string reason = 5 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
  option (buf.validate.message).cel = {
    id: "create_secret.purpose_material"
    message: "secret material must match its purpose"
    expression: "this.purpose == 1 ? has(this.material.password_hash) : (this.purpose == 2 ? has(this.material.wifi_psk) : has(this.material.opaque))"
  };
}
message CreateSecretResponse {
  SecretSummary secret = 1;
}

// Appends version expected_version + 1. Existing versions remain immutable.
message RotateSecretRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string secret_id = 2 [(buf.validate.field).string.uuid = true];
  uint64 expected_version = 3 [(buf.validate.field).uint64.gt = 0];
  lindm.agent.v1.SecretMaterial material = 4 [(buf.validate.field).required = true];
  string reason = 5 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
}
message RotateSecretResponse {
  SecretSummary secret = 1;
}

message ListSecretsRequest {
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 200];
  string page_token = 2 [(buf.validate.field).string.max_len = 512];
}
message ListSecretsResponse {
  repeated SecretSummary secrets = 1;
  string next_page_token = 2;
}

message GetSecretRequest {
  string secret_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetSecretResponse {
  SecretSummary secret = 1;
  // Newest first, at most 100.
  repeated SecretVersionSummary versions = 2;
}

// Return material must remain memory-only, outside query caches, URLs and logs.
message RevealSecretRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string secret_id = 2 [(buf.validate.field).string.uuid = true];
  uint64 version = 3 [(buf.validate.field).uint64.gt = 0];
  string reason = 4 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
  string approval_id = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}
message RevealSecretResponse {
  lindm.agent.v1.SecretMaterial material = 1;
  lindm.resource.v1.SecretPurpose purpose = 2;
}

message LocalAdminPasswordPolicy {
  string account_name = 1 [(buf.validate.field).string = {
    pattern: "^[a-zA-Z_][a-zA-Z0-9_.-]{0,31}$"
    not_in: ["root"]
  }];
  google.protobuf.Duration rotation_interval = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration = {
      gte: {seconds: 86400}
      lte: {seconds: 31536000}
    }
  ];
  google.protobuf.Duration post_reveal_rotation_delay = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration = {
      gte: {}
      lte: {seconds: 86400}
    }
  ];
}

message SetLocalAdminPasswordPolicyRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string device_id = 2 [(buf.validate.field).string.uuid = true];
  LocalAdminPasswordPolicy policy = 3 [(buf.validate.field).required = true];
  string reason = 4 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
}
message SetLocalAdminPasswordPolicyResponse {
  LocalAdminPasswordStatus status = 1;
}

// Stops future rotations. Escrowed passwords remain revealable.
message RemoveLocalAdminPasswordPolicyRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string device_id = 2 [(buf.validate.field).string.uuid = true];
  string reason = 3 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
}
message RemoveLocalAdminPasswordPolicyResponse {}

message RequestLocalAdminPasswordRotationRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string device_id = 2 [(buf.validate.field).string.uuid = true];
  string reason = 3 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
}
message RequestLocalAdminPasswordRotationResponse {
  LocalAdminPasswordStatus status = 1;
}

enum LocalAdminPasswordState {
  LOCAL_ADMIN_PASSWORD_STATE_UNSPECIFIED = 0;
  // Stored by the server; the device has not yet reported setting it.
  LOCAL_ADMIN_PASSWORD_STATE_ESCROWED = 1;
  // Verified set on the device and newest such password.
  LOCAL_ADMIN_PASSWORD_STATE_CURRENT = 2;
  // A later password was verified set.
  LOCAL_ADMIN_PASSWORD_STATE_SUPERSEDED = 3;
  // Native set was interrupted; it may or may not be in effect.
  LOCAL_ADMIN_PASSWORD_STATE_UNKNOWN = 4;
  // Verified never set on the device.
  LOCAL_ADMIN_PASSWORD_STATE_FAILED = 5;
}

message LocalAdminPasswordEscrow {
  string action_id = 1;
  string account_name = 2;
  uint32 account_uid = 3;
  LocalAdminPasswordState state = 4;
  google.protobuf.Timestamp escrowed_at = 5;
  google.protobuf.Timestamp settled_at = 6;
  google.protobuf.Timestamp last_revealed_at = 7;
}

message LocalAdminPasswordStatus {
  string device_id = 1;
  // Absent when no policy is configured.
  LocalAdminPasswordPolicy policy = 2;
  google.protobuf.Timestamp rotation_due_at = 3;
  // Nonempty when automatic rotation is blocked, e.g. policy_authority_changed.
  string blocked_reason = 4;
  string policy_actor_id = 5;
  string policy_actor_display_name = 6;
  // Newest first, at most 20.
  repeated LocalAdminPasswordEscrow escrows = 7;
  // Configured server escrow transport key; empty disables rotation.
  string escrow_key_id = 8;
}

message GetLocalAdminPasswordStatusRequest {
  string device_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetLocalAdminPasswordStatusResponse {
  LocalAdminPasswordStatus status = 1;
}

// Return bytes must remain memory-only, outside query caches, URLs and logs.
message RevealLocalAdminPasswordRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string device_id = 2 [(buf.validate.field).string.uuid = true];
  string action_id = 3 [(buf.validate.field).string.uuid = true];
  string reason = 4 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
  string approval_id = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}
message RevealLocalAdminPasswordResponse {
  // Literal ASCII password bytes; the console zeroizes its copy on dismissal.
  bytes password = 1;
  LocalAdminPasswordEscrow escrow = 2;
  // Post-reveal rotation time, when a policy exists.
  google.protobuf.Timestamp rotation_due_at = 3;
}
