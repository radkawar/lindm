syntax = "proto3";

package lindm.admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "lindm/policy/v1/service_profile.proto";
import "lindm/validation/v1/string_rules.proto";

option go_package = "lindm/gen/lindm/admin/v1;adminv1";

// A published revision is immutable. Publishing changes the catalog head, not
// an assignment: devices remain pinned to explicitly activated revisions.
message ServiceProfileRevision {
  string profile_id = 1 [(buf.validate.field).string.uuid = true];
  string revision_id = 2 [(buf.validate.field).string.uuid = true];
  uint64 revision_number = 3 [(buf.validate.field).uint64.gt = 0];
  lindm.policy.v1.ServiceProfileSpec spec = 4 [(buf.validate.field).required = true];
  string actor_id = 5 [(buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp published_at = 6 [(buf.validate.field).required = true];
  bytes spec_sha256 = 7 [(buf.validate.field).bytes.len = 32];
}

message PublishServiceProfileRevisionRequest {
  string request_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.not_in = "00000000-0000-0000-0000-000000000000"
  ];
  // The caller reserves a stable profile UUID, including for the first revision.
  string profile_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.not_in = "00000000-0000-0000-0000-000000000000"
  ];
  // Absent creates a new profile; present must equal its current catalog head.
  optional string expected_revision_id = 3 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.not_in = "00000000-0000-0000-0000-000000000000"
  ];
  lindm.policy.v1.ServiceProfileSpec spec = 4 [(buf.validate.field).required = true];
  string reason = 5 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
}

message PublishServiceProfileRevisionResponse {
  // An exact retry returns the originally published revision, not a later head.
  ServiceProfileRevision revision = 1 [(buf.validate.field).required = true];
}

message GetServiceProfileRevisionRequest {
  string profile_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.not_in = "00000000-0000-0000-0000-000000000000"
  ];
  // Absent selects the catalog head; present reads that exact retained revision.
  optional string revision_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.not_in = "00000000-0000-0000-0000-000000000000"
  ];
}

message GetServiceProfileRevisionResponse {
  ServiceProfileRevision revision = 1 [(buf.validate.field).required = true];
}

message ListServiceProfilesRequest {
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 100];
  string page_token = 2 [(buf.validate.field).string.max_len = 512];
}

message ServiceProfileSummary {
  string profile_id = 1;
  string revision_id = 2;
  uint64 revision_number = 3;
  string name = 4;
  string description = 5;
  uint32 resource_count = 6;
  string actor_id = 7;
  google.protobuf.Timestamp published_at = 8;
  bytes spec_sha256 = 9;
}

message ListServiceProfilesResponse {
  // These are catalog heads, not evidence of deployment or native compliance.
  repeated ServiceProfileSummary profiles = 1;
  string next_page_token = 2;
}
