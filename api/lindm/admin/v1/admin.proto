syntax = "proto3";

package lindm.admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "lindm/admin/v1/advisories.proto";
import "lindm/admin/v1/approvals.proto";
import "lindm/admin/v1/approved_references.proto";
import "lindm/admin/v1/assignments.proto";
import "lindm/admin/v1/assistance.proto";
import "lindm/admin/v1/assistance_unattended.proto";
import "lindm/admin/v1/authorization.proto";
import "lindm/admin/v1/authz_groups.proto";
import "lindm/admin/v1/capabilities.proto";
import "lindm/admin/v1/device_actions.proto";
import "lindm/admin/v1/enrollment_grants.proto";
import "lindm/admin/v1/enrollment_instructions.proto";
import "lindm/admin/v1/enrollment_recovery.proto";
import "lindm/admin/v1/fleet_summary.proto";
import "lindm/admin/v1/inventory_management.proto";
import "lindm/admin/v1/offline_enrollment.proto";
import "lindm/admin/v1/profiles.proto";
import "lindm/admin/v1/provisioning.proto";
import "lindm/admin/v1/secrets.proto";
import "lindm/admin/v1/server_status.proto";
import "lindm/admin/v1/suggestions.proto";
import "lindm/admin/v1/targeting.proto";
import "lindm/agent/v1/execution_trust.proto";
import "lindm/agent/v1/trust.proto";
import "lindm/agent/v1/update.proto";
import "lindm/audit/v1/filter.proto";
import "lindm/inventory/v1/observation.proto";
import "lindm/validation/v1/string_rules.proto";

option go_package = "lindm/gen/lindm/admin/v1;adminv1";

service AdminService {
  rpc GetAuthorization(GetAuthorizationRequest) returns (GetAuthorizationResponse);
  rpc GetServerStatus(GetServerStatusRequest) returns (GetServerStatusResponse);
  rpc ConfirmRecoveryKeyCustody(ConfirmRecoveryKeyCustodyRequest) returns (ConfirmRecoveryKeyCustodyResponse);
  rpc UpdateAuthorization(UpdateAuthorizationRequest) returns (UpdateAuthorizationResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc GetFleetSummary(GetFleetSummaryRequest) returns (GetFleetSummaryResponse);
  rpc GetDevice(GetDeviceRequest) returns (GetDeviceResponse);
  rpc ListDevicePackages(ListDevicePackagesRequest) returns (ListDevicePackagesResponse);
  rpc SetDeviceMetadata(SetDeviceMetadataRequest) returns (SetDeviceMetadataResponse);
  rpc SetAttributeDefinition(SetAttributeDefinitionRequest) returns (SetAttributeDefinitionResponse);
  rpc ListAttributeDefinitions(ListAttributeDefinitionsRequest) returns (ListAttributeDefinitionsResponse);
  rpc ExportDevices(ExportDevicesRequest) returns (ExportDevicesResponse);
  rpc CreateEnrollmentGrant(CreateEnrollmentGrantRequest) returns (CreateEnrollmentGrantResponse);
  rpc ListEnrollmentGrants(ListEnrollmentGrantsRequest) returns (ListEnrollmentGrantsResponse);
  rpc GetEnrollmentInstructions(GetEnrollmentInstructionsRequest) returns (GetEnrollmentInstructionsResponse);
  rpc RevokeEnrollmentGrant(RevokeEnrollmentGrantRequest) returns (RevokeEnrollmentGrantResponse);
  rpc CreateProvisioningToken(CreateProvisioningTokenRequest) returns (CreateProvisioningTokenResponse);
  rpc ListProvisioningTokens(ListProvisioningTokensRequest) returns (ListProvisioningTokensResponse);
  rpc RevokeProvisioningToken(RevokeProvisioningTokenRequest) returns (RevokeProvisioningTokenResponse);
  rpc GetPendingEnrollments(GetPendingEnrollmentsRequest) returns (GetPendingEnrollmentsResponse);
  rpc ApprovePendingEnrollment(ApprovePendingEnrollmentRequest) returns (ApprovePendingEnrollmentResponse);
  rpc CreateRecoveryEnrollmentGrant(CreateRecoveryEnrollmentGrantRequest) returns (CreateRecoveryEnrollmentGrantResponse);
  rpc CreateOfflineEnrollmentAuthorization(CreateOfflineEnrollmentAuthorizationRequest) returns (CreateOfflineEnrollmentAuthorizationResponse);
  rpc ImportOfflineEnrollmentRequest(ImportOfflineEnrollmentRequestRequest) returns (ImportOfflineEnrollmentRequestResponse);
  rpc ExportOfflineEnrollmentResponse(ExportOfflineEnrollmentResponseRequest) returns (ExportOfflineEnrollmentResponseResponse);
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
  rpc CreateApproval(CreateApprovalRequest) returns (CreateApprovalResponse);
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  rpc ApproveApproval(ApproveApprovalRequest) returns (ApproveApprovalResponse);
  rpc RejectApproval(RejectApprovalRequest) returns (RejectApprovalResponse);
  rpc WithdrawApproval(WithdrawApprovalRequest) returns (WithdrawApprovalResponse);
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
  rpc ListAuditActors(ListAuditActorsRequest) returns (ListAuditActorsResponse);
  rpc ListAuditDevices(ListAuditDevicesRequest) returns (ListAuditDevicesResponse);
  rpc GetExecutionAuthority(GetExecutionAuthorityRequest) returns (GetExecutionAuthorityResponse);
  rpc UpdateExecutionAuthority(UpdateExecutionAuthorityRequest) returns (UpdateExecutionAuthorityResponse);
  // Device management capabilities granted to executors through signed
  // per-device capability policies (deployment and group scopes).
  rpc ListCapabilityPolicies(ListCapabilityPoliciesRequest) returns (ListCapabilityPoliciesResponse);
  rpc SetCapabilityPolicy(SetCapabilityPolicyRequest) returns (SetCapabilityPolicyResponse);
  rpc PublishProfileRevision(PublishProfileRevisionRequest) returns (PublishProfileRevisionResponse);
  rpc GetProfileRevision(GetProfileRevisionRequest) returns (GetProfileRevisionResponse);
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  rpc ListProfileRevisions(ListProfileRevisionsRequest) returns (ListProfileRevisionsResponse);
  rpc ListQualifiedResourceKinds(ListQualifiedResourceKindsRequest) returns (ListQualifiedResourceKindsResponse);
  rpc SetResourceAssignment(SetResourceAssignmentRequest) returns (SetResourceAssignmentResponse);
  rpc GetDeviceResourceState(GetDeviceResourceStateRequest) returns (GetDeviceResourceStateResponse);
  rpc PutDynamicGroup(PutDynamicGroupRequest) returns (PutDynamicGroupResponse);
  rpc GetDynamicGroup(GetDynamicGroupRequest) returns (GetDynamicGroupResponse);
  rpc ListDynamicGroups(ListDynamicGroupsRequest) returns (ListDynamicGroupsResponse);
  rpc PreviewDynamicGroup(PreviewDynamicGroupRequest) returns (PreviewDynamicGroupResponse);
  rpc PutTargetAssignment(PutTargetAssignmentRequest) returns (PutTargetAssignmentResponse);
  rpc ListTargetAssignments(ListTargetAssignmentsRequest) returns (ListTargetAssignmentsResponse);
  rpc PreviewTargetAssignments(PreviewTargetAssignmentsRequest) returns (PreviewTargetAssignmentsResponse);
  rpc PreviewTargetAssignmentImpact(PreviewTargetAssignmentImpactRequest) returns (PreviewTargetAssignmentImpactResponse);
  rpc StartRollout(StartRolloutRequest) returns (StartRolloutResponse);
  rpc ListRolloutDevices(ListRolloutDevicesRequest) returns (ListRolloutDevicesResponse);
  rpc ActivateTargetPreview(ActivateTargetPreviewRequest) returns (ActivateTargetPreviewResponse);
  rpc PutRollout(PutRolloutRequest) returns (PutRolloutResponse);
  rpc ControlRollout(ControlRolloutRequest) returns (ControlRolloutResponse);
  rpc ListRollouts(ListRolloutsRequest) returns (ListRolloutsResponse);
  rpc CreateDeviceAction(CreateDeviceActionRequest) returns (CreateDeviceActionResponse);
  rpc PreflightDeviceAction(PreflightDeviceActionRequest) returns (PreflightDeviceActionResponse);
  rpc GetDeviceActions(GetDeviceActionsRequest) returns (GetDeviceActionsResponse);
  rpc GetDeviceAction(GetDeviceActionRequest) returns (GetDeviceActionResponse);
  rpc CreateAssistanceSession(CreateAssistanceSessionRequest) returns (CreateAssistanceSessionResponse);
  rpc ListAssistanceSessions(ListAssistanceSessionsRequest) returns (ListAssistanceSessionsResponse);
  rpc GetAssistanceSession(GetAssistanceSessionRequest) returns (GetAssistanceSessionResponse);
  rpc JoinAssistanceSession(JoinAssistanceSessionRequest) returns (JoinAssistanceSessionResponse);
  rpc AnswerAssistanceSession(AnswerAssistanceSessionRequest) returns (AnswerAssistanceSessionResponse);
  rpc StopAssistanceSession(StopAssistanceSessionRequest) returns (StopAssistanceSessionResponse);
  rpc GetAssistancePolicy(GetAssistancePolicyRequest) returns (GetAssistancePolicyResponse);
  rpc UpdateAssistancePolicy(UpdateAssistancePolicyRequest) returns (UpdateAssistancePolicyResponse);
  rpc RunAssistanceCommand(RunAssistanceCommandRequest) returns (RunAssistanceCommandResponse);
  rpc GetAssistanceCommand(GetAssistanceCommandRequest) returns (GetAssistanceCommandResponse);
  rpc StartAssistanceFileTransfer(StartAssistanceFileTransferRequest) returns (StartAssistanceFileTransferResponse);
  rpc GetAssistanceFileTransfer(GetAssistanceFileTransferRequest) returns (GetAssistanceFileTransferResponse);
  rpc CancelAssistanceFileTransfer(CancelAssistanceFileTransferRequest) returns (CancelAssistanceFileTransferResponse);
  rpc ReconnectAssistanceSession(ReconnectAssistanceSessionRequest) returns (ReconnectAssistanceSessionResponse);
  // Recording metadata is fleet-readable; content and deletion require their
  // own scoped permissions and never grant live assistance.
  rpc ListAssistanceRecordings(ListAssistanceRecordingsRequest) returns (ListAssistanceRecordingsResponse);
  rpc OpenAssistanceRecording(OpenAssistanceRecordingRequest) returns (OpenAssistanceRecordingResponse);
  rpc ReadAssistanceRecording(ReadAssistanceRecordingRequest) returns (ReadAssistanceRecordingResponse);
  rpc DeleteAssistanceRecording(DeleteAssistanceRecordingRequest) returns (DeleteAssistanceRecordingResponse);
  // Consumes an approval decided by a different person with
  // remote_assistance.unattended.approve; the requester never approves.
  rpc AuthorizeUnattendedAssistance(AuthorizeUnattendedAssistanceRequest) returns (AuthorizeUnattendedAssistanceResponse);
  rpc ListUnattendedAssistance(ListUnattendedAssistanceRequest) returns (ListUnattendedAssistanceResponse);
  rpc RevokeUnattendedAssistance(RevokeUnattendedAssistanceRequest) returns (RevokeUnattendedAssistanceResponse);
  // Whether a new request can reach a person on the device, and the evidence.
  rpc GetAssistanceReadiness(GetAssistanceReadinessRequest) returns (GetAssistanceReadinessResponse);
  rpc GetDeviceEncryption(GetDeviceEncryptionRequest) returns (GetDeviceEncryptionResponse);
  rpc ListDeviceStorageTargets(ListDeviceStorageTargetsRequest) returns (ListDeviceStorageTargetsResponse);
  rpc RevealRecoveryKey(RevealRecoveryKeyRequest) returns (RevealRecoveryKeyResponse);
  // Deployment-global secret custody. Listing never returns material.
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);
  rpc RotateSecret(RotateSecretRequest) returns (RotateSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  rpc RevealSecret(RevealSecretRequest) returns (RevealSecretResponse);
  rpc ListSecretUses(ListSecretUsesRequest) returns (ListSecretUsesResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  // Managed local-admin passwords escrowed by the device.
  rpc SetLocalAdminPasswordPolicy(SetLocalAdminPasswordPolicyRequest) returns (SetLocalAdminPasswordPolicyResponse);
  rpc RemoveLocalAdminPasswordPolicy(RemoveLocalAdminPasswordPolicyRequest) returns (RemoveLocalAdminPasswordPolicyResponse);
  rpc RequestLocalAdminPasswordRotation(RequestLocalAdminPasswordRotationRequest) returns (RequestLocalAdminPasswordRotationResponse);
  rpc GetLocalAdminPasswordStatus(GetLocalAdminPasswordStatusRequest) returns (GetLocalAdminPasswordStatusResponse);
  rpc RevealLocalAdminPassword(RevealLocalAdminPasswordRequest) returns (RevealLocalAdminPasswordResponse);
  rpc ListDeviceGroups(ListDeviceGroupsRequest) returns (ListDeviceGroupsResponse);
  rpc SetDeviceGroup(SetDeviceGroupRequest) returns (SetDeviceGroupResponse);
  rpc DeleteDeviceGroup(DeleteDeviceGroupRequest) returns (DeleteDeviceGroupResponse);
  rpc ListDeviceFindings(ListDeviceFindingsRequest) returns (ListDeviceFindingsResponse);
  rpc ListDeviceUncoveredPackages(ListDeviceUncoveredPackagesRequest) returns (ListDeviceUncoveredPackagesResponse);
  rpc ListAdvisorySummary(ListAdvisorySummaryRequest) returns (ListAdvisorySummaryResponse);
  rpc ListAdvisoryFeeds(ListAdvisoryFeedsRequest) returns (ListAdvisoryFeedsResponse);
  rpc AcceptAdvisoryFinding(AcceptAdvisoryFindingRequest) returns (AcceptAdvisoryFindingResponse);
  // Recorded values for choosing instead of typing; authorization is per field.
  rpc SuggestValues(SuggestValuesRequest) returns (SuggestValuesResponse);
  // Approved home roots and package sources devices report, chosen by name.
  rpc ListApprovedReferences(ListApprovedReferencesRequest) returns (ListApprovedReferencesResponse);
}

enum DeviceState {
  DEVICE_STATE_UNSPECIFIED = 0;
  DEVICE_STATE_PENDING = 1;
  DEVICE_STATE_ACTIVE = 2;
  DEVICE_STATE_REVOKED = 3;
  DEVICE_STATE_RECOVERY_HOLD = 4;
}

message Device {
  reserved 7, 10;
  reserved "state", "inventory_sequence";
  string id = 1;
  string enrollment_generation = 2;
  string hostname = 3;
  string os_id = 4;
  string os_version = 5;
  string architecture = 6;
  DeviceState lifecycle_state = 11;
  google.protobuf.Timestamp enrolled_at = 8;
  google.protobuf.Timestamp last_seen_at = 9;
  // Latest successful field values only. Failures do not clear them.
  uint64 host_sequence = 12;
  uint64 package_sequence = 13;
  google.protobuf.Timestamp host_received_at = 14;
  google.protobuf.Timestamp package_attempt_received_at = 15;
  google.protobuf.Timestamp snapshot_received_at = 16;
  // Sequence of the current published snapshot. Zero means none has been published.
  uint64 published_snapshot_sequence = 17;
  DeviceMetadata metadata = 18;
  // Populated by ListDevices and ExportDevices; live rather than cursor-frozen.
  DeviceCompliance compliance = 19;
  // Oldest successful server-received verification across all current-head
  // resources. Absent if unassigned or any resource has never been verified.
  // This is historical evidence, not a claim that compliance is currently fresh.
  google.protobuf.Timestamp last_verified_at = 20;
  // Current generation's latest accepted device-signed session acquisition.
  // Empty release/zero protocol mean unreported; absent time means no acquisition.
  // This is reported build identity, not server-verified executable integrity.
  string agent_release = 21 [(buf.validate.field).string.max_len = 128];
  uint32 agent_protocol_version = 22 [(buf.validate.field).uint32.lte = 2147483647];
  google.protobuf.Timestamp agent_version_accepted_at = 23;
  // Populated by ListDevices and ExportDevices from the current generation's
  // latest successful host observation; UNKNOWN when never reported.
  DeviceRootEncryption root_encryption = 24 [(buf.validate.field).enum.defined_only = true];
  // Current generation's latest reported OS update status. Absent when never
  // reported or the update backend was unavailable on the device.
  DeviceUpdateStatus updates = 25;
  // Open advisory findings of the current, fresh evaluation minus active
  // exceptions. Absent when the device has no current advisory evaluation.
  DeviceFindingCounts findings = 26;
  // Populated by GetDevice for revoked devices: when, and by whom, the device
  // was revoked. An empty display name means the revoker was not recorded.
  google.protobuf.Timestamp revoked_at = 27;
  string revoked_by_display_name = 28 [(buf.validate.field).string.max_len = 512];
  // Operating system as administrators name it ("Ubuntu 24.04 LTS", "RHEL 9.4"),
  // from the platform registry; empty when the reported release is not registered.
  string os_name = 29 [(buf.validate.field).string.max_len = 128];
}

// Encryption of the filesystem mounted at "/", as the agent classified it:
// LUKS or dm-crypt on the root or one of its ancestors is ENCRYPTED, an observed
// root without a known encryption signature is NOT_ENCRYPTED. Missing storage
// evidence, a failed collection or no observed root is UNKNOWN, never a guess.
enum DeviceRootEncryption {
  DEVICE_ROOT_ENCRYPTION_UNSPECIFIED = 0;
  DEVICE_ROOT_ENCRYPTION_UNKNOWN = 1;
  DEVICE_ROOT_ENCRYPTION_ENCRYPTED = 2;
  DEVICE_ROOT_ENCRYPTION_NOT_ENCRYPTED = 3;
}

message DeviceUpdateStatus {
  uint32 pending_updates = 1 [(buf.validate.field).uint32.lte = 100000];
  uint32 pending_security_updates = 2 [(buf.validate.field).uint32.lte = 100000];
  bool reboot_required = 3;
  // Server receipt of the observation that carried this status.
  google.protobuf.Timestamp received_at = 4;
  // Older than the fleet patch freshness bound; counts may be out of date.
  bool stale = 5;
}

message DeviceFindingCounts {
  uint32 critical = 1;
  uint32 high = 2;
  uint32 medium = 3;
  uint32 low = 4;
  uint32 other = 5;
  // Only verified base-archive packages were matched; others are unchecked.
  bool partial = 6;
}

message ListDevicesRequest {
  option (buf.validate.message).cel = {
    id: "list_devices.advisory_scope"
    message: "advisory_id and advisory_severity must be set together"
    expression: "(this.advisory_id == '') == (this.advisory_severity == '')"
  };
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 200];
  string page_token = 2 [(buf.validate.field).string.max_len = 512];
  DeviceFilter filter = 3;
  DeviceSort sort = 4;
  // Case-insensitive literal substring of the hostname; empty disables it.
  string hostname_search = 5 [(buf.validate.field).string = {
    max_len: 253
    not_contains: "\000"
  }];
  // Current affected devices for this exact advisory and vendor severity.
  // Active exceptions exclude only the findings they accept. Empty disables it.
  string advisory_id = 6 [(buf.validate.field).string = {
    max_len: 128
    not_contains: "\000"
  }];
  string advisory_severity = 7 [(buf.validate.field).string = {
    max_len: 64
    not_contains: "\000"
  }];
}
message ListDevicesResponse {
  repeated Device devices = 1;
  string next_page_token = 2;
  // Echo to revisit this keyset range with the original cutoff and expiry.
  // Host projections and metadata remain live, not a frozen fleet snapshot.
  string page_token = 3;
  google.protobuf.Timestamp cursor_expires_at = 4;
}

message GetDeviceRequest {
  string device_id = 1 [(buf.validate.field).string.uuid = true];
}

message HostObservationDetail {
  uint64 sequence = 1;
  lindm.inventory.v1.HostObservation observation = 2;
  google.protobuf.Timestamp received_at = 3;
}

message PackageAttemptDetail {
  uint64 sequence = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp finished_at = 3;
  google.protobuf.Timestamp received_at = 4;
  lindm.inventory.v1.CollectionStatus status = 5;
  string backend = 6;
  string snapshot_id = 7;
}

message PackageSnapshotDetail {
  string snapshot_id = 1;
  uint64 sequence = 2;
  lindm.inventory.v1.SnapshotState state = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
  google.protobuf.Timestamp received_at = 7;
  google.protobuf.Timestamp committed_at = 8;
  google.protobuf.Timestamp superseded_at = 9;
  string backend = 10;
  uint32 package_count = 11;
  uint32 batch_count = 12;
  uint64 encoded_bytes = 13;
  // False means retained package rows are gone. package_count remains the
  // manifest count and must not be read as a successful empty collection.
  bool packages_available = 14;
}

message GetDeviceResponse {
  Device device = 1;
  // Absent when no host observation has been accepted.
  HostObservationDetail host = 2;
  // Absent when no package attempt has been completed.
  PackageAttemptDetail package_attempt = 3;
  // Absent when no snapshot has been published.
  PackageSnapshotDetail current_snapshot = 4;
  // Open upload, if one is still staging. Not a published inventory.
  PackageSnapshotDetail staging_snapshot = 5;
  // Absent means unknown. Reports are session-fenced telemetry, not health proof.
  lindm.agent.v1.AgentUpdateStatus agent_update = 6;
  google.protobuf.Timestamp agent_update_received_at = 7;
  // The caller's effective permissions whose device scope includes this device,
  // evaluated in the same read snapshot. Presentation only: each action is
  // authorized again when it is requested.
  repeated string caller_permissions = 8;
  // Absent before the device has an enrollment generation.
  DeviceCapabilityState capabilities = 9;
}

message ListDevicePackagesRequest {
  string device_id = 1 [(buf.validate.field).string.uuid = true];
  uint32 page_size = 2 [(buf.validate.field).uint32.lte = 200];
  // Empty selects the current snapshot and mints a cursor. An echoed token
  // revisits that page and must not rebind to a newer snapshot.
  string page_token = 3 [(buf.validate.field).string.max_len = 512];
  string manager = 4 [(buf.validate.field).string.max_len = 64];
  string name_prefix = 5 [(buf.validate.field).string.max_len = 512];
}

message DevicePackage {
  uint32 position = 1;
  string name = 2;
  string version = 3;
  string architecture = 4;
  string manager = 5;
  string source_name = 6;
  string source_version = 7;
  // Absent only on historical snapshots predating native module evidence.
  lindm.inventory.v1.ModuleObservation module = 8;
  // APT index origin evidence; absent only on historical snapshots.
  lindm.inventory.v1.PackageOrigin origin = 9;
}

message ListDevicePackagesResponse {
  string snapshot_id = 1;
  uint64 sequence = 2;
  repeated DevicePackage packages = 3;
  string next_page_token = 4;
  google.protobuf.Timestamp cursor_expires_at = 5;
  // Cursor for the start of this page, including the first page. Echo it to
  // revisit the same immutable snapshot. Expiry is fixed at mint.
  string page_token = 6;
}

message CreateEnrollmentGrantRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  uint32 lifetime_seconds = 2 [(buf.validate.field).uint32 = {
    gte: 60
    lte: 900
  }];
  string reason = 3 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
  // Optional human label. Nonempty names are unique among unrevoked grants.
  string name = 4 [(buf.validate.field).string = {
    max_len: 257
    not_contains: "\000"
  }];
}
message CreateEnrollmentGrantResponse {
  string grant_id = 1;
  string secret = 2;
  google.protobuf.Timestamp expires_at = 3;
  bool secret_delivery_unknown = 4;
}
message RevokeEnrollmentGrantRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string grant_id = 2 [(buf.validate.field).string.uuid = true];
  string reason = 3 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
}
message RevokeEnrollmentGrantResponse {}
message RevokeDeviceResponse {}
message AuditEvent {
  string id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string actor_id = 3;
  string action = 4;
  string resource_id = 5;
  string reason = 6;
  optional string target_device_id = 7 [(buf.validate.field).string.uuid = true];
  string device_hostname = 8 [(buf.validate.field).string.max_len = 4096];
  // Server-generated context, never appended to the operator's reason.
  // Assistance uses mode (view/control), duration_seconds and cause.
  map<string, string> details = 9 [(buf.validate.field).map = {
    max_pairs: 32
    keys: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
    values: {
      string: {max_len: 4096}
    }
  }];
  // Current account label, not immutable historical evidence or authority.
  string actor_display_name = 10;
  // For device_action.* events, the capability of the device action the event
  // records (for example "device.restart.v1"); empty otherwise. Display
  // context joined at read time, not part of the hash-bound audit payload.
  string device_action_capability = 11 [(buf.validate.field).string.max_len = 128];
}
message ListAuditEventsRequest {
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 200];
  string page_token = 2 [(buf.validate.field).string.max_len = 512];
  lindm.audit.v1.AuditFilter filter = 3;
}
message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
  string next_page_token = 2;
}

// Audit-only name lookups never grant account administration or fleet access.
// id is used alone by clients resolving a bookmarked selection.
message ListAuditActorsRequest {
  string name_prefix = 1 [(buf.validate.field).string.max_len = 128];
  string after_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  uint32 page_size = 3 [(buf.validate.field).uint32.lte = 100];
  optional string id = 4 [(buf.validate.field).string.uuid = true];
}
message AuditActor {
  string id = 1;
  string display_name = 2;
}
message ListAuditActorsResponse {
  repeated AuditActor actors = 1;
  string next_after_id = 2;
}
message ListAuditDevicesRequest {
  string name_prefix = 1 [(buf.validate.field).string.max_len = 128];
  string after_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  uint32 page_size = 3 [(buf.validate.field).uint32.lte = 100];
  optional string id = 4 [(buf.validate.field).string.uuid = true];
}
message AuditDevice {
  string id = 1;
  string hostname = 2;
}
message ListAuditDevicesResponse {
  repeated AuditDevice devices = 1;
  string next_after_id = 2;
}

message GetExecutionAuthorityRequest {}
message GetExecutionAuthorityResponse {
  // Absent root means this deployment has not provisioned execution authority.
  lindm.agent.v1.ExecutionRoot root = 1;
  lindm.agent.v1.ExecutionDelegation delegation = 2;
  google.protobuf.Timestamp accepted_at = 3;
  uint64 revision = 4;
}

message UpdateExecutionAuthorityResponse {
  // Exact retries return original acceptance, not a new authority lifetime.
  lindm.agent.v1.UpdateExecutionTrustResponse receipt = 1 [(buf.validate.field).required = true];
}
