syntax = "proto3";

package lindm.admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "lindm/admin/v1/inventory_management.proto";
import "lindm/validation/v1/string_rules.proto";

option go_package = "lindm/gen/lindm/admin/v1;adminv1";

// Boot-injected credentials must never be embedded in a reusable image.
message CreateProvisioningTokenRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  uint32 lifetime_seconds = 2 [(buf.validate.field).uint32 = {
    gte: 60
    lte: 86400
  }];
  uint32 max_uses = 3 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 10000
  }];
  bool approval_required = 4;
  string reason = 5 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
  DeviceMetadata metadata = 6;
  repeated string group_ids = 7 [(buf.validate.field).repeated = {
    max_items: 32
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
  // The service dispatcher has one immutable profile head per generation.
  repeated string profile_revision_ids = 8 [(buf.validate.field).repeated = {
    max_items: 1
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
  // Optional human label. Nonempty names are unique among unrevoked tokens.
  string name = 9 [(buf.validate.field).string = {
    max_len: 257
    not_contains: "\000"
  }];
}
message CreateProvisioningTokenResponse {
  string token_id = 1;
  string secret = 2;
  google.protobuf.Timestamp expires_at = 3;
  bool secret_delivery_unknown = 4;
}
message ProvisioningToken {
  string token_id = 1;
  string created_by = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  uint32 max_uses = 5;
  uint32 used_count = 6;
  bool approval_required = 7;
  google.protobuf.Timestamp revoked_at = 8;
  string reason = 9;
  DeviceMetadata metadata = 10;
  repeated string group_ids = 11;
  repeated string profile_revision_ids = 12;
  string creator_display_name = 13;
  string name = 14;
}
message ListProvisioningTokensRequest {
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 200];
  string page_token = 2 [(buf.validate.field).string.max_len = 512];
}
message ListProvisioningTokensResponse {
  repeated ProvisioningToken tokens = 1;
  string next_page_token = 2;
}
message RevokeProvisioningTokenRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string token_id = 2 [(buf.validate.field).string.uuid = true];
  string reason = 3 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
}
message RevokeProvisioningTokenResponse {}
message PendingEnrollment {
  string transaction_id = 1;
  string token_id = 2;
  string device_id = 3;
  string enrollment_generation = 4;
  string installation_id = 5;
  string approval_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp expires_at = 8;
  string state = 9;
  DeviceMetadata metadata = 10;
}
message GetPendingEnrollmentsRequest {
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 200];
  string page_token = 2 [(buf.validate.field).string.max_len = 512];
}
message GetPendingEnrollmentsResponse {
  repeated PendingEnrollment enrollments = 1;
  string next_page_token = 2;
}
// Exact immutable inbox payload. The requester executes after independent approval.
message ApprovePendingEnrollmentRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string transaction_id = 2 [(buf.validate.field).string.uuid = true];
  string device_id = 3 [(buf.validate.field).string.uuid = true];
  string reason = 4 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
  string approval_id = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}
message ApprovePendingEnrollmentResponse {}
