syntax = "proto3";

package lindm.admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "lindm/admin/v1/advisories.proto";
import "lindm/admin/v1/assignments.proto";
import "lindm/admin/v1/assistance_unattended.proto";
import "lindm/admin/v1/device_actions.proto";
import "lindm/admin/v1/enrollment_recovery.proto";
import "lindm/admin/v1/provisioning.proto";
import "lindm/admin/v1/secrets.proto";
import "lindm/admin/v1/targeting.proto";
import "lindm/agent/v1/execution_trust.proto";
import "lindm/policy/v1/targeting.proto";
import "lindm/validation/v1/string_rules.proto";

option go_package = "lindm/gen/lindm/admin/v1;adminv1";

message RevokeDeviceRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string device_id = 2 [(buf.validate.field).string.uuid = true];
  string reason = 3 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
  string approval_id = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message UpdateExecutionAuthorityRequest {
  lindm.agent.v1.UpdateExecutionTrustRequest update = 1 [(buf.validate.field).required = true];
  string reason = 2 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
  string approval_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

enum ApprovalState {
  APPROVAL_STATE_UNSPECIFIED = 0;
  APPROVAL_STATE_PENDING = 1;
  APPROVAL_STATE_APPROVED = 2;
  APPROVAL_STATE_REJECTED = 3;
  APPROVAL_STATE_CONSUMED = 4;
  APPROVAL_STATE_EXPIRED = 5;
  // The requester withdrew it before any decision.
  APPROVAL_STATE_WITHDRAWN = 6;
}

// Whether the evidence a request was proposed against still holds, decided by
// the server when the approval is read. Approval is refused while unavailable;
// rejection stays possible so the request can be closed.
enum ApprovalEvidenceState {
  // The request binds no retained evidence.
  APPROVAL_EVIDENCE_STATE_UNSPECIFIED = 0;
  APPROVAL_EVIDENCE_STATE_CURRENT = 1;
  // The device's current evaluation no longer reports the bound evidence (for
  // example, an advisory finding resolved or superseded by newer inventory).
  APPROVAL_EVIDENCE_STATE_UNAVAILABLE = 2;
}

message Approval {
  string id = 1;
  string requester_id = 2;
  string approver_id = 3;
  string action = 4;
  string permission = 5;
  string device_id = 6;
  bytes payload_sha256 = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp expires_at = 9;
  ApprovalState state = 10;
  string decision_reason = 11;
  oneof payload {
    RevokeDeviceRequest revoke_device = 12;
    SetResourceAssignmentRequest set_resource_assignment = 13;
    UpdateExecutionAuthorityRequest update_execution_authority = 14;
    CreateDeviceActionRequest create_device_action = 15;
    RevealRecoveryKeyRequest reveal_recovery_key = 16;
    ApprovePendingEnrollmentRequest approve_pending_enrollment = 17;
    CreateRecoveryEnrollmentGrantRequest recover_device = 18;
    ActivateTargetPreviewRequest activate_target_preview = 19;
    RevealSecretRequest reveal_secret = 23;
    RevealLocalAdminPasswordRequest reveal_local_admin_password = 24;
    AcceptAdvisoryFindingRequest accept_advisory_finding = 26;
    StartRolloutRequest start_rollout = 30;
    AuthorizeUnattendedAssistanceRequest authorize_unattended_assistance = 31;
  }
  // Current labels projected only for authorized approval responses.
  string requester_display_name = 20;
  string approver_display_name = 21;
  string device_hostname = 22;
  // Exact retained evidence for an activate_target_preview payload, when present.
  // It is not a fresh membership evaluation or permission to execute.
  lindm.policy.v1.TargetPreview target_preview = 25;
  // Exact finding identity when still retained; absence means evidence unavailable.
  AdvisoryFinding advisory_finding = 27;
  ApprovalEvidenceState evidence_state = 28;
  // The retained rollout and its reviewed device plan for a start_rollout payload.
  RolloutState rollout = 29;
}

message CreateApprovalRequest {
  uint32 lifetime_seconds = 1 [(buf.validate.field).uint32 = {
    gte: 60
    lte: 3600
  }];
  oneof payload {
    option (buf.validate.oneof).required = true;
    RevokeDeviceRequest revoke_device = 2;
    SetResourceAssignmentRequest set_resource_assignment = 3;
    UpdateExecutionAuthorityRequest update_execution_authority = 4;
    CreateDeviceActionRequest create_device_action = 5;
    RevealRecoveryKeyRequest reveal_recovery_key = 6;
    ApprovePendingEnrollmentRequest approve_pending_enrollment = 7;
    CreateRecoveryEnrollmentGrantRequest recover_device = 8;
    ActivateTargetPreviewRequest activate_target_preview = 9;
    RevealSecretRequest reveal_secret = 10;
    RevealLocalAdminPasswordRequest reveal_local_admin_password = 11;
    AcceptAdvisoryFindingRequest accept_advisory_finding = 12;
    StartRolloutRequest start_rollout = 13;
    AuthorizeUnattendedAssistanceRequest authorize_unattended_assistance = 14;
  }
}
message CreateApprovalResponse {
  Approval approval = 1;
}
message ListApprovalsRequest {
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 200];
  string page_token = 2 [(buf.validate.field).string.max_len = 512];
  // Only requests targeting this device, within the same authorized inbox.
  string device_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}
message ListApprovalsResponse {
  repeated Approval approvals = 1;
  string next_page_token = 2;
  // The authenticated principal viewing this page, not an asserted request field.
  string current_principal_id = 3;
}
message ApproveApprovalRequest {
  string approval_id = 1 [(buf.validate.field).string.uuid = true];
  string reason = 2 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
}
message ApproveApprovalResponse {
  Approval approval = 1;
}
message RejectApprovalRequest {
  string approval_id = 1 [(buf.validate.field).string.uuid = true];
  string reason = 2 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
}
message RejectApprovalResponse {
  Approval approval = 1;
}
// Only the requester may withdraw, and only while the request awaits a decision.
message WithdrawApprovalRequest {
  string approval_id = 1 [(buf.validate.field).string.uuid = true];
  string reason = 2 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
}
message WithdrawApprovalResponse {
  Approval approval = 1;
}
