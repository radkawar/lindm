syntax = "proto3";

package lindm.admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "lindm/agent/v1/service.proto";
import "lindm/agent/v1/service_execution.proto";
import "lindm/validation/v1/string_rules.proto";

option go_package = "lindm/gen/lindm/admin/v1;adminv1";

// One immutable desired head for one device enrollment generation. Its ID is
// the signed desired_revision. A cleared head stops issuing work; it never
// removes or restores native configuration.
message ServiceAssignment {
  string assignment_id = 1;
  string device_id = 2;
  string enrollment_generation = 3;
  // Both absent for a cleared head.
  string profile_id = 4;
  string revision_id = 5;
  uint64 revision_number = 6;
  string profile_name = 7;
  string actor_id = 8;
  google.protobuf.Timestamp assigned_at = 9;
  string reason = 10;
}

message SetServiceAssignmentRequest {
  string request_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.not_in = "00000000-0000-0000-0000-000000000000"
  ];
  string device_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.not_in = "00000000-0000-0000-0000-000000000000"
  ];
  // Absent requires that the device has never had an assignment; present must
  // equal its current head. Stale heads are rejected, not merged.
  optional string expected_assignment_id = 3 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.not_in = "00000000-0000-0000-0000-000000000000"
  ];
  // Exact retained revision. Absent with clear=true stops management.
  ServiceAssignmentTarget target = 4;
  bool clear = 5;
  string reason = 6 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
  option (buf.validate.message).cel = {
    id: "service_assignment.target_or_clear"
    message: "set exactly one of a profile revision target or clear"
    expression: "has(this.target) != this.clear"
  };
}

message ServiceAssignmentTarget {
  string profile_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.not_in = "00000000-0000-0000-0000-000000000000"
  ];
  string revision_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.not_in = "00000000-0000-0000-0000-000000000000"
  ];
}

message SetServiceAssignmentResponse {
  // Exact retry returns the original head, not a later one.
  ServiceAssignment assignment = 1 [(buf.validate.field).required = true];
}

message GetDeviceServiceStateRequest {
  string device_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.not_in = "00000000-0000-0000-0000-000000000000"
  ];
}

enum ServiceResourceDisposition {
  SERVICE_RESOURCE_DISPOSITION_UNSPECIFIED = 0;
  // Waiting for a device acquisition or a dependency to converge.
  SERVICE_RESOURCE_DISPOSITION_PENDING = 1;
  // An action is open on the server; signed device history may lag.
  SERVICE_RESOURCE_DISPOSITION_IN_PROGRESS = 2;
  // Latest verified device history for this head succeeded. Not live compliance.
  SERVICE_RESOURCE_DISPOSITION_SUCCEEDED = 3;
  // Native failure or uncertain outcome. No automatic retry; reassign to retry.
  SERVICE_RESOURCE_DISPOSITION_ATTENTION = 4;
  // Dependency failed or the assigning actor's authority changed.
  SERVICE_RESOURCE_DISPOSITION_BLOCKED = 5;
}

message ServiceActionSummary {
  string action_id = 1;
  uint64 resource_sequence = 2;
  google.protobuf.Timestamp issued_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  google.protobuf.Timestamp start_authorized_at = 5;
  // Server-side closure, if any: e.g. "result", "expired_unstarted",
  // "assignment_changed". Machine-readable snake_case.
  string closed_reason = 6;
  google.protobuf.Timestamp closed_at = 7;
  // Latest verified device-signed history. Absent until a report is accepted.
  lindm.agent.v1.ServiceExecutionStatus status = 8;
  uint64 action_revision = 9;
  google.protobuf.Timestamp attested_at = 10;
  google.protobuf.Timestamp received_at = 11;
}

message ServiceResourceState {
  string resource_id = 1;
  lindm.agent.v1.ServiceDesiredState desired = 2;
  repeated string depends_on = 3;
  ServiceResourceDisposition disposition = 4;
  // snake_case reason for PENDING/BLOCKED/ATTENTION; empty otherwise.
  string reason = 5;
  // Most recent action for this resource under the current head.
  ServiceActionSummary latest_action = 6;
}

// One recent server action for the device generation, across heads.
message DeviceServiceAction {
  string assignment_id = 1;
  string resource_id = 2;
  string unit = 3;
  ServiceActionSummary action = 4;
}

message GetDeviceServiceStateResponse {
  // Absent when the device has never been assigned.
  ServiceAssignment assignment = 1;
  repeated ServiceResourceState resources = 2;
  // Newest first, at most 50 actions for the current enrollment generation,
  // including actions closed by head changes or expiry.
  repeated DeviceServiceAction recent_actions = 3;
}
