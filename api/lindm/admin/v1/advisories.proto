syntax = "proto3";

package lindm.admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "lindm/advisory/v1/feed.proto";
import "lindm/validation/v1/string_rules.proto";

option go_package = "lindm/gen/lindm/admin/v1;adminv1";

// UNKNOWN means the inventory, source coverage or advisory feed cannot establish
// current exposure. ACCEPTED is time-limited risk acceptance, never a fix.
// PARTIAL is a device-level state only: exposure is known for the packages the
// applied feed covers and every other package is listed as uncovered.
enum AdvisoryFindingState {
  ADVISORY_FINDING_STATE_UNSPECIFIED = 0;
  ADVISORY_FINDING_STATE_AFFECTED = 1;
  ADVISORY_FINDING_STATE_ACCEPTED = 2;
  ADVISORY_FINDING_STATE_UNKNOWN = 3;
  ADVISORY_FINDING_STATE_CLEAR = 4;
  ADVISORY_FINDING_STATE_PARTIAL = 5;
}

message AdvisoryException {
  string actor_id = 1;
  string reason = 2;
  google.protobuf.Timestamp accepted_at = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message AdvisoryFinding {
  string id = 1;
  string advisory_id = 2;
  repeated string cves = 3;
  string package_name = 4;
  string installed_version = 5;
  string fixed_version = 6;
  string architecture = 7;
  string severity = 8;
  google.protobuf.Timestamp published_at = 9;
  AdvisoryFindingState state = 10;
  AdvisoryException exception = 11;
  string feed_id = 12;
  string source_url = 13;
  string reason = 14;
}

message AdvisoryFreshness {
  AdvisoryFindingState state = 1;
  string reason = 2;
  string snapshot_id = 3;
  google.protobuf.Timestamp inventory_at = 4;
  google.protobuf.Timestamp inventory_expires_at = 5;
  google.protobuf.Timestamp feed_checked_at = 6;
  google.protobuf.Timestamp feed_expires_at = 7;
  string feed_id = 8;
  string source_sha256 = 9;
  // Installed packages the applied feed does not cover (PARTIAL only).
  uint64 uncovered_packages = 10;
  bool refreshing = 11;
  google.protobuf.Timestamp refresh_started_at = 12;
  google.protobuf.Timestamp refresh_lease_expires_at = 13;
  // Scheduled network refresh is enabled; queued is not proof of a live download.
  bool refresh_enabled = 14;
  // Applied source has a recorded failed attempt; no error details are exposed.
  bool refresh_failed = 15;
}

// Order of a device's findings. UNSPECIFIED is SEVERITY: critical first, then
// newest published within a severity.
enum DeviceFindingSort {
  DEVICE_FINDING_SORT_UNSPECIFIED = 0;
  DEVICE_FINDING_SORT_SEVERITY = 1;
  DEVICE_FINDING_SORT_PUBLISHED = 2;
  DEVICE_FINDING_SORT_PACKAGE = 3;
}

message ListDeviceFindingsRequest {
  string device_id = 1 [(buf.validate.field).string.uuid = true];
  uint32 page_size = 2 [(buf.validate.field).uint32.lte = 200];
  // Bound to the evaluation, sort and filters it was issued for.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];
  DeviceFindingSort sort = 4 [(buf.validate.field).enum.defined_only = true];
  // ASCII case-insensitive prefix of the installed package name.
  string package_prefix = 5 [(buf.validate.field).string.max_len = 256];
  // ASCII case-insensitive prefix of the advisory ID or of any of its CVE IDs.
  string advisory_prefix = 6 [(buf.validate.field).string.max_len = 128];
}

// Findings matching the request's filters, across all pages, by vendor
// severity. Accepted findings (active exception) are counted only in accepted.
message DeviceFindingTotals {
  uint64 open = 1;
  uint64 critical = 2;
  uint64 high = 3;
  uint64 medium = 4;
  uint64 low = 5;
  uint64 unrated = 6;
  uint64 accepted = 7;
}

message ListDeviceFindingsResponse {
  repeated AdvisoryFinding findings = 1;
  string next_page_token = 2;
  AdvisoryFreshness freshness = 3;
  DeviceFindingTotals totals = 4;
}

message ListDeviceUncoveredPackagesRequest {
  string device_id = 1 [(buf.validate.field).string.uuid = true];
  uint32 page_size = 2 [(buf.validate.field).uint32.lte = 200];
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];
}
// UncoveredPackage is an installed package whose exposure is UNKNOWN because
// the applied feed does not cover its verified origin; reason is a stable code.
message UncoveredPackage {
  string name = 1;
  string version = 2;
  string architecture = 3;
  string reason = 4;
}
message ListDeviceUncoveredPackagesResponse {
  repeated UncoveredPackage packages = 1;
  string next_page_token = 2;
  AdvisoryFreshness freshness = 3;
}

message ListAdvisorySummaryRequest {
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 200];
  string page_token = 2 [(buf.validate.field).string.max_len = 1024];
}
message AdvisorySummary {
  string advisory_id = 1;
  string severity = 2;
  uint64 affected_devices = 3;
  uint64 accepted_devices = 4;
  uint64 unknown_devices = 5;
  repeated string cves = 6;
}

// Why an active device's current exposure is unknown. Each value names the
// stable AdvisoryFreshness.reason code of the same spelling; UNSPECIFIED is a
// reason this API version does not name.
enum AdvisoryUncheckedReason {
  ADVISORY_UNCHECKED_REASON_UNSPECIFIED = 0;
  // Not yet evaluated against its current inventory and source generation.
  ADVISORY_UNCHECKED_REASON_EVALUATION_PENDING = 1;
  ADVISORY_UNCHECKED_REASON_INVENTORY_UNAVAILABLE = 2;
  ADVISORY_UNCHECKED_REASON_INVENTORY_STALE = 3;
  ADVISORY_UNCHECKED_REASON_HOST_INVENTORY_STALE_OR_FAILED = 4;
  ADVISORY_UNCHECKED_REASON_PACKAGE_COLLECTION_FAILED = 5;
  // No enabled source applies to the device's OS release and architecture.
  ADVISORY_UNCHECKED_REASON_FEED_UNAVAILABLE = 6;
  ADVISORY_UNCHECKED_REASON_RHEL_PLATFORM_STREAM_UNAVAILABLE = 7;
  ADVISORY_UNCHECKED_REASON_FEED_STALE = 8;
  // The selected source is not a complete snapshot of the release's advisories.
  ADVISORY_UNCHECKED_REASON_FEED_PARTIAL_COVERAGE = 9;
  ADVISORY_UNCHECKED_REASON_SOURCE_PACKAGE_IDENTITY_MISSING = 10;
  ADVISORY_UNCHECKED_REASON_PACKAGE_ARCHITECTURE_UNCOVERED = 11;
  ADVISORY_UNCHECKED_REASON_PACKAGE_ORIGIN_UNAVAILABLE = 12;
  ADVISORY_UNCHECKED_REASON_PACKAGE_VERSION_UNRECOGNIZED = 13;
  ADVISORY_UNCHECKED_REASON_NATIVE_MODULE_IDENTITY_UNAVAILABLE = 14;
  ADVISORY_UNCHECKED_REASON_NATIVE_PACKAGE_INSTANCES_UNAVAILABLE = 15;
  ADVISORY_UNCHECKED_REASON_NATIVE_PRODUCT_PREDICATE_UNSATISFIED = 16;
  ADVISORY_UNCHECKED_REASON_ADVISORY_RECORD_INVALID = 17;
  ADVISORY_UNCHECKED_REASON_SOURCE_RECORD_REJECTED = 18;
  ADVISORY_UNCHECKED_REASON_VENDOR_ASSESSMENT_UNKNOWN = 19;
  ADVISORY_UNCHECKED_REASON_VENDOR_MODULE_BINDING_AMBIGUOUS = 20;
  ADVISORY_UNCHECKED_REASON_MATCHING_CAPACITY_EXCEEDED = 21;
}

// Active devices counted in unknown_devices that share one reason, OS release
// and selected source, using the device findings read-path precedence.
message AdvisoryUncheckedGroup {
  AdvisoryUncheckedReason reason = 1 [(buf.validate.field).enum.defined_only = true];
  // Selected source; empty when none applies or the device is not evaluated.
  string feed_id = 2;
  // Device os-release identity; empty values mean not yet known.
  string os_id = 3;
  string os_version = 4;
  // Platform registry display name, e.g. "Fedora 44"; empty when unregistered.
  string os_name = 5;
  uint64 devices = 6;
}

message ListAdvisorySummaryResponse {
  repeated AdvisorySummary advisories = 1;
  string next_page_token = 2;
  uint64 unknown_devices = 3;
  uint64 evaluated_devices = 4;
  // Devices whose current evaluation covers only part of their packages.
  uint64 partial_devices = 5;
  // The twenty largest groups, ordered by device count descending. Counts are
  // exact; unknown_devices minus their sum is in groups not listed.
  repeated AdvisoryUncheckedGroup unchecked_groups = 6 [(buf.validate.field).repeated.max_items = 20];
}

message ListAdvisoryFeedsRequest {}
message AdvisoryFeedStatus {
  string id = 1;
  string distro = 2;
  string release = 3;
  string source_url = 4;
  string source_sha256 = 5;
  google.protobuf.Timestamp checked_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp attempted_at = 8;
  string error = 9;
  bool fresh = 10;
  uint64 advisory_count = 11;
  string platform_stream = 12;
  repeated lindm.advisory.v1.FeedArtifact artifacts = 13;
  google.protobuf.Timestamp snapshot_at = 14;
  repeated lindm.advisory.v1.RejectedRecord rejected_records = 15;
  // Platform registry display name of distro/release, e.g. "Fedora 44"; empty
  // when the release is not registered.
  string os_name = 16;
  // A live, exact-configuration publication lease; not successful publication.
  bool refreshing = 17;
  google.protobuf.Timestamp refresh_started_at = 18;
  google.protobuf.Timestamp refresh_lease_expires_at = 19;
  bool refresh_enabled = 20;
}
message ListAdvisoryFeedsResponse {
  repeated AdvisoryFeedStatus feeds = 1;
}

message AcceptAdvisoryFindingRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string device_id = 2 [(buf.validate.field).string.uuid = true];
  string finding_id = 3 [(buf.validate.field).string.uuid = true];
  string reason = 4 [(buf.validate.field).string.(lindm.validation.v1.audit_reason) = true];
  // A risk acceptance that has already ended is refused when proposed or accepted.
  google.protobuf.Timestamp expires_at = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp.gt_now = true
  ];
  string approval_id = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}
message AcceptAdvisoryFindingResponse {
  AdvisoryException exception = 1;
}
