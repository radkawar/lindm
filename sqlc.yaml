version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/identity
    gen:
      go:
        package: identitydb
        out: internal/identity/identitydb
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/device
    gen:
      go:
        package: devicedb
        out: internal/device/devicedb
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
  - engine: sqlite
    schema: internal/agent/journal/schema.sql
    queries: internal/agent/journal/queries.sql
    gen:
      go:
        package: journaldb
        out: internal/agent/journal/journaldb
        emit_empty_slices: true
        omit_unused_structs: true
