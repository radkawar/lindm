version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
linters:
  default: standard
  enable:
    - bodyclose
    - sqlclosecheck
    - depguard
    # Copied code is extracted into a shared abstraction, never duplicated.
    - dupl
    - funlen
  settings:
    depguard:
      rules:
        lab-authenticator:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/devlab/**"
          deny:
            - pkg: "lindm/internal/devlab/webauthnlab"
              desc: "Software WebAuthn credentials are laboratory-only; production must use real clients."
        production-lab-boundary:
          files:
            - "$all"
            - "!$test"
            - "!**/cmd/dev/**"
            - "!**/cmd/lab/**"
            - "!**/internal/devlab/**"
            - "!**/internal/vmlab/**"
            - "!**/internal/loadlab/**"
            - "!**/internal/labhost/**"
          deny:
            - pkg: "lindm/internal/devlab"
              desc: "Development authentication and authority fixtures must not enter production binaries."
            - pkg: "lindm/internal/vmlab"
              desc: "VM qualification belongs only to laboratory entrypoints."
            - pkg: "lindm/internal/loadlab"
              desc: "Load qualification belongs only to laboratory entrypoints."
            - pkg: "lindm/internal/labhost"
              desc: "Lab host scheduling and remote execution belong only to laboratory entrypoints."
    errcheck:
      check-type-assertions: true
    funlen:
      lines: 120
      statements: -1
      ignore-comments: true
  exclusions:
    generated: strict
    rules:
      # funlen applies to product code only: tests and laboratory entry points are exempt.
      - path: _test\.go$
        linters: [funlen]
      - path: (^|/)internal/(vmlab|devlab|loadlab|labhost|deploylab)/
        linters: [funlen]
      - path: (^|/)cmd/(lab|dev)/
        linters: [funlen]
      # funlen baseline: reviewed product functions over 120 lines (2026-10-11).
      # This list may only shrink. Never add an entry; split the function into
      # meaningful named steps instead, then delete its entry here.
      - path: '(^|/)internal/advisory/feed/osv\.go$'
        text: "Function 'appendOSV' is too long"
        linters: [funlen]
      - path: '(^|/)internal/advisory/match\.go$'
        text: "Function 'evaluateOnce' is too long"
        linters: [funlen]
      - path: '(^|/)internal/advisory/match\.go$'
        text: "Function 'matchFindingSet' is too long"
        linters: [funlen]
      - path: '(^|/)internal/agent/accountprovider/helper_linux\.go$'
        text: "Function 'nativeCommands' is too long"
        linters: [funlen]
      - path: '(^|/)internal/agent/accountprovider/native_linux\.go$'
        text: "Function 'observeLocal' is too long"
        linters: [funlen]
      - path: '(^|/)internal/agent/accountprovider/target_linux\.go$'
        text: "Function 'target' is too long"
        linters: [funlen]
      - path: '(^|/)internal/agent/actionprovider/compliance_linux\.go$'
        text: "Function 'observeRootEncryption' is too long"
        linters: [funlen]
      - path: '(^|/)internal/agent/actionprovider/provider_linux\.go$'
        text: "Function 'observe' is too long"
        linters: [funlen]
      - path: '(^|/)internal/agent/definitionprovider/files_linux\.go$'
        text: "Function 'snapshot' is too long"
        linters: [funlen]
      - path: '(^|/)internal/agent/executor/device_action_execution\.go$'
        text: "Function 'beginDeviceAction' is too long"
        linters: [funlen]
      - path: '(^|/)internal/agent/executor/device_action_recovery\.go$'
        text: "Function 'prepareDeviceActionRecovery' is too long"
        linters: [funlen]
      - path: '(^|/)internal/agent/executor/identity\.go$'
