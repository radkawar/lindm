# Root-owned runtime directory. Group lindm can traverse to the executor
# socket. This is not private agent state and is not mode 0700.
d /run/lindm 0750 root lindm -
# Root-owned session-helper socket directory. Every local user may reach the
# 0666 socket; the executor authorizes by SO_PEERCRED and logind only.
d /run/lindm-session 0755 root root -
# Root-only: patch-now requests written by the executor and consumed by
# lindm-os-update-now.service, plus the runner's run.lock (never the
# world-writable /run/lock, where any user could pre-create it).
d /run/lindm/os-update 0700 root root -
# Parents of the os.update.v1 native objects. The resource provider never
# creates or removes them: the policy directory, the timer pull-in drop-in
# directory, and the runner's private state.
d /etc/lindm/os-update 0755 root root -
d /etc/systemd/system/timers.target.d 0755 root root -
d /var/lib/lindm/os-update 0700 root root -
